# F-23 fix: name updated to match DHCP hostname in dhcp-config.conf.
# ESPHome `name` sets the mDNS hostname (ventsys-main-fan.local) which HA uses
# to connect via the native API. A mismatch means HA cannot discover or connect
# to the device, and the ESPHome integration silently shows it as unavailable.
esphome:
  name: ventsys-main-fan
  friendly_name: VentSys Main Fan
esp32:
  board: esp32dev

mqtt:
  broker: 192.168.20.101   # HA on VLAN 20 — firewall allows iot_sensors→automation:8883
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  # Local CA certificate for TLS validation (no internet dependency)
  # Copy ca-cert.pem content into secrets.yaml as mqtt_ca_cert
  ca_certificate: !secret mqtt_ca_cert
  on_message:
    - topic: ventsys/fan/percent
      qos: 0
      then:
        - lambda: |-
            int pct = atoi(x.c_str());
            if (pct < 0) pct = 0; if (pct > 100) pct = 100;
            id(inline_fan_local).set_speed(pct);
            id(inline_fan_local).turn_on();
        - mqtt.publish:
            topic: ventsys/fan/percent_state
            payload: !lambda 'return x;'
    - topic: ventsys/fan/control
      qos: 0
      then:
        - lambda: |-
            if (x == "on") id(inline_fan_local).turn_on();
            else if (x == "off") id(inline_fan_local).turn_off();
        # Publish state back so HA fan entity state_topic receives on/off.
        # Without this ventsys/fan/state is never published and HA shows 'unknown'.
        - mqtt.publish:
            topic: ventsys/fan/state
            payload: !lambda 'return x;'
            retain: true

logger:

# ── TIME SYNC ────────────────────────────────────────────────────────────────
# Required for MQTT TLS certificate validation — ESP32 boots at 1970-01-01.
# A6-1 fix: added to match pattern established by ventsys_fdm_airflow.yaml.
time:
  - platform: homeassistant
    id: homeassistant_time

api:
  encryption:
    key: !secret api_key   # Required — prevents unauthenticated native API access

ota:
  platform: esphome
  password: !secret ota_password   # Required — prevents unauthorized firmware push

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  # F-23 fix: static IP updated to .21 to match canonical DHCP allocation for
  # ventsys-main-fan (was .81 — the old pre-canonical address, now superseded).
  # The DHCP reservation in dhcp-config.conf uses the same IP. If you previously
  # had a DHCP lease at .81 for this device, clear it from the router leases table.
  manual_ip:
    static_ip: 192.168.50.21
    gateway: 192.168.50.1
    subnet: 255.255.255.0

output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO23
    frequency: 25000Hz   # No space — ESPHome frequency parser requires no whitespace

fan:
  - platform: speed
    output: fan_pwm
    name: "Inline Fan (local)"
    id: inline_fan_local
    speed_count: 100

# H-1 fix: HA watchdog automations trigger on this sensor going offline.
# Entity ID generated by HA native API integration:
#   ventsys_fan_controller.yaml  -> binary_sensor.ventsys_main_fan_status
# (device name 'ventsys-main-fan' + entity name 'Status')
binary_sensor:
  - platform: status
    name: "Status"
