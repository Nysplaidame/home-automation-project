# VentSys Optional Package — Pressure-Based PID Control Loop
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  DO NOT LOAD YET — DRAFT ONLY                                       ║
# ║  This file is NOT included in configuration.yaml packages.          ║
# ║  Load only when all prerequisites below are satisfied.              ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# PURPOSE:
#   Provides a closed-loop pressure control system that monitors the
#   differential between enclosure barometric pressure and garage ambient
#   pressure, and uses that to drive valve positions toward a target
#   negative differential (slight under-pressure in the enclosure).
#
# HOW DIFFERENTIAL PRESSURE IS MEASURED:
#   - Enclosure pressure: BME680 on the sensor array board (enc1/enc2).
#     Published by printairpipe-controller.yaml to:
#       ventsys/fdm/baro_pressure  (FDM enclosure, hPa)
#       ventsys/sla/baro_pressure  (SLA enclosure, hPa)
#   - Reference pressure: BME680 on the garage ambient sensor board (.34).
#     Published by the garage sensor ESPHome YAML to:
#       ventsys/garage/baro_pressure  (hPa)
#   - Differential: calculated here in HA as a template sensor:
#       pressure_diff = enclosure_pressure - garage_pressure  (hPa)
#     A negative value means the enclosure is at lower pressure than the
#     garage — this is the desired state (fumes drawn inward, not leaking).
#
#   NOTE: This is SEPARATE from the ADC-based pressure_diff sensor in
#   printairpipe-controller.yaml (GPIO35). That is an airflow proxy used
#   only by the pressure_diff_fault automation to detect blocked valves.
#   These are two different measurements serving two different purposes.
#
# PREREQUISITES BEFORE LOADING:
#   1. printairpipe-controller.yaml deployed and publishing baro_pressure
#      to ventsys/fdm/baro_pressure and ventsys/sla/baro_pressure
#   2. Garage ambient sensor ESPHome YAML written and deployed, publishing
#      to ventsys/garage/baro_pressure
#   3. sensor.ventsys_fdm_baro_pressure, sensor.ventsys_sla_baro_pressure,
#      and sensor.ventsys_garage_baro_pressure confirmed as available
#      entities in HA Developer Tools before adding the template sensors
#   4. Baseline differential measured and target setpoints calibrated
#
# FIRMWARE REQUIRED (M-5 audit note): This package references entities that do
# not exist in any currently deployed firmware. Before loading, the following
# ESPHome devices must be deployed AND publishing to their MQTT topics:
#   - printairpipe-controller.yaml (ventsys-fdm-sensor + ventsys-sla-sensor boards)
#     Must publish to: ventsys/fdm/baro_pressure, ventsys/sla/baro_pressure
#   - ventsys_garage_sensor.yaml (ventsys-garage-sensor board)
#     Must publish to: ventsys/garage/baro_pressure
# Neither board publishes these topics with default config — baro_pressure
# publishing must be verified in the ESPHome YAML before flashing.
#
# TO LOAD: add to configuration.yaml packages block:
#   ventsys_optional: !include packages/ventsys_ha_optional.yaml

# ── MQTT SENSORS — raw barometric pressure from each location ─────────────
# These receive the BME680 absolute pressure readings published by firmware.
# Used as inputs to the template differential sensors below.
sensor:
  - platform: mqtt
    name: FDM Baro Pressure
    unique_id: ventsys_fdm_baro_pressure
    state_topic: "ventsys/fdm/baro_pressure"
    unit_of_measurement: "hPa"
    device_class: pressure
    expire_after: 120

  - platform: mqtt
    name: SLA Baro Pressure
    unique_id: ventsys_sla_baro_pressure
    state_topic: "ventsys/sla/baro_pressure"
    unit_of_measurement: "hPa"
    device_class: pressure
    expire_after: 120

  - platform: mqtt
    name: Garage Ambient Pressure
    unique_id: ventsys_garage_ambient_pressure
    # A6-4 fix: renamed unique_id from ventsys_garage_baro_pressure to
    # ventsys_garage_ambient_pressure. The main package (ventsys_ha_package.yaml)
    # already defines unique_id: ventsys_garage_baro_pressure for the same topic.
    # HA refuses to register the second entity when both packages are loaded,
    # logging a configuration error and silently dropping this entity. The rename
    # gives each a distinct unique_id. The entity_id this generates
    # (sensor.garage_ambient_pressure) is what the template sensors below
    # reference — this must remain consistent.
    state_topic: "ventsys/garage/baro_pressure"
    unit_of_measurement: "hPa"
    device_class: pressure
    expire_after: 120

# ── TEMPLATE SENSORS — computed differential pressures ───────────────────
# Differential = enclosure_pressure - garage_pressure (hPa).
# A negative result means enclosure is at lower pressure than ambient —
# the desired extraction state. Typical values: -0.01 to -0.10 hPa
# (~-1 to -10 Pa) when the fan is running and valves are open.
template:
  - sensor:
      - name: FDM Pressure Differential
        unique_id: ventsys_fdm_pressure_diff
        unit_of_measurement: "hPa"
        device_class: pressure
        state_class: measurement
        state: >
          {% set enc = states('sensor.fdm_baro_pressure') | float(none) %}
          {% set ref = states('sensor.garage_ambient_pressure') | float(none) %}
          {% if enc is not none and ref is not none %}
            {{ (enc - ref) | round(4) }}
          {% else %}
            unavailable
          {% endif %}

      - name: SLA Pressure Differential
        unique_id: ventsys_sla_pressure_diff
        unit_of_measurement: "hPa"
        device_class: pressure
        state_class: measurement
        state: >
          {% set enc = states('sensor.sla_baro_pressure') | float(none) %}
          {% set ref = states('sensor.garage_ambient_pressure') | float(none) %}
          {% if enc is not none and ref is not none %}
            {{ (enc - ref) | round(4) }}
          {% else %}
            unavailable
          {% endif %}

# ── NUMBER ENTITIES — PID control setpoints ──────────────────────────────
# FIX #20: state_topic added to all five entities so HA can restore
# last-commanded values from the broker after a restart.
# T-inlet and T-downstream are throttle threshold parameters for the control
# loop — sent to the ESP32 boards to adjust valve response sensitivity.
# Firmware must subscribe to these command topics and publish retained
# acknowledgements back to the corresponding state topics.
number:
  - platform: mqtt
    name: FDM T Inlet
    unique_id: ventsys_fdm_t_inlet
    command_topic: "ventsys/fdm/t_inlet/control"
    state_topic:   "ventsys/fdm/t_inlet/state"
    min: 0
    max: 100
    step: 1

  - platform: mqtt
    name: FDM T Downstream
    unique_id: ventsys_fdm_t_down
    command_topic: "ventsys/fdm/t_downstream/control"
    state_topic:   "ventsys/fdm/t_downstream/state"
    min: 0
    max: 100
    step: 1

  - platform: mqtt
    name: SLA T Inlet
    unique_id: ventsys_sla_t_inlet
    command_topic: "ventsys/sla/t_inlet/control"
    state_topic:   "ventsys/sla/t_inlet/state"
    min: 0
    max: 100
    step: 1

  - platform: mqtt
    name: SLA T Downstream
    unique_id: ventsys_sla_t_down
    command_topic: "ventsys/sla/t_downstream/control"
    state_topic:   "ventsys/sla/t_downstream/state"
    min: 0
    max: 100
    step: 1

  - platform: mqtt
    name: FDM Pressure Setpoint
    unique_id: ventsys_fdm_pressure_setpoint
    command_topic: "ventsys/fdm/pressure_setpoint"
    state_topic:   "ventsys/fdm/pressure_setpoint/state"
    # Target differential in hPa. Negative = enclosure below ambient.
    # Start conservatively at -0.02 hPa and adjust during calibration.
    min: -0.50
    max: 0.0
    step: 0.01

  - platform: mqtt
    name: SLA Pressure Setpoint
    unique_id: ventsys_sla_pressure_setpoint
    command_topic: "ventsys/sla/pressure_setpoint"
    state_topic:   "ventsys/sla/pressure_setpoint/state"
    min: -0.50
    max: 0.0
    step: 0.01

# ── LOOP ENABLE TOGGLES ───────────────────────────────────────────────────
# One per enclosure. Controls whether the PID loop on the ESP32 board is
# active. Off = manual valve control only. On = firmware adjusts valves
# automatically to maintain the pressure setpoint above.
input_boolean:
  ventsys_fdm_loop_enable:
    name: FDM Loop Enable
    icon: mdi:sync

  ventsys_sla_loop_enable:
    name: SLA Loop Enable
    icon: mdi:sync

# ── AUTOMATIONS — publish loop enable state to MQTT ──────────────────────
automation:
  - id: ventsys_fdm_loop_enable_pub
    alias: VentSys FDM Loop Enable to MQTT
    trigger:
      - platform: state
        entity_id: input_boolean.ventsys_fdm_loop_enable
    action:
      - action: mqtt.publish
        data:
          topic: "ventsys/fdm/loop_enable"
          payload: "{{ 'on' if is_state('input_boolean.ventsys_fdm_loop_enable','on') else 'off' }}"

  - id: ventsys_sla_loop_enable_pub
    alias: VentSys SLA Loop Enable to MQTT
    trigger:
      - platform: state
        entity_id: input_boolean.ventsys_sla_loop_enable
    action:
      - action: mqtt.publish
        data:
          topic: "ventsys/sla/loop_enable"
          payload: "{{ 'on' if is_state('input_boolean.ventsys_sla_loop_enable','on') else 'off' }}"
