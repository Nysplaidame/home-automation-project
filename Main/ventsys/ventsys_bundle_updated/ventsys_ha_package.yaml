# ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ SENSOR ENTITIES ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬ÃƒÂ¢Ã¢â‚¬ÂÃ¢â€šÂ¬
# FIX #7: automations.yaml referenced sensor.ventsys_enc1_smoke,
# sensor.ventsys_enc1_iaq, sensor.ventsys_enc1_temperature and
# sensor.ventsys_enc1_pressure_diff -- none of which existed in any package.
# MQTT sensor definitions are added here using the fdm_*/sla_* naming
# convention established by the risk sensors, with topics matching the
# ventsys/{enclosure}/{type} pattern used throughout. automations.yaml has
# been updated to use these entity IDs.
# G4 RESOLVED: topic names cross-verified against printairpipe-controller.yaml ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â all match.

sensor:
  # -- Risk state ------------------------------------------------------------
  # F-28 WARNING: These sensors subscribe to risk/state topics, but NO firmware
  # publishes to these topics anywhere in the current codebase. The ventsys_fire_risk_cutoff
  # automation (below) triggers on these sensors ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â it will NEVER fire until firmware
  # is written to publish FIRE_RISK payloads. Options:
  #   A) Add ESPHome binary_sensor logic in each sensor board YAML to publish
  #      "FIRE_RISK" / "NORMAL" to ventsys/{enc}/risk/state based on smoke/temp thresholds.
  #   B) Add a HA automation that watches sensor.fdm_smoke / sensor.fdm_iaq and
  #      publishes to ventsys/fdm/risk/state via mqtt.publish.
  # Until one of these is implemented, fire risk detection relies solely on the
  # smoke/temperature triggers in automations.yaml (Tier 1/2), not on this sensor.
  - platform: mqtt
    name: SLA Risk
    unique_id: ventsys_sla_risk
    state_topic: "ventsys/sla/risk/state"
  - platform: mqtt
    name: FDM Risk
    unique_id: ventsys_fdm_risk
    state_topic: "ventsys/fdm/risk/state"
  # A4-3 warning: NO FIRMWARE PUBLISHES ventsys/booth/risk/state.
  # sensor.booth_risk will always be 'unavailable' until a dedicated booth sensor board
  # is built and deployed. Use printairpipe-controller.yaml as the template with:
  #   mqtt_topic_prefix: "ventsys/booth"
  #   device_name: ventsys-booth-sensor
  #   device_ip: "192.168.50.33"
  # Until then, the ventsys_fire_risk_cutoff automation will never trigger for the booth.
  - platform: mqtt
    name: Booth Risk
    unique_id: ventsys_booth_risk
    state_topic: "ventsys/booth/risk/state"

  # ---- A4-6 note: DUAL ENTITY-PATH ARCHITECTURE --------------------------------
  # The MQTT sensors below (sensor.fdm_temperature, sensor.sla_temperature etc.)
  # are used by automations.yaml for safety alarm triggers.
  # SEPARATE from these are the ESPHome native API entities used by ventilation_v9k.html
  # for live dashboard display (sensor.fdm_enclosure_sensors_temperature etc.).
  # Both entity paths co-exist and serve different purposes.
  # Operators: this is intentional - do not consolidate unless you also update automations.yaml
  # and ventilation_v9k.html to use the same entity ID.
  # ---------------------------------------------------------------------------------
  # -- Temperature (DS18B20 via ESPHome MQTT) --------------------------------
  - platform: mqtt
    name: FDM Temperature
    unique_id: ventsys_fdm_temperature
    state_topic: "ventsys/fdm/temperature"
    unit_of_measurement: "Ãƒâ€šÃ‚Â°C"
    device_class: temperature
    expire_after: 120
  - platform: mqtt
    name: SLA Temperature
    unique_id: ventsys_sla_temperature
    state_topic: "ventsys/sla/temperature"
    unit_of_measurement: "Ãƒâ€šÃ‚Â°C"
    device_class: temperature
    expire_after: 120

  # -- Smoke / VOC (MQ-2/MQ-135 ADC via ESPHome MQTT) ----------------------
  # Payload: "detected" above threshold, "clear" otherwise.
  # Threshold set in printairpipe-controller.yaml binary_sensor block.
  - platform: mqtt
    name: FDM Smoke
    unique_id: ventsys_fdm_smoke
    state_topic: "ventsys/fdm/smoke"
    expire_after: 120
  - platform: mqtt
    name: SLA Smoke
    unique_id: ventsys_sla_smoke
    state_topic: "ventsys/sla/smoke"
    expire_after: 120

  # -- Garage ambient (BME680 reference sensor ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â ventsys-garage-sensor .34) --
  - platform: mqtt
    name: Garage Temperature
    unique_id: ventsys_garage_temperature
    state_topic: "ventsys/garage/temperature"
    unit_of_measurement: "Ãƒâ€šÃ‚Â°C"
    device_class: temperature
    expire_after: 120
  - platform: mqtt
    name: Garage Humidity
    unique_id: ventsys_garage_humidity
    state_topic: "ventsys/garage/humidity"
    unit_of_measurement: "%"
    device_class: humidity
    expire_after: 120
  - platform: mqtt
    name: Garage Baro Pressure
    unique_id: ventsys_garage_baro_pressure
    state_topic: "ventsys/garage/baro_pressure"
    unit_of_measurement: "hPa"
    device_class: pressure
    expire_after: 120
  - platform: mqtt
    name: Garage IAQ
    unique_id: ventsys_garage_iaq
    state_topic: "ventsys/garage/iaq"
    unit_of_measurement: "ÃƒÅ½Ã‚Â©"
    state_class: measurement
    expire_after: 120

  # -- IAQ index (BME680 gas resistance via ESPHome MQTT) ------------------
  # Source: BME680 gas_resistance in ohms. Higher = cleaner air.
  # Typical clean air: 50,000ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Å“150,000 ÃƒÅ½Ã‚Â©. Degraded air: <10,000 ÃƒÅ½Ã‚Â©.
  # Unlike a 0-500 IAQ index (which requires Bosch's proprietary BSEC2
  # library), this publishes raw resistance so no licence is needed.
  # HA automations (iaq_threshold_fdm / iaq_threshold_sla) compare against
  # resistance thresholds ÃƒÂ¢Ã¢â€šÂ¬Ã¢â‚¬Â update those threshold values to match your
  # sensor's clean-air baseline after a 30-minute warm-up measurement.
  - platform: mqtt
    name: FDM IAQ
    unique_id: ventsys_fdm_iaq
    state_topic: "ventsys/fdm/iaq"
    unit_of_measurement: "ÃƒÅ½Ã‚Â©"
    state_class: measurement
    expire_after: 120
  - platform: mqtt
    name: SLA IAQ
    unique_id: ventsys_sla_iaq
    state_topic: "ventsys/sla/iaq"
    unit_of_measurement: "ÃƒÅ½Ã‚Â©"
    state_class: measurement
    expire_after: 120


