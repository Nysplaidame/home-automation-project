# VentSys HA Scripts — Mode Execution
# Place in config/packages/ alongside ventsys_ha_package.yaml
#
# 2026-05-12: Reworked to ramp valves server-side. Previously each mode
# published a single instant value per valve, which produced an immediate
# snap on the physical actuator. Now each mode calls the reusable
# `ventsys_ramp_valve` helper in a `parallel:` block, so every valve steps
# smoothly from its current position to its target over ~2 seconds.
#
# This change applies the slow ramp REGARDLESS of trigger source —
# dashboard button, automation (incl. fire-safe), voice assistant,
# REST API, all use the same stepped path. The dashboard's local valve
# animation is now purely visual (driven by HA state coming back from the
# valves), with no MQTT publishing of its own during animation.
#
# Helper script timing: 40 steps × 50ms = 2000ms total.
# Tweak `duration_ms` per call if you want a faster/slower ramp for a
# specific mode (e.g. pass duration_ms: 500 for a faster fire response).
#
# MQTT topic schema (must match firmware and HA package):
#   ventsys/fan/control           → "on" / "off"   (main inline fan)
#   ventsys/fan/percent           → "0"–"100"       (main fan speed)
#   ventsys/spray-fan/control     → "on" / "off"   (spray booth fan)
#   ventsys/spray-fan/percent     → "0"–"100"       (spray fan speed)
#   ventsys/main/valve1/control   → "0"–"100"       (main duct valve 1)
#   ventsys/main/valve2/control   → "0"–"100"       (main duct valve 2)
#   ventsys/fdm/branch/control    → "0"–"100"       (ENC01 branch valve)
#   ventsys/fdm/valve/control     → "0"–"100"       (ENC01 print valve)
#   ventsys/fdm/360/control       → "0"–"100"       (ENC01 360° intake)
#   ventsys/sla/branch/control    → "0"–"100"       (ENC02 branch valve)
#   ventsys/sla/valve/control     → "0"–"100"       (ENC02 print valve)
#   ventsys/sla/360/control       → "0"–"100"       (ENC02 360° intake)

script:

  # ─── HELPER: ramp a single valve from current → target position ──────
  # Reads the valve's current state from `entity_id`, then publishes a
  # linear ramp of values to `topic` over `duration_ms` milliseconds in
  # 40 evenly-spaced steps.
  #
  # mode: parallel + max: 16 means multiple valves can ramp at the same
  # time (used by mode scripts that call this from a `parallel:` block).
  #
  # If the valve is already at target (delta == 0), the script exits
  # immediately without publishing — avoids needless network traffic.
  #
  # All mode scripts below call this helper. Do NOT publish directly to
  # any valve `*/control` topic from anywhere else — go through this.
  ventsys_ramp_valve:
    alias: VentSys — Ramp Valve
    mode: parallel
    max: 16
    fields:
      topic:
        description: "MQTT command topic (e.g. ventsys/main/valve1/control)"
        example: "ventsys/main/valve1/control"
        required: true
        selector:
          text:
      entity_id:
        description: "HA entity to read current position from (must match topic)"
        example: "number.main_duct_valve_1"
        required: true
        selector:
          entity:
            domain: number
      target:
        description: "Target position, 0-100"
        example: 100
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
      duration_ms:
        description: "Total ramp duration in ms (default 2000)"
        example: 2000
        default: 2000
        selector:
          number:
            min: 100
            max: 10000
            step: 100
    variables:
      steps: 40
      start_pos: "{{ states(entity_id) | int(0) }}"
      delta: "{{ (target | int) - start_pos }}"
      interval_ms: "{{ ((duration_ms | default(2000) | int) / 40) | int }}"
    sequence:
      - if:
          - condition: template
            value_template: "{{ delta == 0 }}"
        then:
          - stop: "Valve already at target position"
      - repeat:
          count: "{{ steps }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: "{{ topic }}"
                payload: "{{ (start_pos + (delta * repeat.index / steps)) | round(0) | int | string }}"
            - delay:
                milliseconds: "{{ interval_ms }}"

  # ─── SEAL ALL: everything closed, both fans off ──────────────────────
  # SAFETY NOTE (D2): This script explicitly sets ALL 10 actuator paths to
  # a known closed/off state. Call this first whenever switching between
  # single-subsystem modes to guarantee a clean hardware transition.
  ventsys_mode_sealed:
    alias: VentSys Mode — Seal All
    icon: mdi:lock-outline
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "off" }
      - action: mqtt.publish
        data: { topic: "ventsys/spray-fan/control", payload: "off" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve1/control"
              entity_id: "number.main_duct_valve_1"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve2/control"
              entity_id: "number.main_duct_valve_2"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/branch/control"
              entity_id: "number.fdm_branch_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/valve/control"
              entity_id: "number.fdm_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/360/control"
              entity_id: "number.fdm_360_intake"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/branch/control"
              entity_id: "number.sla_branch_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/valve/control"
              entity_id: "number.sla_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/360/control"
              entity_id: "number.sla_360_intake"
              target: 0

  # ─── FIRE-SAFE VENTILATION: main fan + all enc paths, spray fan OFF ──
  # D1 fix: replaces the previous behaviour of calling ventsys_mode_purge
  # during a fire event. ventsys_mode_purge activated the SPRAY BOOTH FAN,
  # which is physically mounted at the spray booth extraction point — running
  # it across a fire accelerates combustion and spreads flames. This script:
  #   ✓ Turns on the main inline fan (exhausts fumes away from the enclosures)
  #   ✓ Opens all FDM and SLA paths fully (maximum enclosure extraction)
  #   ✓ Closes the spray booth path (main-2=0) to contain the fire event
  #   ✗ Does NOT activate the spray booth fan
  # This is the correct script to call from the fail-safe automation.
  #
  # NOTE: valve ramps take ~2s here, same as routine modes. The user has
  # accepted this 2s as acceptable in a fire event. If a future review
  # decides faster snap is needed, add `duration_ms: 500` (or 0) to each
  # ramp call below.
  ventsys_mode_fire_safe:
    alias: VentSys Mode — Fire-Safe Ventilation
    icon: mdi:fire-alert
    sequence:
      # Main inline fan on — exhausts fumes/smoke from enclosures
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      # Spray booth fan MUST stay off during a fire event
      - action: mqtt.publish
        data: { topic: "ventsys/spray-fan/control", payload: "off" }
      - parallel:
          # Open all FDM enclosure paths fully
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/branch/control"
              entity_id: "number.fdm_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/valve/control"
              entity_id: "number.fdm_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/360/control"
              entity_id: "number.fdm_360_intake"
              target: 100
          # Open all SLA enclosure paths fully
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/branch/control"
              entity_id: "number.sla_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/valve/control"
              entity_id: "number.sla_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/360/control"
              entity_id: "number.sla_360_intake"
              target: 100
          # Open main-1 to allow full enclosure extraction
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve1/control"
              entity_id: "number.main_duct_valve_1"
              target: 100
          # Close spray booth path — isolates booth from fire event
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve2/control"
              entity_id: "number.main_duct_valve_2"
              target: 0

  # ─── PURGE ALL: everything open, both fans on ────────────────────────
  # WARNING: Do NOT use this as a fire response — the spray booth fan runs
  # across fire. Use ventsys_mode_fire_safe for fire events. Purge is intended
  # for post-event clearance only, when no active fire is present.
  ventsys_mode_purge:
    alias: VentSys Mode — Purge All
    icon: mdi:weather-windy
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - action: mqtt.publish
        data: { topic: "ventsys/spray-fan/control", payload: "on" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve1/control"
              entity_id: "number.main_duct_valve_1"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve2/control"
              entity_id: "number.main_duct_valve_2"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/branch/control"
              entity_id: "number.fdm_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/valve/control"
              entity_id: "number.fdm_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/360/control"
              entity_id: "number.fdm_360_intake"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/branch/control"
              entity_id: "number.sla_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/valve/control"
              entity_id: "number.sla_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/360/control"
              entity_id: "number.sla_360_intake"
              target: 100

  # ─── BOOTH: main-1 + main-2 open, spray fan on, main fan on ──────────
  # Enclosure paths (FDM/SLA branch valves, print valves, 360° intakes) are
  # intentionally NOT touched here. The system is extraction-only — air only
  # travels outward, so the booth path cannot cause ingress into the enclosures.
  # If an enclosure mode is active concurrently, it continues unaffected.
  ventsys_mode_booth:
    alias: VentSys Mode — Spray Booth
    icon: mdi:spray
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/spray-fan/control", payload: "on" }
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - action: mqtt.publish
        data: { topic: "ventsys/fan/percent", payload: "50" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve1/control"
              entity_id: "number.main_duct_valve_1"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve2/control"
              entity_id: "number.main_duct_valve_2"
              target: 100

  # ─── BOOTH SEAL: main-2 closed, spray fan off ────────────────────────
  # Closes the spray booth extraction path and stops the booth fan.
  # main-1 is intentionally left as-is — if an enclosure mode (FDM/SLA) is
  # active it uses main-1 and should not be interrupted by sealing the booth.
  # Enclosure branch valves are also left untouched for the same reason.
  ventsys_mode_booth_seal:
    alias: VentSys Mode — Booth Seal
    icon: mdi:spray-bottle
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/spray-fan/control", payload: "off" }
      - action: script.ventsys_ramp_valve
        data:
          topic: "ventsys/main/valve2/control"
          entity_id: "number.main_duct_valve_2"
          target: 0

  # ─── FDM PRINT: enc1 print=100, enc1-branch=100, enc1-360=0, fan on ──
  ventsys_mode_fdm_print:
    alias: VentSys Mode — FDM Print
    icon: mdi:printer-3d

    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/valve/control"
              entity_id: "number.fdm_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/branch/control"
              entity_id: "number.fdm_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/360/control"
              entity_id: "number.fdm_360_intake"
              target: 0

  # ─── FDM ENCLOSURE: enc1-360=100, enc1-branch=100, enc1-print=0, fan on
  ventsys_mode_fdm_enclosure:
    alias: VentSys Mode — FDM Enclosure
    icon: mdi:cube-outline
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/360/control"
              entity_id: "number.fdm_360_intake"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/branch/control"
              entity_id: "number.fdm_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/valve/control"
              entity_id: "number.fdm_valve"
              target: 0

  # ─── FDM PURGE: enc1-360=100, enc1-print=100, enc1-branch=100, fan on
  ventsys_mode_fdm_purge:
    alias: VentSys Mode — FDM Purge
    icon: mdi:weather-windy
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/360/control"
              entity_id: "number.fdm_360_intake"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/valve/control"
              entity_id: "number.fdm_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/branch/control"
              entity_id: "number.fdm_branch_valve"
              target: 100

  # ─── FDM SEAL: enc1 branch=0, enc1 print=0, enc1-360=0 ───────────────
  ventsys_mode_fdm_seal:
    alias: VentSys Mode — FDM Seal
    icon: mdi:lock
    sequence:
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/branch/control"
              entity_id: "number.fdm_branch_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/valve/control"
              entity_id: "number.fdm_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/fdm/360/control"
              entity_id: "number.fdm_360_intake"
              target: 0

  # ─── SLA PRINT: enc2-print=100, enc2-branch=100, main-1=100, 360=0 ───
  ventsys_mode_sla_print:
    alias: VentSys Mode — SLA Print
    icon: mdi:printer-3d-nozzle
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/valve/control"
              entity_id: "number.sla_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/branch/control"
              entity_id: "number.sla_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve1/control"
              entity_id: "number.main_duct_valve_1"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/360/control"
              entity_id: "number.sla_360_intake"
              target: 0

  # ─── SLA ENCLOSURE: enc2-360=100, enc2-branch=100, main-1=100, print=0
  ventsys_mode_sla_enclosure:
    alias: VentSys Mode — SLA Enclosure
    icon: mdi:cube-outline
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/360/control"
              entity_id: "number.sla_360_intake"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/branch/control"
              entity_id: "number.sla_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve1/control"
              entity_id: "number.main_duct_valve_1"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/valve/control"
              entity_id: "number.sla_valve"
              target: 0

  # ─── SLA PURGE: enc2-360=100, enc2-print=100, enc2-branch=100, main-1=100
  ventsys_mode_sla_purge:
    alias: VentSys Mode — SLA Purge
    icon: mdi:weather-windy
    sequence:
      - action: mqtt.publish
        data: { topic: "ventsys/fan/control", payload: "on" }
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/360/control"
              entity_id: "number.sla_360_intake"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/valve/control"
              entity_id: "number.sla_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/branch/control"
              entity_id: "number.sla_branch_valve"
              target: 100
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/main/valve1/control"
              entity_id: "number.main_duct_valve_1"
              target: 100

  # ─── SLA SEAL: enc2 branch=0, enc2 print=0, enc2-360=0 ───────────────
  ventsys_mode_sla_seal:
    alias: VentSys Mode — SLA Seal
    icon: mdi:lock
    sequence:
      - parallel:
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/branch/control"
              entity_id: "number.sla_branch_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/valve/control"
              entity_id: "number.sla_valve"
              target: 0
          - action: script.ventsys_ramp_valve
            data:
              topic: "ventsys/sla/360/control"
              entity_id: "number.sla_360_intake"
              target: 0