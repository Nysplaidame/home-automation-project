# Place in config/packages/ (e.g., config/packages/ventsys_ha_tuning_and_popups.yaml)
# REQUIREMENTS:
# - MQTT integration already configured
# - Browser Mod (HACS) optional; if not installed, fallback notifications apply
# - Entities switch.fdm_printer_plug / switch.sla_printer_plug exist (as before)

# PID live tuning (SLA shown; replicate for FDM by copying and changing topic prefix)
number:
  - platform: mqtt
    name: SLA PID Kp
    unique_id: ventsys_sla_pid_kp
    command_topic: "ventsys/sla/pid/kp"
    min: 0
    max: 10
    step: 0.1
  - platform: mqtt
    name: SLA PID Ki
    unique_id: ventsys_sla_pid_ki
    command_topic: "ventsys/sla/pid/ki"
    min: 0
    max: 10
    step: 0.1
  - platform: mqtt
    name: SLA PID Kd
    unique_id: ventsys_sla_pid_kd
    command_topic: "ventsys/sla/pid/kd"
    min: 0
    max: 10
    step: 0.1

# Device lifecycle visibility (optional sensors)
sensor:
  - platform: mqtt
    name: ESP Fan Status
    unique_id: ventsys_espfan_status
    state_topic: "ventsys/devices/espfan/status"
  - platform: mqtt
    name: ESP Fan Heartbeat
    unique_id: ventsys_espfan_heartbeat
    state_topic: "ventsys/devices/espfan/heartbeat"
  - platform: mqtt
    name: ESP Valve Status
    unique_id: ventsys_espvalve_status
    state_topic: "ventsys/devices/espvalve/status"
  - platform: mqtt
    name: ESP Valve Heartbeat
    unique_id: ventsys_espvalve_heartbeat
    state_topic: "ventsys/devices/espvalve/heartbeat"
  - platform: mqtt
    name: VentSys Log Events
    unique_id: ventsys_log_events
    state_topic: "ventsys/logs/events"
    qos: 0
  - platform: mqtt
    name: VentSys Log Errors
    unique_id: ventsys_log_errors
    state_topic: "ventsys/logs/errors"
    qos: 0

# Optional: Use Browser Mod (HACS) for rich popups; else fallback persistent notifications.
# Browser Mod service: browser_mod.popup
# Ensure you have at least one browser device connected for popups.

automation:
  # Popup on device BIRTH (new/returning device)
  - id: ventsys_device_birth_popup
    alias: VentSys Device Birth Popup
    mode: queued
    trigger:
      - platform: mqtt
        topic: "ventsys/devices/+/birth"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ integration_entities('browser_mod') | list | count > 0 }}"
            sequence:
              - action: browser_mod.popup
                data:
                  title: "VentSys: Device Online"
                  content: >
                    New/returning device reported: {{ trigger.topic.split('/')[2] }}.
                    Payload: {{ trigger.payload }}
                  timeout: 15000
        default:
          - action: persistent_notification.create
            data:
              title: "VentSys: Device Online"
              message: >
                New/returning device reported on {{ trigger.topic }}: {{ trigger.payload }}

  # Popup + cutoff on MQTT error log (Node-RED log publisher)
  - id: ventsys_error_popup
    alias: VentSys Error Popup
    mode: queued
    trigger:
      - platform: mqtt
        topic: "ventsys/logs/errors"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ integration_entities('browser_mod') | list | count > 0 }}"
            sequence:
              - action: browser_mod.popup
                data:
                  title: "VentSys ERROR"
                  content: >
                    {{ trigger.payload }}
                  timeout: 20000
        default:
          - action: persistent_notification.create
            data:
              title: "VentSys ERROR"
              message: "{{ trigger.payload }}"
