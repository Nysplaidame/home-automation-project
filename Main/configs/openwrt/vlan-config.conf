
# File equivalent: /etc/config/network
# GL.iNet GL-MT6000 with OpenWrt - DSA Switch Configuration
#
# Architecture Context: docs/decisions/01-network-architecture.md
#                       docs/decisions/02-printer-vlan-architecture.md
# Network Design: 10-zone security-segmented architecture
# Project Context: README.md
# Hardware: GL.iNet GL-MT6000 with modern DSA switch architecture
#
# Related Documents:
# - configs/openwrt/firewall-config.conf - Security rules referencing these networks
# - docs/diagrams/network/ - Visual network topology
# - configs/openwrt/dhcp-config.conf - DHCP scopes for these networks
# - configs/openwrt/wireless-config.conf - WiFi networks mapped to VLANs
#
# Network Architecture Summary:
# - lan:         192.168.1.0/24  (Main users - phones, laptops, tablets)         - VLAN 1
# - management:  192.168.10.0/24 (Admin devices, Proxmox host)                   - VLAN 10
# - automation:  192.168.20.0/24 (Home Assistant VM, Bambuddy VM)                - VLAN 20
# - nvr:         192.168.30.0/24 (Frigate NVR VM, IP cameras)                    - VLAN 30
# - printers:    192.168.35.0/24 (Bambu P1S, Concepts3D Athena 2)                - VLAN 35
# - storage:     192.168.40.0/24 (NAS, backup services)                          - VLAN 40
# - iot_sensors: 192.168.50.0/24 (Fire safety sensors, smart plugs)              - VLAN 50
# - monitoring:  192.168.60.0/24 (Future monitoring VMs)                         - VLAN 60
# - dmz:         192.168.70.0/24 (VPN endpoint, public services)                 - VLAN 70
# - guest:       192.168.99.0/24 (Visitor access, internet-only)                 - VLAN 99
#
# Physical Port Assignment:
# - lan1: Trunk to Proxmox (VLANs 10,20,30,35,40,50,60,70 tagged)
# - lan2: Management access (VLAN 10 untagged) + other VLANs tagged
# - lan3: Camera POE switch (VLAN 30 untagged) + management tagged
# - lan4: NAS direct connection (VLAN 40 untagged) + management tagged
# - lan5: Recovery / WiFi AP port (VLAN 1 untagged only)
#         During setup: connect laptop here for guaranteed router access
#         After setup: connect TP-Link TL-WA801N in AP mode to extend HomeMain
#
# VLAN 35 physical connectivity note:
#   The Bambu P1S connects via HomePrinters WiFi SSID on 2.4GHz (WiFi-only device).
#   The Concepts3D Athena 2 has Gigabit Ethernet, but all physical LAN ports
#   are already allocated. Athena 2 can use HomePrinters WiFi, or a small managed
#   switch on lan3 (if cameras are switched) could carry VLAN 35 tagged. This is
#   a physical deployment decision — VLAN 35 is tagged on lan1 for future use.

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================

config globals 'globals'
    option ula_prefix 'fd12:3456:789a::/48'
# ANNOTATION: Unique Local Address prefix for IPv6

# ============================================================================
# LOOPBACK INTERFACE
# ============================================================================

config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'

# ============================================================================
# WAN INTERFACE (Internet Connection)
# ============================================================================

config interface 'wan'
    option device 'wan'
    option proto 'dhcp'
    option peerdns '0'
    option dns '1.1.1.1 1.0.0.1'

config interface 'wan6'
    option device 'wan'
    option proto 'dhcpv6'
    option reqaddress 'try'
    option reqprefix 'auto'

# ============================================================================
# MAIN BRIDGE CONFIGURATION
# Modern DSA (Distributed Switch Architecture) implementation
# ============================================================================

config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'lan1'   # Trunk port to Proxmox
    list ports 'lan2'   # Management + multi-VLAN port
    list ports 'lan3'   # Camera POE switch port
    list ports 'lan4'   # NAS direct connection port
    list ports 'lan5'   # Recovery / WiFi AP port (VLAN 1 untagged only)
    option igmp_snooping '1'
    option stp '1'
    option stp_hello_time '2'
    option stp_forward_delay '15'

# ============================================================================
# BRIDGE VLAN CONFIGURATION (Modern DSA)
# ============================================================================

# VLAN 1: Main Users Network (WiFi-only for main users — lan5 for recovery/AP)
config bridge-vlan
    option device 'br-lan'
    option vlan '1'
    option local '1'
    list ports 'lan5:u*'
    # lan5 serves dual purpose:
    #   1. DURING SETUP / RECOVERY: Connect laptop for guaranteed SSH to 192.168.1.1
    #   2. AFTER SETUP: Connect TP-Link TL-WA801N AP in AP mode to extend HomeMain

# VLAN 10: Management Network
config bridge-vlan
    option device 'br-lan'
    option vlan '10'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (tagged)
    list ports 'lan2:u*'    # Management port — PVID
    list ports 'lan3:t'     # Camera port (tagged for admin access)
    list ports 'lan4:t'     # NAS port (tagged for admin access)

# VLAN 20: Automation Network
config bridge-vlan
    option device 'br-lan'
    option vlan '20'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (HA VM + Bambuddy VM)

# VLAN 30: NVR Network (renamed from CCTV — see docs/decisions/02-printer-vlan-architecture.md)
config bridge-vlan
    option device 'br-lan'
    option vlan '30'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (tagged for Frigate VM)
    list ports 'lan3:u*'    # Camera POE switch — PVID
    # ANNOTATION: NVR network for Frigate VM and IP cameras.
    # Renamed from 'cctv' — Bambuddy has moved to VLAN 20 (VM 103).
    # No internet access; Frigate reachable from VLAN 20 (HA) and VLAN 10 (Management).

# VLAN 35: Printers Network
config bridge-vlan
    option device 'br-lan'
    option vlan '35'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (tagged — reserved for future wired use)
    # ANNOTATION: Printer network for Bambu P1S and Concepts3D Athena 2.
    # P1S is WiFi-only — connects via HomePrinters SSID (radio0, 2.4GHz).
    # Athena 2 has Gigabit Ethernet but all physical ports are allocated;
    #   use HomePrinters WiFi or plan a managed switch on lan3 for wired access.
    # lan1:t is tagged for future use if a wired path is added.
    # No internet by default; port 443 OTA exception in firewall-config.conf.
    # Slicer access from VLAN 1 (LAN) via 'LAN to Printers' firewall rule.

# VLAN 40: Storage Network
config bridge-vlan
    option device 'br-lan'
    option vlan '40'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (tagged)
    list ports 'lan4:u*'    # NAS direct connection — PVID

# VLAN 50: IoT Sensors Network
config bridge-vlan
    option device 'br-lan'
    option vlan '50'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (tagged)
    # WiFi-only — HomeIoT SSID. No wired access to safety sensors.

# VLAN 60: Monitoring Network
config bridge-vlan
    option device 'br-lan'
    option vlan '60'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (tagged)

# VLAN 70: DMZ Network
config bridge-vlan
    option device 'br-lan'
    option vlan '70'
    option local '1'
    list ports 'lan1:t'     # Trunk to Proxmox (tagged)

# VLAN 99: Guest Network (WiFi-only — no physical ports)
config bridge-vlan
    option device 'br-lan'
    option vlan '99'
    option local '1'
    # No physical ports — WiFi-only via HomeGuest SSID.
    # Prevents Layer 2 attacks from guest devices against internal infrastructure.

# ============================================================================
# LOGICAL NETWORK INTERFACES
# ============================================================================

# Main LAN Network — VLAN 1 (192.168.1.0/24)
config interface 'lan'
    option proto 'static'
    option device 'br-lan.1'
    option ipaddr '192.168.1.1'
    option netmask '255.255.255.0'
    option ip6assign '60'

# Management Network — VLAN 10 (192.168.10.0/24)
config interface 'management'
    option proto 'static'
    option device 'br-lan.10'
    option ipaddr '192.168.10.1'
    option netmask '255.255.255.0'
    # Proxmox host: 192.168.10.10 (static). DHCP pool: .100-.149.

# Automation Network — VLAN 20 (192.168.20.0/24)
config interface 'automation'
    option proto 'static'
    option device 'br-lan.20'
    option ipaddr '192.168.20.1'
    option netmask '255.255.255.0'
    # Home Assistant VM: 192.168.20.101
    # Bambuddy VM:       192.168.20.102

# NVR Network — VLAN 30 (192.168.30.0/24)
# Renamed from 'cctv' — see docs/decisions/02-printer-vlan-architecture.md
config interface 'nvr'
    option proto 'static'
    option device 'br-lan.30'
    option ipaddr '192.168.30.1'
    option netmask '255.255.255.0'
    # Frigate NVR VM: 192.168.30.20
    # IP cameras:     192.168.30.21-24

# Printers Network — VLAN 35 (192.168.35.0/24)
config interface 'printers'
    option proto 'static'
    option device 'br-lan.35'
    option ipaddr '192.168.35.1'
    option netmask '255.255.255.0'
    # Bambu P1S:            192.168.35.200 (WiFi via HomePrinters SSID)
    # Concepts3D Athena 2:  192.168.35.201 (WiFi or future wired)
    # No internet — OTA exception (port 443 TCP) in firewall-config.conf.

# Storage Network — VLAN 40 (192.168.40.0/24)
config interface 'storage'
    option proto 'static'
    option device 'br-lan.40'
    option ipaddr '192.168.40.1'
    option netmask '255.255.255.0'
    # NAS: 192.168.40.50

# IoT Sensors Network — VLAN 50 (192.168.50.0/24)
config interface 'iot_sensors'
    option proto 'static'
    option device 'br-lan.50'
    option ipaddr '192.168.50.1'
    option netmask '255.255.255.0'
    # Device IP allocation:
    #   Fans: .21-.22 | Sensors: .31-.34 | Airflow: .41-.43
    #   Butterfly valves: .51-.56 | 360° valves: .61-.62 | Smart plugs: .71-.78
    #   Reserved: .79-.89 | Dynamic DHCP: .100-.190

# Monitoring Network — VLAN 60 (192.168.60.0/24)
config interface 'monitoring'
    option proto 'static'
    option device 'br-lan.60'
    option ipaddr '192.168.60.1'
    option netmask '255.255.255.0'

# DMZ Network — VLAN 70 (192.168.70.0/24)
config interface 'dmz'
    option proto 'static'
    option device 'br-lan.70'
    option ipaddr '192.168.70.1'
    option netmask '255.255.255.0'

# Guest Network — VLAN 99 (192.168.99.0/24)
config interface 'guest'
    option proto 'static'
    option device 'br-lan.99'
    option ipaddr '192.168.99.1'
    option netmask '255.255.255.0'

# ============================================================================
# WIREGUARD VPN INTERFACE
# ============================================================================

config interface 'wg0'
    option proto 'wireguard'
    option private_key 'YOUR_PRIVATE_KEY_HERE'
    option listen_port '51820'
    list addresses '10.0.0.1/24'

# Mobile Device 1
config wireguard_wg0
    option public_key 'CLIENT1_PUBLIC_KEY_HERE'
    list allowed_ips '10.0.0.2/32'
    option persistent_keepalive '25'

# Mobile Device 2
config wireguard_wg0
    option public_key 'CLIENT2_PUBLIC_KEY_HERE'
    list allowed_ips '10.0.0.3/32'
    option persistent_keepalive '25'

# Laptop/Desktop
config wireguard_wg0
    option public_key 'CLIENT3_PUBLIC_KEY_HERE'
    list allowed_ips '10.0.0.4/32'
    option persistent_keepalive '25'

# ============================================================================
# NETWORK VALIDATION NOTES
# ============================================================================

# Physical Connection Verification:
# 1. lan1 → Proxmox server (trunk: VLANs 10,20,30,35,40,50,60,70 tagged)
# 2. lan2 → Admin laptop/management devices (VLAN 10 untagged)
# 3. lan3 → Camera POE switch (VLAN 30 untagged)
# 4. lan4 → Raspberry Pi NAS (VLAN 40 untagged)
# 5. lan5 → Recovery laptop during setup, then TP-Link TL-WA801N AP (VLAN 1)

# Key Static IPs:
# - Proxmox Host:        192.168.10.10
# - Home Assistant VM:   192.168.20.101
# - Bambuddy VM:         192.168.20.102
# - Frigate NVR VM:      192.168.30.20
# - Bambu P1S:           192.168.35.200
# - Concepts3D Athena 2: 192.168.35.201
# - NAS:                 192.168.40.50

# Critical Safety Notes:
# - VLAN 50 (IoT sensors) must remain isolated from internet
# - VLAN 30 (NVR) must remain isolated from internet
# - VLAN 35 (Printers) no internet except port 443 OTA
# - Trunk port to Proxmox is critical for VM networking
# - VPN: single wg0 WireGuard interface only
