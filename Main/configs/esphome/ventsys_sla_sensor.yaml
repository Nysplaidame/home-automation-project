# VentSys SLA Enclosure Sensor Array
# Device: ventsys-sla-sensor  IP: 192.168.50.32  VLAN 50
# DHCP hostname: ventsys-sla-sensor
#
# This is a deployable per-device wrapper that imports the shared firmware
# in printairpipe-controller.yaml and overrides only board-specific values.

substitutions:
  device_name: ventsys-sla-sensor
  friendly_name: "SLA Enclosure Sensors"
  device_ip: "192.168.50.32"
  mqtt_topic_prefix: "ventsys/sla"
  temp_threshold: "40.0"

packages:
  base: !include printairpipe-controller.yaml
