# VentSys Spray Booth Enclosure Sensor Array
# Device: ventsys-booth-sensor  IP: 192.168.50.33  VLAN 50
# DHCP hostname: ventsys-booth-sensor
#
# A4-4 fix: Per-device wrapper file created so operators have a ready-to-flash
# config for the Booth sensor board with all substitutions pre-filled.
# The shared firmware is printairpipe-controller.yaml - review that file for
# full hardware pin assignments, calibration notes, and sensor documentation.
#
# IMPORTANT - A4-3 DEPENDENCY:
# This board must publish to ventsys/booth/ topics (below) for sensor.booth_risk
# to receive data in HA. Until this board is deployed and adopted, sensor.booth_risk
# in ventsys_ha_package.yaml will always be "unavailable" and the booth fire risk
# cutoff automation will never trigger for the spray booth.
#
# HARDWARE (GPIO assignments from printairpipe-controller.yaml):
#   DS18B20 temperature (1-Wire): GPIO4
#   BME680 (temp/humidity/pressure/IAQ gas): SDA=GPIO21, SCL=GPIO22 (I2C)
#   MQ smoke sensor (ADC, 3.3V): GPIO34
#   Pressure differential ADC: GPIO35
#   Status LED: GPIO2
#
# PRE-TLS: Change mqtt.port to 1883 and remove ca_certificate before first flash.
#
# MQTT topics published (all under ventsys/booth/):
#   ventsys/booth/temperature       - DS18B20 temperature (degC)
#   ventsys/booth/humidity          - BME680 humidity (%)
#   ventsys/booth/baro_pressure     - BME680 absolute pressure (hPa)
#   ventsys/booth/iaq               - BME680 gas resistance (ohms)
#   ventsys/booth/pressure_diff     - Differential pressure ADC proxy (Pa)
#   ventsys/booth/smoke             - "detected" / "clear"
#   ventsys/booth/temp_alarm        - "high" / "normal"
#   ventsys/booth/online            - heartbeat (true, every 60s)
#
# NOTE: ventsys/booth/risk/state is NOT published by this firmware.
# The booth_risk derivation logic (combining smoke + temp_alarm -> FIRE_RISK)
# must be added here or implemented as a template sensor in ventsys_ha_package.yaml.
# See: sensor.fdm_risk and sensor.sla_risk in printairpipe-controller.yaml for the pattern.
#
# See: esphome_adoption_guide.md for first-flash and adoption workflow.

substitutions:
  device_name: enc-booth-sensors
  friendly_name: "Booth Enclosure Sensors"
  device_ip: "192.168.50.33"
  mqtt_topic_prefix: "ventsys/booth"

# All remaining configuration is inherited from the shared firmware:
# Copy the full printairpipe-controller.yaml content below this header,
# OR use ESPHome packages include once the vault structure supports it.
# For now, copy printairpipe-controller.yaml here and set the substitutions above.
#
# Quick reference - change ONLY these four substitution lines per board:
#   FDM board:   device_name: enc-fdm-sensors   | device_ip: 192.168.50.31 | mqtt_topic_prefix: ventsys/fdm
#   SLA board:   device_name: enc-sla-sensors   | device_ip: 192.168.50.32 | mqtt_topic_prefix: ventsys/sla
#   Booth board: device_name: enc-booth-sensors | device_ip: 192.168.50.33 | mqtt_topic_prefix: ventsys/booth