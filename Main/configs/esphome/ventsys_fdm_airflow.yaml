# VentSys FDM Enclosure Airflow Sensor
# Adapted from ventsys_airflow_sensor.yaml (known to boot without crashing)
# Adds MQTT publishing and VentSys identity. All original features retained:
# pulse meter, wheel speed, LED running-light animation, flow-speed LED control.
#
# NOTE: Hardware is ESP32-C6. Framework is esp-idf (required for C6).
# internal_temperature is NOT available on C6 — omitted intentionally.
#
# PRE-TLS: Change mqtt.port to 1883 and remove ca_certificate before first flash.
#
# SECRETS REQUIRED (secrets.yaml):
#   wifi_ssid, wifi_pass, mqtt_user, mqtt_pass, mqtt_ca_cert,
#   api_key, ota_password

substitutions:
  device_name: ventsys-fdm-airflow
  friendly_name: "VentSys FDM Airflow Sensor"
  device_ip: "192.168.50.41"
  mqtt_topic_pulses: "ventsys/fdm/airflow/pulses"
  mqtt_topic_rps:    "ventsys/fdm/airflow/rps"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ota_password

captive_portal:

mqtt:
  broker: 192.168.20.101
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  ca_certificate: !secret mqtt_ca_cert
  on_connect:
    # Republish last known readings on reconnect so HA stays in sync
    - mqtt.publish:
        topic: ${mqtt_topic_pulses}
        payload: "0"
        retain: true

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

globals:
  - id: pulses_at_max_speed
    type: float
    restore_value: no
    initial_value: '20.0'    # Adjust after calibration if needed

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: diagnostic

  - platform: uptime
    name: Uptime

  - platform: pulse_meter
    id: flow_meter_pulse_rate
    pin:
      number: GPIO10
      inverted: true
      mode: INPUT_PULLUP
    unit_of_measurement: 'pulses/s'
    name: 'Flow Meter Pulse Rate'
    internal_filter: 10ms
    accuracy_decimals: 0
    internal_filter_mode: EDGE
    timeout: 2s
    filters:
      - lambda: return x / 60.0;
    on_value:
      then:
        - if:
            condition:
              switch.is_on: control_anim_by_flow_speed_switch
            then:
              - number.set:
                  id: animation_speed
                  value: !lambda 'return (x / id(pulses_at_max_speed)) * 100.0;'
        # Publish pulse rate to HA via MQTT
        - mqtt.publish:
            topic: ${mqtt_topic_pulses}
            payload: !lambda 'return to_string((int)x);'
            retain: true

  - platform: template
    name: "Flow Meter Wheel Speed"
    id: flow_meter_wheel_speed
    update_interval: 1s
    accuracy_decimals: 1
    unit_of_measurement: 'rounds/s'
    lambda: |-
      float rps = id(flow_meter_pulse_rate).state / 3.0;
      return rps;
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_topic_rps}
            payload: !lambda 'return to_string(x);'
            retain: true

switch:
  - platform: template
    name: "Light On/Off"
    id: light_on_off_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - light.turn_on:
          id: light_1
          effect: "Running light"
    turn_off_action:
      - light.turn_off: light_1

  - platform: template
    name: "Control LED Animation by Flow Speed"
    id: control_anim_by_flow_speed_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true

number:
  - platform: template
    name: "Animation Speed"
    id: animation_speed
    max_value: 100
    min_value: 0
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    disabled_by_default: true
    mode: slider

  - platform: template
    name: "Light Brightness"
    id: light_brightness
    max_value: 100
    min_value: 15
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    mode: slider

light:
  - platform: esp32_rmt_led_strip
    id: light_1
    rgb_order: GRB
    chipset: WS2812
    pin: GPIO9
    num_leds: 3
    name: "LEDs"
    internal: true
    effects:
      - addressable_lambda:
          name: "Running light"
          update_interval: 16ms
          lambda: |-
            if (initial_run) {
              it.all() = Color::BLACK;
            }
            static int next_update;
            static int pos;
            if (next_update <= millis() && id(animation_speed).state > 0) {
              int red = current_color.red;
              int green = current_color.green;
              int blue = current_color.blue;
              it.all() = Color::BLACK;
              for (int i = 0; i < it.size(); i++) {
                float brightness = i == pos ? (id(light_brightness).state / 100.0) : 0.0;
                it[i] = Color(brightness * red, brightness * green, brightness * blue);
              }
              pos = (pos + 1) % it.size();
              next_update = millis() + 1635 - (id(animation_speed).state / 100.0) * 1500;
            } else if (id(animation_speed).state == 0) {
              int red = current_color.red;
              int green = current_color.green;
              int blue = current_color.blue;
              float brightness = id(light_brightness).state / 100.0;
              it.all() = Color(brightness * red, brightness * green, brightness * blue);
            }

