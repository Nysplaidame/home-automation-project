# ESPHome — VentSys Garage Ambient Sensor
# Device: ESP32 (single board)
# Network: VLAN 50 (IoT Sensors) — 192.168.50.0/24
# SSID: HomeIoT
# IP: 192.168.50.34
# DHCP hostname: ventsys-garage-sensor
#
# PURPOSE:
#   Provides ambient reference readings for the garage environment.
#   Used as the baseline for differential pressure calculation in
#   ventsys_ha_optional.yaml (enclosure_pressure - garage_pressure).
#   Also provides ambient temperature/humidity/IAQ for context.
#
#   This board has NO smoke alarm, NO MQ sensor, NO airflow ADC,
#   and NO DS18B20 — it is a reference sensor only, not a safety device.
#
# MQTT topics published:
#   ventsys/garage/temperature       — BME680 temperature (°C)
#   ventsys/garage/humidity          — BME680 humidity (%)
#   ventsys/garage/baro_pressure     — BME680 absolute pressure (hPa)
#   ventsys/garage/iaq               — BME680 gas resistance (Ω)
#   ventsys/garage/online            — heartbeat (true, every 60s)
#
# See: esphome_adoption_guide.md for first-flash and adoption workflow
# See: ventsys_ha_optional.yaml for how baro_pressure is consumed

substitutions:
  device_name: ventsys-garage-sensor
  friendly_name: "VentSys Garage Ambient"
  device_ip: "192.168.50.34"
  mqtt_topic_prefix: "ventsys/garage"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0

mqtt:
  broker: 192.168.20.101
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  certificate_authority: !secret mqtt_ca_cert

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: WARN

# ── TIME SYNC ────────────────────────────────────────────────────────────────
# Required for MQTT TLS certificate validation — ESP32 boots at 1970-01-01.
# A6-1 fix: added to match pattern established by ventsys_fdm_airflow.yaml.
time:
  - platform: homeassistant
    id: homeassistant_time

status_led:
  pin:
    number: GPIO2
    inverted: false

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

sensor:

  - platform: bme680_i2c
    address: 0x76   # 0x77 if SDO pin is HIGH — check your module
    update_interval: 30s
    # Reference sensor only — no alarm thresholds, raw values published.

    temperature:
      name: "${friendly_name} Temperature"
      id: garage_temperature
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - filter_out: nan
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/temperature"
              payload: !lambda 'return to_string(x);'

    humidity:
      name: "${friendly_name} Humidity"
      id: garage_humidity
      unit_of_measurement: "%"
      accuracy_decimals: 1
      filters:
        - filter_out: nan
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/humidity"
              payload: !lambda 'return to_string(x);'

    pressure:
      name: "${friendly_name} Pressure"
      id: garage_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2
      filters:
        - filter_out: nan
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/baro_pressure"
              payload: !lambda 'return to_string(x);'
      # Reference pressure for ventsys_ha_optional.yaml differential calculation.
      # differential = enclosure_pressure - garage_pressure (hPa).
      # Negative = enclosure below ambient = desired extraction state.

    gas_resistance:
      name: "${friendly_name} IAQ Gas Resistance"
      id: garage_gas_resistance
      unit_of_measurement: "Ω"
      accuracy_decimals: 0
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/iaq"
              payload: !lambda 'return to_string((int)x);'
      # Expected range in a moderate-VOC garage: 15,000–40,000 Ω at rest.
      # Requires ~5 min warm-up and 30 min for stable baseline.
      # Not used for alarming — enclosure sensors trigger the automations.

# ── TEXT SENSORS ─────────────────────────────────────────────────────────────
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"

# ── INTERVAL: heartbeat ──────────────────────────────────────────────────────
interval:
  - interval: 60s
    then:
      - mqtt.publish:
          topic: "${mqtt_topic_prefix}/online"
          payload: "true"

# ── SECRETS REQUIRED IN secrets.yaml ────────────────────────────────────────
# wifi_ssid: "HomeIoT"
# wifi_pass: "your-homeiot-password"
# mqtt_user: "mqtt"
# mqtt_pass: "your-mqtt-password"
# mqtt_ca_cert: |
#   -----BEGIN CERTIFICATE-----
#   ... (contents of ca.crt from local CA)
#   -----END CERTIFICATE-----
# api_key: "your-32-byte-base64-api-key"   # generate: openssl rand -base64 32
# ota_password: "your-ota-password"
