# NOTE: 360-degree intake valve. Servo on GPIO04 (matching upstream PrintAirPipe
# 360deg_intake hardware reference). All butterfly valve features retained.
# Touch sensor toggles between fully open and fully closed (same as valve controllers).
# VentSys Butterfly Valve Controller
# Adapted from ventsys_butterfly_valve.yaml (known working hardware)
# Adds MQTT integration for VentSys system control while preserving ALL
# original features: LED colour coding, temperature alerts, touch sensor toggle,
# configurable open/close positions, PWM auto-shutdown.
#
# PRE-TLS DEPLOYMENT: Change mqtt.port to 1883 and remove mqtt.ca_certificate
# before first flash. Swap back to 8883 + ca_certificate after TLS is live.
#
# SECRETS REQUIRED (secrets.yaml):
#   wifi_ssid, wifi_pass, mqtt_user, mqtt_pass, mqtt_ca_cert,
#   api_key, ota_password

substitutions:
  device_name: ventsys-fdm-360-valve  # N-5 fix: hyphens match ESPHome mDNS convention
  friendly_name: "VentSys FDM 360 Intake Valve"
  device_ip: "192.168.50.61"
  mqtt_command_topic: "ventsys/fdm/360/control"
  mqtt_state_topic:   "ventsys/fdm/360/state"
  servo_gpio: GPIO04

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino
    version: recommended

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ota_password

captive_portal:

mqtt:
  broker: 192.168.20.101
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  ca_certificate: !secret mqtt_ca_cert
  on_message:
    # Receive 0-100 percent from HA number entity
    - topic: ${mqtt_command_topic}
      qos: 0
      then:
        # Route through the number entity — this triggers set_action which
        # handles servo write, PWM enable, and LED colour update in one call.
        - number.set:
            id: valve_position_direct_control_number
            value: !lambda 'return (float)atoi(x.c_str());'
        - mqtt.publish:
            topic: ${mqtt_state_topic}
            payload: !lambda 'return x;'
            retain: true
  on_connect:
    # Republish current state on reconnect so HA stays in sync
    - mqtt.publish:
        topic: ${mqtt_state_topic}
        payload: !lambda 'return to_string((int)id(valve_position_direct_control_number).state);'
        retain: true

globals:
  - id: pwm_enabled
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: temp_alert_level
    type: int
    restore_value: no
    initial_value: '0'

time:
  - platform: homeassistant
    id: homeassistant_time

esp32_touch:
  setup_mode: False

output:
  - platform: ledc
    id: valve_servo_pwm_output
    pin: ${servo_gpio}
    frequency: 50Hz

servo:
  - id: valve_servo
    output: valve_servo_pwm_output

script:
  - id: check_pwm_shutdown
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          if (id(valve_position_direct_control_number).state == 0.0) {
            id(valve_servo_pwm_output).turn_off();
            id(pwm_enabled) = false;
          }

number:
  - platform: template
    name: "Valve Position"
    id: valve_position_direct_control_number
    min_value: 0
    initial_value: 0
    max_value: 100
    step: 1
    optimistic: true
    set_action:
      then:
        - lambda: |-
            if (!id(pwm_enabled)) {
              id(valve_servo_pwm_output).turn_on();
              id(pwm_enabled) = true;
            }
        - servo.write:
            id: valve_servo
            level: !lambda 'return x / 100.0;'
        - lambda: |-
            float red, green, blue;
            if (x >= 100.0) { red=0.0; green=1.0; blue=0.0; }
            else if (x > 0.0) { red=1.0; green=0.5; blue=0.0; }
            else { red=1.0; green=0.0; blue=0.0; }
            id(status_led).turn_on().set_brightness(1.0).set_rgb(red,green,blue).perform();
        - script.execute: check_pwm_shutdown

  - platform: template
    name: "Valve Open Position"
    id: valve_opened_position
    min_value: 0
    initial_value: 100
    max_value: 100
    step: 1
    optimistic: true
    mode: box

  - platform: template
    name: "Valve Closed Position"
    id: valve_closed_position
    min_value: 0
    initial_value: 0
    max_value: 100
    step: 1
    optimistic: true
    mode: box

button:
  - platform: template
    name: "Close Valve"
    id: close_valve_button
    on_press:
      then:
        - number.set:
            id: valve_position_direct_control_number
            value: !lambda 'return id(valve_closed_position).state;'

  - platform: template
    name: "Open Valve"
    id: open_valve_button
    on_press:
      then:
        - number.set:
            id: valve_position_direct_control_number
            value: !lambda 'return id(valve_opened_position).state;'

  - platform: template
    name: "Test Temperature Alerts"
    id: test_temp_alerts
    icon: "mdi:alarm-light"
    on_press:
      then:
        - lambda: id(temp_alert_level) = 1;
        - delay: 5s
        - lambda: id(temp_alert_level) = 2;
        - delay: 5s
        - lambda: id(temp_alert_level) = 3;
        - delay: 5s
        - lambda: id(temp_alert_level) = 0;

binary_sensor:
  - platform: esp32_touch
    name: "Touch Toggle"
    pin: GPIO33
    threshold: 400
    on_press:
      then:
        - lambda: |-
            if (id(valve_position_direct_control_number).state >= 50)
              id(close_valve_button).press();
            else
              id(open_valve_button).press();

  - platform: template
    name: "Temperature Notice"
    device_class: problem
    lambda: 'return id(internal_temp).state >= 60.0;'

  - platform: template
    name: "Temperature Alarm"
    device_class: problem
    lambda: 'return id(internal_temp).state >= 70.0;'

  - platform: template
    name: "Temperature Emergency"
    device_class: problem
    lambda: 'return id(internal_temp).state >= 80.0;'

sensor:
  - platform: internal_temperature
    name: "Internal Temperature"
    id: internal_temp
    update_interval: 5s

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: diagnostic

  - platform: uptime
    name: Uptime

text_sensor:
  - platform: template
    name: "Temperature Alert Level"
    id: temp_alert_level_text
    icon: "mdi:thermometer-alert"
    update_interval: 1s
    lambda: |-
      int level = id(temp_alert_level);
      if (level == 3) return {"Emergency"};
      else if (level == 2) return {"Alarm"};
      else if (level == 1) return {"Notice"};
      else return {"Normal"};

  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"

light:
  - platform: neopixelbus
    restore_mode: ALWAYS_OFF
    id: status_led
    type: GRB
    variant: WS2812
    pin: GPIO21
    # A6-9 note: GPIO21 is used for NeoPixel on valve controller boards.
    # GPIO21 is also used for I2C SDA (BME680) on sensor boards (printairpipe-controller.yaml).
    # This is safe because valve boards and sensor boards are ALWAYS separate physical ESP32s.
    # NEVER combine valve controller and sensor array firmware on a single board —
    # GPIO21 cannot serve both NeoPixel and I2C SDA simultaneously.
    num_leds: 1
    internal: true
    default_transition_length: 0s

interval:
  # LED position colour (when no temperature alert)
  - interval: 1s
    then:
      - lambda: |-
          if (id(temp_alert_level) == 0) {
            float pos = id(valve_position_direct_control_number).state;
            float red, green, blue;
            if (pos >= 100.0)      { red=0.0; green=1.0; blue=0.0; }
            else if (pos > 0.0)    { red=1.0; green=0.5; blue=0.0; }
            else                   { red=1.0; green=0.0; blue=0.0; }
            id(status_led).turn_on().set_brightness(1.0).set_rgb(red,green,blue).perform();
          }

  # Temperature alert flashing (200ms tick)
  - interval: 200ms
    then:
      - lambda: |-
          float temp = id(internal_temp).state;
          int alert_level = 0;
          if (temp >= 80.0) alert_level = 3;
          else if (temp >= 70.0) alert_level = 2;
          else if (temp >= 60.0) alert_level = 1;
          int current_global = id(temp_alert_level);
          if (current_global > 0 && alert_level == 0) alert_level = current_global;
          else id(temp_alert_level) = alert_level;
          if (alert_level > 0) {
            static unsigned long last_flash = 0;
            static bool flash_state = false;
            unsigned long now = millis();
            unsigned long interval = (alert_level==3) ? 300 : (alert_level==2) ? 750 : 1500;
            if (now - last_flash >= interval) { flash_state = !flash_state; last_flash = now; }
            if (flash_state) {
              auto call = id(status_led).turn_on();
              call.set_brightness(1.0);
              call.set_rgb((alert_level==1) ? 1.0f : 1.0f,
                           (alert_level==1) ? 0.25f : 0.0f, 0.0f);
              call.perform();
            } else {
              id(status_led).turn_off().perform();
            }
          }

