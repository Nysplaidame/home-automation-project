bios = ovmf
cpu_sockets = 1
cpu_cores = 1
cpu_type = host
memory_mb = 1024
ballooning = 0
disk_storage = local-lvm
disk_size_gb = 16
disk_cache = writeback
disk_discard = on
disk_ssd = on
boot_order = scsi0
onboot = 1
startup_order = 3
network_bridge = vmbr0
network_vlan = 20
network_model = virtio
network_firewall = 0
mac_address = XX:XX:XX:XX:XX:XX   # Update after VM creation, add to dhcp-config.conf

# ============================================================================
# PROXMOX HOST REFERENCE
# ============================================================================

[proxmox-host]
hostname = pve
ip = 192.168.10.10
vlan = 10
network_interface = vmbr0
vlan_aware = yes

# Backup schedule (Datacenter > Backup):
#   VMs: 100, 101
#   Schedule: daily 02:00
#   Mode: Snapshot
#   Compression: ZSTD
#   Retention: 3 backups

# Storage pools:
#   local:      ISOs and snippets
#   local-lvm:  VM disks (thin-provisioned LVM)
