# VentSys Main Inline Fan Controller
# Device: ventsys-main-fan  IP: 192.168.50.21  VLAN 50
# DHCP hostname: ventsys-main-fan
#
# N-5 fix: Per-device canonical file created so configs/esphome/ has a consistent
# per-device file for every ESPHome device in the system.
# The authoritative firmware is ventsys/ventsys_bundle_updated/ventsys_fan_controller.yaml.
# That file is the source of truth -- this file documents the device identity and
# directs operators to the correct bundle file for flashing.
#
# F-23 fix (applied in bundle): static_ip was .81 (pre-canonical). Now .21.
# H-1 fix (applied in bundle): binary_sensor.status added; entity ID is
#   binary_sensor.ventsys_main_fan_status (used by esphome_device_offline_fdm automation).
#
# MQTT topics:
#   Subscribe: ventsys/fan/control  ("on"/"off"), ventsys/fan/percent ("0"-"100")
#   Publish:   ventsys/fan/state, ventsys/fan/percent_state
#
# To flash: use ventsys/ventsys_bundle_updated/ventsys_fan_controller.yaml
# PRE-TLS: Change mqtt.port to 1883 and remove ca_certificate before first flash.
# See: esphome_adoption_guide.md for first-flash and adoption workflow.