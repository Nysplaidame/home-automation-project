# FIX #12: This file covers ONE valve controller board (192.168.50.56) which
# drives the SLA enclosure valve on GPIO18. Each valve in the VentSys system
# is on its own ESP32 board -- the other seven valve positions each need a
# separate ESPHome YAML file and a separate board. Files still to be created:
#   ventsys_fdm_valve_controller.yaml   -- FDM enclosure valve (ventsys/fdm/valve/control)
#   ventsys_fdm_branch_controller.yaml  -- FDM branch valve    (ventsys/fdm/branch/control)
#   ventsys_fdm_360_controller.yaml     -- FDM 360 intake      (ventsys/fdm/360/control)
#   ventsys_sla_branch_controller.yaml  -- SLA branch valve    (ventsys/sla/branch/control)
#   ventsys_sla_360_controller.yaml     -- SLA 360 intake      (ventsys/sla/360/control)
#   ventsys_main_valve1_controller.yaml -- Main duct valve 1   (ventsys/main/valve1/control)
#   ventsys_main_valve2_controller.yaml -- Main duct valve 2   (ventsys/main/valve2/control)
#   ventsys_spray_fan_controller.yaml   -- Spray booth fan     (ventsys/spray-fan/control,
#                                          ventsys/spray-fan/percent) — NOTE: this is a fan
#                                          controller, not a valve. Use ventsys_fan_controller.yaml
#                                          as the template, subscribing to spray-fan topics and
#                                          publishing back to ventsys/spray-fan/state and
#                                          ventsys/spray-fan/percent_state.
# Use this file as the template: copy, update esphome.name, wifi.manual_ip,
# the mqtt on_message topic, and the servo/output GPIO pin for each board.
# GPIO assignments for the additional boards are in ventsys_wiring_reference.md.
esphome:
  # F-23 fix: name updated to match DHCP hostname in dhcp-config.conf.
  # This board drives the SLA enclosure print valve (IP .56, canonical name
  # ventsys-sla-print-valve). ESPHome name sets the mDNS hostname used by HA.
  name: ventsys-sla-print-valve
  friendly_name: VentSys SLA Print Valve
esp32:
  board: esp32dev

mqtt:
  broker: 192.168.20.101   # HA on VLAN 20 — firewall allows iot_sensors→automation:8883
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  # Local CA certificate for TLS validation (no internet dependency)
  # Copy ca-cert.pem content into secrets.yaml as mqtt_ca_cert
  ca_certificate: !secret mqtt_ca_cert
  on_message:
    - topic: ventsys/sla/valve/control
      qos: 0
      then:
        - lambda: |-
            int pct = atoi(x.c_str());
            id(set_valve_from_percent)->execute(pct);
        # Publish position back so HA number.sla_valve state_topic is updated.
        # Without this ventsys/sla/valve/state is never published and the HA
        # entity always shows 'unknown' after a restart.
        - mqtt.publish:
            topic: ventsys/sla/valve/state
            payload: !lambda 'return x;'
            retain: true

logger:

api:
  encryption:
    key: !secret api_key   # Required — prevents unauthenticated native API access

ota:
  platform: esphome
  password: !secret ota_password   # Required — prevents unauthorized firmware push

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  # F-23 fix: static IP updated to .56 to match canonical DHCP allocation for
  # ventsys-sla-print-valve (was .82 — the old pre-canonical address).
  # The DHCP reservation in dhcp-config.conf uses the same IP.
  manual_ip:
    static_ip: 192.168.50.56
    gateway: 192.168.50.1
    subnet: 255.255.255.0

output:
  - platform: ledc
    id: servo_pwm
    pin: GPIO18
    frequency: 50Hz   # No space — ESPHome frequency parser requires no whitespace

servo:
  - id: valve_servo
    output: servo_pwm

globals:
  - id: current_valve_pct
    type: int
    restore_value: yes
    initial_value: "0"

script:
  - id: set_valve_from_percent
    parameters:
      pct: int
    then:
      - lambda: |-
          int c = pct; if (c<0) c=0; if (c>100) c=100;
          id(current_valve_pct) = c;
          # C-2 fix: servo.write() takes 0.0-1.0, not degrees.
          # Old code multiplied by 180 then clamped to 1.0 (always fully open).
          id(valve_servo).write(c / 100.0f);

# H-1 fix: HA watchdog automations trigger on this sensor going offline.
# Entity ID generated by HA native API integration:
#   ventsys_valve_controller.yaml -> binary_sensor.ventsys_sla_print_valve_status
# (device name 'ventsys-sla-print-valve' + entity name 'Status')
binary_sensor:
  - platform: status
    name: "Status"
