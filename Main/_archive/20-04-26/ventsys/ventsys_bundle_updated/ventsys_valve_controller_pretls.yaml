# ESPHome — VentSys SLA Print Valve Controller (PRE-TLS / STAGE 1)
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  STAGE 1 — INITIAL HARDWARE BRING-UP ONLY                          ║
# ║  Use this file to flash and test the board before TLS is set up.   ║
# ║  MQTT is unencrypted on port 1883. Do NOT leave in production.      ║
# ║                                                                      ║
# ║  After completing ventsys_tls_implementation_guide.md Phase 4:      ║
# ║    1. Flash ventsys_valve_controller.yaml (port 8883, TLS)          ║
# ║    2. Remove this file or archive it — it must not be re-flashed    ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Differences from ventsys_valve_controller.yaml:
#   mqtt.port:           1883  (was 8883)
#   mqtt.ca_certificate: removed
#
# All other config is identical to the production TLS file.
# See ventsys_valve_controller.yaml for the full template note about
# additional valve controller boards still to be created.

esphome:
  name: ventsys-sla-print-valve
  friendly_name: VentSys SLA Print Valve
esp32:
  board: esp32dev

mqtt:
  broker: 192.168.20.101
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  on_message:
    - topic: ventsys/sla/valve/control
      qos: 0
      then:
        - lambda: |-
            int pct = atoi(x.c_str());
            id(set_valve_from_percent)->execute(pct);
        - mqtt.publish:
            topic: ventsys/sla/valve/state
            payload: !lambda 'return x;'
            retain: true

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  manual_ip:
    static_ip: 192.168.50.56
    gateway: 192.168.50.1
    subnet: 255.255.255.0

output:
  - platform: ledc
    id: servo_pwm
    pin: GPIO18
    frequency: 50Hz

servo:
  - id: valve_servo
    output: servo_pwm
    min_angle: 0deg
    max_angle: 180deg

globals:
  - id: current_valve_pct
    type: int
    restore_value: yes
    initial_value: "0"

script:
  - id: set_valve_from_percent
    parameters:
      pct: int
    then:
      - lambda: |-
          int c = pct; if (c<0) c=0; if (c>100) c=100;
          id(current_valve_pct) = c;
          float angle = (c/100.0f) * 180.0f;
          id(valve_servo).write(angle);

# ── SECRETS REQUIRED IN secrets.yaml ────────────────────────────────────────
# wifi_ssid: "HomeIoT"
# wifi_pass: "your-homeiot-password"
# mqtt_user: "mqtt"
# mqtt_pass: "your-mqtt-password"
# api_key: "your-32-byte-base64-api-key"
# ota_password: "your-ota-password"
