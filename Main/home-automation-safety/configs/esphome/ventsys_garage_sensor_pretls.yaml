# ESPHome — VentSys Garage Ambient Sensor (PRE-TLS / STAGE 1)
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  STAGE 1 — INITIAL HARDWARE BRING-UP ONLY                          ║
# ║  Use this file to flash and test the board before TLS is set up.   ║
# ║  MQTT is unencrypted on port 1883. Do NOT leave in production.      ║
# ║                                                                      ║
# ║  After completing ventsys_tls_implementation_guide.md Phase 4:      ║
# ║    1. Flash ventsys_garage_sensor.yaml (port 8883, TLS)             ║
# ║    2. Remove this file or archive it — it must not be re-flashed    ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Differences from ventsys_garage_sensor.yaml:
#   mqtt.port:           1883  (was 8883)
#   mqtt.ca_certificate: removed
#
# All other config is identical to the production TLS file.

substitutions:
  device_name: ventsys-garage-sensor
  friendly_name: "VentSys Garage Ambient"
  device_ip: "192.168.50.34"
  mqtt_topic_prefix: "ventsys/garage"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0

mqtt:
  broker: 192.168.20.101
  port: 1883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

logger:
  level: WARN

status_led:
  pin:
    number: GPIO2
    inverted: false

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

sensor:

  - platform: bme680_i2c
    address: 0x76
    update_interval: 30s

    temperature:
      name: "${friendly_name} Temperature"
      id: garage_temperature
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - filter_out: nan
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/temperature"
              payload: !lambda 'return to_string(x);'

    humidity:
      name: "${friendly_name} Humidity"
      id: garage_humidity
      unit_of_measurement: "%"
      accuracy_decimals: 1
      filters:
        - filter_out: nan
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/humidity"
              payload: !lambda 'return to_string(x);'

    pressure:
      name: "${friendly_name} Pressure"
      id: garage_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2
      filters:
        - filter_out: nan
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/baro_pressure"
              payload: !lambda 'return to_string(x);'

    gas_resistance:
      name: "${friendly_name} IAQ Gas Resistance"
      id: garage_gas_resistance
      unit_of_measurement: "Ohm"
      accuracy_decimals: 0
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/iaq"
              payload: !lambda 'return to_string((int)x);'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"

interval:
  - interval: 60s
    then:
      - mqtt.publish:
          topic: "${mqtt_topic_prefix}/online"
          payload: "true"

# ── SECRETS REQUIRED IN secrets.yaml ────────────────────────────────────────
# wifi_ssid: "HomeIoT"
# wifi_pass: "your-homeiot-password"
# mqtt_user: "mqtt"
# mqtt_pass: "your-mqtt-password"
# api_key: "your-32-byte-base64-api-key"
# ota_password: "your-ota-password"
