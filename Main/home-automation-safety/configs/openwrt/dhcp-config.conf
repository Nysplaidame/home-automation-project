## IP Address Allocation Plan

### Static Reservations (.1-.99)
- **Router gateways:** .1 on each network
- **Critical infrastructure:** .10-.99 range
- **Proxmox host:** 192.168.10.10
- **Home Assistant:** 192.168.20.101  
- **Frigate NVR:** 192.168.30.20
- **NAS:** 192.168.40.50

### DHCP Dynamic Ranges (.100+)
- **User devices:** 192.168.1.100-199 (100 addresses)
- **Admin devices:** 192.168.10.100-149 (50 addresses)
- **Automation services:** 192.168.20.110-149 (40 addresses)
- **CCTV devices:** 192.168.30.100-149 (50 addresses)
- **Storage devices:** 192.168.40.100-139 (40 addresses)
- **IoT sensors:** 192.168.50.100-190 (91 addresses)
- **Guest devices:** 192.168.99.100-150 (51 addresses)

## Security Features

### DNS Configuration
- **Local domain:** `home.local`
- **Internet DNS:** Cloudflare (1.1.1.1) + Google (8.8.8.8)
- **Isolated networks:** Local DNS only (CCTV, Storage, IoT)
- **DNS rebinding protection:** Enabled

### Lease Time Strategy  
- **Critical infrastructure:** 24h (stability)
- **User devices:** 12h (balance)
- **IoT devices:** 6h (flexibility for troubleshooting)
- **Guest devices:** 2h (security)

## Deployment Checklist

### Before Applying
1. **Update MAC addresses** in static reservations
2. **Verify interface names** match VLAN configuration
3. **Test DNS resolution** for local domains
4. **Confirm firewall rules** allow DHCP traffic

### Post-Deployment Testing
1. **DHCP assignment:** Test device gets correct IP range per VLAN
2. **DNS resolution:** Verify local and internet DNS works
3. **Static reservations:** Confirm critical devices get fixed IPs
4. **Lease renewals:** Monitor DHCP lease database
5. **Cross-VLAN isolation:** Verify isolated networks can't reach internet

## Troubleshooting

### Common Issues
- **No IP assignment:** Check interface binding in network config
- **Wrong IP range:** Verify DHCP start/limit parameters
- **DNS not working:** Check DNS server configuration
- **Static IP conflicts:** Verify MAC addresses in reservations

### Log Files
- **DHCP leases:** `/tmp/dhcp.leases`
- **DNS queries:** `logread | grep dnsmasq`
- **DHCP requests:** System log in LuCI interface

