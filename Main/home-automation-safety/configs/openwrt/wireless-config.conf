# File equivalent: /etc/config/wireless
# GL.iNet GL-MT6000 WiFi Configuration - Multi-SSID VLAN Setup
# Version: 2.0
# Date: 2025-09-25
# Hardware: GL.iNet GL-MT6000 with OpenWrt
# Repository: https://github.com/Nysplaidame/home-automation-project

# ============================================================================
# RADIO CONFIGURATION
# ============================================================================

# 2.4GHz Radio Configuration
config wifi-device 'radio0'
    option type 'mac80211'
    option path 'platform/18000000.wmac'
    option band '2g'
    # NOTE: In OpenWrt's mac80211 architecture ALL SSIDs on this radio share a
    # SINGLE channel. The `option channel` entries on individual wifi-iface blocks
    # below are SILENTLY IGNORED — only this radio-level setting takes effect.
    # Channel 6 chosen as the single 2.4GHz channel because:
    #   - HomeIoT (VentSys fire safety) requires a fixed, stable channel
    #   - Channel 6 is a standard non-overlapping 2.4GHz channel (1/6/11)
    #   - HomeMain 2.4GHz, HomeAdmin-2G, and HomeGuest all share channel 6
    #   - HomeMain clients that support 5GHz connect to radio1 (auto channel) instead
    # If stricter channel separation is needed, the only option is a separate
    # access point on a different radio for some SSIDs.
    option channel '6'
    option htmode 'HE40'                     # WiFi 6 with 40MHz channels
    option country 'GB'                      # UK regulatory domain
    option txpower '20'                      # Maximum power for coverage
    option mu_beamformer '1'                 # Multi-user MIMO beamforming
    option legacy_rates '1'                  # Support for older devices
    option beacon_int '100'                  # Default beacon interval
    option rts '2346'                        # RTS threshold
    option frag '2346'                       # Fragmentation threshold
    
# 5GHz Radio Configuration  
config wifi-device 'radio1'
    option type 'mac80211'
    option path 'pci0000:00/0000:00:01.0/0000:01:00.0'
    option band '5g'
    option channel 'auto'                    # Auto-select best 5GHz channel
    option htmode 'HE80'                     # WiFi 6 with 80MHz channels
    option country 'GB'                      # UK regulatory domain
    option txpower '23'                      # Maximum 5GHz power
    option mu_beamformer '1'                 # Multi-user MIMO beamforming
    option beacon_int '100'                  # Default beacon interval
    option rts '2346'                        # RTS threshold
    option frag '2346'                       # Fragmentation threshold
    # ANNOTATION: 5GHz radio optimized for maximum performance
    # HE80 provides maximum bandwidth for capable devices
    # Auto channel selection avoids interference better on 5GHz

# ============================================================================
# MAIN USER NETWORK - VLAN 1 (2.4GHz + 5GHz)
# Primary WiFi for phones, laptops, tablets, smart TVs
# Maximum compatibility and performance for everyday users
# ============================================================================

# Main Network - 2.4GHz
config wifi-iface 'main_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeMain'
    option network 'lan'
    option encryption 'sae-mixed'            # WPA3 with WPA2 fallback
    option key 'YOUR_MAIN_WIFI_PASSWORD_HERE'
    option ieee80211w '1'                    # PMF optional for compatibility
    option wpa_disable_eapol_key_retries '1' # Security enhancement
    option bss_transition '1'                # Band steering support
    option wnm_sleep_mode '1'                # Power saving for mobile devices
    # NOTE: channel is set at radio0 level (channel 6) — no per-interface override possible
    option htmode 'HE40'                     # 40MHz for better performance
    option txpower '20'                      # Full power for maximum coverage
    # NOTE: channel is set at radio0 level (channel 6) — no per-interface override possible.
    # The annotation below about "Channel 1" is stale — all 2.4GHz SSIDs share channel 6.
    # ANNOTATION: SAE-mixed allows WPA3 devices to use enhanced security while
    # maintaining compatibility with WPA2-only devices

# Main Network - 5GHz
config wifi-iface 'main_5g'
    option device 'radio1'
    option mode 'ap'
    option ssid 'HomeMain'                   # Same SSID for seamless roaming
    option network 'lan'
    option encryption 'sae-mixed'            # WPA3 with WPA2 fallback
    option key 'YOUR_MAIN_WIFI_PASSWORD_HERE'
    option ieee80211w '1'                    # PMF optional
    option wpa_disable_eapol_key_retries '1' # Security enhancement
    option bss_transition '1'                # Band steering support
    option wnm_sleep_mode '1'                # Power saving support
    option channel 'auto'                    # Auto-select best 5GHz channel
    option htmode 'HE80'                     # 80MHz for maximum 5GHz performance
    option txpower '23'                      # Full 5GHz power
    # ANNOTATION: 5GHz auto-selection allows router to avoid interference
    # HE80 provides maximum bandwidth for capable devices
    # Same SSID enables seamless band steering - devices automatically
    # choose optimal band based on signal strength and capabilities

# ============================================================================
# ADMIN NETWORK - VLAN 10 (5GHz preferred, 2.4GHz backup)
# Administrative devices, management laptops, admin tablets
# Enhanced security through frequency separation and hidden SSID option
# ============================================================================

# Admin Network - 5GHz Primary
config wifi-iface 'admin_5g'
    option device 'radio1'
    option mode 'ap'
    option ssid 'HomeAdmin'
    option network 'management'
    option encryption 'sae'                  # WPA3-only for enhanced security
    option key 'YOUR_ADMIN_WIFI_PASSWORD_HERE'
    option ieee80211w '2'                    # PMF required for WPA3
    option wpa_disable_eapol_key_retries '1' # Security enhancement
    option hidden '0'                        # Visible by default
    option maxassoc '8'                      # Limit concurrent connections
    option channel 'auto'                    # Let router optimize
    option htmode 'HE80'                     # Maximum performance
    # ANNOTATION: WPA3-only (SAE) provides enhanced security for admin access
    # PMF required (ieee80211w '2') prevents deauthentication attacks
    # 5GHz reduces 2.4GHz congestion and provides better security separation
    # Admin devices typically support 5GHz, maxassoc limits exposure
    # Consider setting hidden '1' for additional security through obscurity

# Admin Network - 2.4GHz Backup
config wifi-iface 'admin_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeAdmin-2G'               # Distinct SSID for manual selection
    option network 'management'
    option encryption 'sae'                  # WPA3-only
    option key 'YOUR_ADMIN_WIFI_PASSWORD_HERE'
    option ieee80211w '2'                    # PMF required
    option wpa_disable_eapol_key_retries '1'
    option hidden '1'                        # Hidden for security
    option maxassoc '4'                      # Limited connections
    # NOTE: channel 11 annotation below is informational only — actual channel
    # is set at radio0 level (channel 6). All 2.4GHz SSIDs share that channel.
    # NOTE: channel annotation below is stale — actual channel is set at radio0
    # level (channel 6). All 2.4GHz SSIDs share channel 6.
    option htmode 'HE20'                     # 20MHz for stability
    option txpower '18'                      # Slightly reduced power
    # ANNOTATION: Backup admin access on 2.4GHz for emergency management
    # Hidden SSID and reduced power limit exposure

# ============================================================================
# IOT SENSORS NETWORK - VLAN 50 (2.4GHz only)
# Fire safety sensors, environmental monitors, smart switches
# Optimized for IoT device compatibility and power efficiency
# ============================================================================

config wifi-iface 'iot_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeIoT'
    option network 'iot_sensors'
    option encryption 'psk2'                 # WPA2 for IoT compatibility
    option key 'YOUR_IOT_WIFI_PASSWORD_HERE'
    option ieee80211w '0'                    # PMF disabled for compatibility
    option maxassoc '50'                     # Support many IoT devices
    option dtim_period '3'                   # Optimized for low-power devices
    option isolate '1'                       # Client isolation enabled
    option channel '6'                       # Fixed channel — shares radio0's channel 6
    option htmode 'HT20'                     # 20MHz for maximum compatibility
    option txpower '15'                      # Reduced power, sufficient for IoT
    # ANNOTATION: PMF (Protected Management Frames) disabled for IoT compatibility
    # Reasoning:
    # - Many IoT devices use older WiFi chipsets (2.4GHz-only requirement)
    # - PMF can cause connection failures on devices with incomplete 802.11w support
    # - Trade-off: Slightly reduced security vs device functionality
    # - IoT network is already isolated from critical systems via firewall
    # - WPA2 (PSK2) provides adequate security for isolated IoT devices
    # 
    # Channel note: ALL 2.4GHz SSIDs (HomeMain-2G, HomeAdmin-2G, HomeIoT, HomeGuest)
    # share channel 6, set at radio0 level. There are no "main networks on channels 1/11"
    # — per-interface channel overrides are silently ignored by mac80211. Channel 6 was
    # chosen because HomeIoT (fire safety) requires a fixed stable channel, and 6 is a
    # standard non-overlapping 2.4GHz choice. The 'option channel' line above is kept for
    # documentation/intent only; the radio0-level setting is what actually takes effect.
    # 
    # Client isolation (isolate '1') prevents IoT devices from
    # communicating directly with each other at Layer 2, reducing attack
    # surface if one device becomes compromised
    #
    # HT20 (20MHz width) maximizes compatibility with legacy IoT devices
    # and reduces interference with other networks

# ============================================================================
# GUEST NETWORK - Isolated (2.4GHz only)
# Visitor access with internet only, no local network access
# Maximum isolation for untrusted devices
# ============================================================================

config wifi-iface 'guest_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeGuest'
    option network 'guest'
    option encryption 'psk2'                 # WPA2 for broad compatibility
    option key 'YOUR_GUEST_WIFI_PASSWORD_HERE'
    option ieee80211w '0'                    # PMF disabled for compatibility
    option isolate '1'                       # Client isolation enabled
    option maxassoc '10'                     # Limit guest connections
    # NOTE: channel is set at radio0 level (channel 6) — per-interface override not possible
    option htmode 'HT20'                     # 20MHz for stability
    option txpower '18'                      # Moderate power
    # ANNOTATION: Guest network completely isolated via firewall rules
    # Client isolation prevents guest devices from seeing each other
    # All 2.4GHz SSIDs share channel 6 (set at radio0 level)
    # Limited connections (maxassoc '10') prevents abuse
    # WPA2 provides adequate security for temporary guest access
    # No PMF to ensure compatibility with all guest devices

# ============================================================================
# FUTURE EXPANSION - DMZ NETWORK (DISABLED)
# Placeholder for DMZ WiFi access if needed
# Currently DMZ services expected to use wired connections
# ============================================================================

# DMZ Network - 5GHz (Disabled by default)
config wifi-iface 'dmz_5g'
    option device 'radio1'
    option mode 'ap'
    option ssid 'HomeDMZ'
    option network 'dmz'
    option encryption 'sae'                  # WPA3 for DMZ security
    option key 'YOUR_DMZ_WIFI_PASSWORD_HERE'
    option ieee80211w '2'                    # PMF required
    option maxassoc '5'                      # Limited connections
    option channel 'auto'
    option htmode 'HE80'
    option disabled '1'                      # Disabled by default
    # ANNOTATION: DMZ WiFi access disabled by default
    # Enable only if DMZ services require wireless connectivity
    # WPA3 with PMF provides enhanced security for DMZ access
    # Limited connections reduce potential attack surface

# ============================================================================
# CHANNEL ALLOCATION STRATEGY
# ============================================================================

# IMPORTANT — mac80211 ARCHITECTURE CONSTRAINT:
# All SSIDs on a single radio MUST share one channel. The `option channel`
# setting on individual wifi-iface blocks is silently ignored by mac80211 —
# only the radio-level `option channel` setting (above) takes effect.
#
# 2.4GHz (radio0) — ALL SSIDs share channel 6:
#   HomeMain-2G, HomeAdmin-2G, HomeIoT, HomeGuest — all on channel 6.
#   Channel 6 was chosen because HomeIoT (VentSys fire safety) requires a
#   fixed, stable channel, and 6 is a standard non-overlapping 2.4GHz channel.
#   If strict per-SSID channel separation is required, a second physical access
#   point with a separate radio is the only option.
#
# 5GHz (radio1) — auto channel selection:
#   HomeMain-5G, HomeAdmin-5G, HomeDMZ — auto channel via radio1.
#   5GHz has more non-overlapping channels; auto-selection handles interference.
#   Capable main-user devices will prefer 5GHz, reducing 2.4GHz load.
#
# Power level strategy:
#   Main networks: Full power for maximum coverage
#   IoT network: Reduced power (15 dBm) — sufficient range, less interference
#   Admin backup: Reduced power (18 dBm) for shorter range/security
#   Guest network: Moderate power (18 dBm) — adequate coverage

# ============================================================================
# SECURITY FEATURES SUMMARY
# ============================================================================

# Network Isolation Levels (strongest to weakest):
# 1. IoT Sensors: No internet, no inter-device communication, firewall isolated
# 2. Guest: Internet only, no local access, client isolation
# 3. DMZ: Controlled internet, isolated from internal networks  
# 4. Admin: Full access, WPA3-only, limited connections
# 5. Main Users: Full access, WPA3 with WPA2 fallback
#
# WiFi Security Features:
# - WPA3 (SAE) on admin and DMZ networks for enhanced security
# - WPA3-mixed on main networks for compatibility with performance
# - WPA2 on IoT and guest for maximum device compatibility
# - PMF enabled where compatible, disabled for IoT/guest compatibility
# - Client isolation on IoT and guest networks
# - Connection limits on admin, DMZ, and guest networks
# - Channel separation for interference reduction and security

# ============================================================================
# DEPLOYMENT CHECKLIST
# ============================================================================

# Before Applying Configuration:
# 1. Update all WiFi passwords in this configuration file
# 2. Verify channel assignments don't conflict with neighboring networks
# 3. Test IoT device compatibility with WPA2/no-PMF settings
# 4. Confirm firewall rules are applied for network isolation
# 5. Document WiFi credentials securely
#
# Post-Deployment Testing:
# 1. Verify main devices can connect to both 2.4GHz and 5GHz
# 2. Test IoT devices connect successfully to HomeIoT network
# 3. Confirm admin devices can access HomeAdmin networks
# 4. Test guest devices have internet-only access
# 5. Verify network isolation via firewall rules
# 6. Check channel utilization and interference levels
# 7. Monitor connection stability and performance
#
# Performance Monitoring:
# - Use WiFi analyzer to verify channel separation
# - Monitor connection counts per network
# - Check for interference from neighboring networks
# - Validate power levels provide adequate coverage
# - Test roaming behavior between 2.4GHz and 5GHz