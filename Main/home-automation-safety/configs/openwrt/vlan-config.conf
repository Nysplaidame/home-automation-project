
# File equivalent: /etc/config/network
# GL.iNet GL-MT6000 with OpenWrt - DSA Switch Configuration

#
# Architecture Context: docs/decisions/01-network-architecture.md
# Network Design: 9-zone security-segmented architecture
# Project Context: README.md
# Hardware: GL.iNet GL-MT6000 with modern DSA switch architecture
#
# Related Documents:
# - configs/openwrt/firewall-config.conf - Security rules referencing these networks
# - docs/diagrams/network/ - Visual network topology
# - configs/openwrt/dhcp-config.conf - DHCP scopes for these networks
# - configs/openwrt/wireless-config.conf - WiFi networks mapped to VLANs
#
# Network Architecture Summary:
# - lan: 192.168.1.0/24 (Main users - phones, laptops, tablets) - VLAN 1
# - management: 192.168.10.0/24 (Admin devices, Proxmox host) - VLAN 10
# - automation: 192.168.20.0/24 (Home Assistant VM) - VLAN 20
# - cctv: 192.168.30.0/24 (Cameras, isolated from internet) - VLAN 30
# - printers: 192.168.35.0/24 (3D printers, limited internet) - VLAN 35
# - storage: 192.168.40.0/24 (NAS, backup services) - VLAN 40
# - iot_sensors: 192.168.50.0/24 (Fire safety sensors, smart plugs) - VLAN 50
# - monitoring: 192.168.60.0/24 (Future monitoring VMs) - VLAN 60
# - dmz: 192.168.70.0/24 (VPN endpoint, public services) - VLAN 70
# - guest: 192.168.99.0/24 (Visitor access, internet-only) - VLAN 99 (WiFi-only)
#
# Physical Port Assignment:
# - lan1: Trunk to Proxmox (VLANs 10,20,30,40,50,60,70 tagged)
# - lan2: Management access (VLAN 10 untagged) + other VLANs tagged
# - lan3: Camera POE switch (VLAN 30 untagged) + management tagged
# - lan4: NAS direct connection (VLAN 40 untagged) + management tagged
# - lan5: Recovery / WiFi AP port (VLAN 1 untagged only)
#         During setup: connect laptop here for guaranteed router access
#         After setup: connect TP-Link TL-WA801N in AP mode to extend HomeMain

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================

config globals 'globals'
    option ula_prefix 'fd12:3456:789a::/48'
# ANNOTATION: Unique Local Address prefix for IPv6
# Provides local IPv6 addressing independent of ISP

# ============================================================================
# LOOPBACK INTERFACE
# ============================================================================

config interface 'loopback'
    option device 'lo'
    option proto 'static'
    option ipaddr '127.0.0.1'
    option netmask '255.0.0.0'

# ============================================================================
# WAN INTERFACE (Internet Connection)
# ============================================================================

config interface 'wan'
    option device 'wan'
    option proto 'dhcp'
    option peerdns '0'				# Don't use ISP DNS
    option dns '1.1.1.1 1.0.0.1' 	# Cloudflare DNS for privacy
	# ANNOTATION: WAN interface configured for ISP connection
	# Custom DNS prevents ISP DNS manipulation and improves privacy

config interface 'wan6'
    option device 'wan'
    option proto 'dhcpv6'
    option reqaddress 'try'		# Request IPv6 address
    option reqprefix 'auto'		# Request IPv6 prefix delegation

# ============================================================================
# MAIN BRIDGE CONFIGURATION
# Modern DSA (Distributed Switch Architecture) implementation
# ============================================================================

config device
    option name 'br-lan'
    option type 'bridge'
    list ports 'lan1'	# Trunk port to Proxmox
    list ports 'lan2'	# Management + multi-VLAN port  
    list ports 'lan3'	# Camera POE switch port
    list ports 'lan4'	# NAS direct connection port
    list ports 'lan5'	# Recovery / WiFi AP port (VLAN 1 untagged only — see below)
    option igmp_snooping '1'	# IGMP snooping for multicast efficiency
    option stp '1'	# Spanning Tree Protocol enabled
    option stp_hello_time '2'	# STP hello interval (seconds)
    option stp_forward_delay '15'	# STP forwarding delay (seconds)
	# ANNOTATION: STP enabled to prevent network loops in VM environment
	# Essential safety mechanism where Proxmox VMs might create bridge loops
	# IGMP snooping improves multicast performance for cameras/streaming

# ============================================================================
# BRIDGE VLAN CONFIGURATION (Modern DSA)
# Critical: Proxmox trunk port configuration
# ============================================================================

# VLAN 1: Main Users Network (WiFi-only for main users — lan5 added as recovery/AP port)
config bridge-vlan
    option device 'br-lan'
    option vlan '1'
    option local '1'                        # Router participates in this VLAN
    list ports 'lan5:u*'                    # Recovery port / WiFi AP — PVID (untagged ingress = VLAN 1)
    # lan5 serves two purposes across the project lifecycle:
    #   1. DURING SETUP / RECOVERY: Connect a laptop here for guaranteed SSH access to
    #      192.168.1.1 regardless of VLAN misconfiguration on other ports. Because lan5
    #      only carries VLAN 1 (no tagged VLANs, no complex config), it cannot be broken
    #      by errors in VLAN 10/20/30/40/50 configuration.
    #   2. AFTER SETUP: Connect a TP-Link TL-WA801N (or similar) access point in AP mode
    #      to extend the HomeMain network (VLAN 1, 192.168.1.x) to areas with poor WiFi
    #      coverage. The extender receives untagged VLAN 1 traffic and broadcasts it as
    #      its own SSID. Clients connecting to the extender get 192.168.1.x IPs from the
    #      router's DHCP pool via the existing lan zone — no config changes are required
    #      when transitioning from recovery use to AP use, just swap the cable.
    #
    # lan5 intentionally carries VLAN 1 ONLY — not tagged on any other VLAN.
    # This keeps the recovery path simple and prevents AP clients from accidentally
    # accessing management or IoT VLANs.
    #
    # Note: VLAN 1 is otherwise WiFi-only for main user devices (HomeMain SSID).
    # lan2/lan3/lan4 are not listed here because their PVIDs are VLAN 10/30/40
    # respectively — listing them here would conflict with those assignments.

# VLAN 10: Management Network 
config bridge-vlan
    option device 'br-lan'
    option vlan '10'
    option local '1'                        # Router participates
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged)
    list ports 'lan2:u*'                    # Management port — PVID (untagged ingress = VLAN 10)
    list ports 'lan3:t'                     # Camera port (tagged for admin access)
    list ports 'lan4:t'                     # NAS port (tagged for admin access)
    # ANNOTATION: Management network for admin devices and Proxmox host
    # Untagged on lan2 for direct admin device connection
    # Tagged on other ports for administrative access to those network segments

# VLAN 20: Automation Network  
config bridge-vlan
    option device 'br-lan'
    option vlan '20'
    option local '1'                        # Router participates
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged)
    # ANNOTATION: Automation network for Home Assistant and services
    # Only accessible via Proxmox VMs - no direct physical connections
    # Isolated design ensures services run in controlled VM environment

# VLAN 30: CCTV Network
config bridge-vlan
    option device 'br-lan'
    option vlan '30'
    option local '1'                        # Router participates
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged for Frigate VM)
    list ports 'lan3:u*'                    # Camera POE switch — PVID (untagged ingress = VLAN 30)
    # ANNOTATION: CCTV network optimized for security cameras
    # Untagged on lan3 allows direct camera connection via POE switch
    # Tagged to Proxmox for Frigate VM access to camera streams
    # Completely isolated from internet via firewall rules

# VLAN 35: Printers Network
# ADR: docs/decisions/02-printer-vlan-architecture.md
config bridge-vlan
    option device 'br-lan'
    option vlan '35'
    option local '1'                        # Router participates
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged — future printer VM or bridge)
    # ANNOTATION: Dedicated printer VLAN for Bambu Lab P1S and future 3D printers
    # WiFi-only access via HomePrinters SSID (2.4GHz — Bambu printers require 2.4GHz)
    # Limited internet access (port 443 only) for Bambu Cloud OTA and slicer sync
    # Isolated from LAN to prevent printer firmware exploits from reaching user devices
    # Bambuddy (VLAN 30) reaches printers here via firewall rule

# VLAN 40: Storage Network
config bridge-vlan
    option device 'br-lan'
    option vlan '40'
    option local '1'                        # Router participates
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged)
    list ports 'lan4:u*'                    # NAS direct connection — PVID (untagged ingress = VLAN 40)
    # ANNOTATION: Storage network for NAS and backup services
    # Untagged on lan4 for direct NAS connection
    # Tagged to Proxmox for VM access to storage services
    # No internet access maintains data security

# VLAN 50: IoT Sensors Network
config bridge-vlan
    option device 'br-lan'
    option vlan '50'
    option local '1'                        # Router participates
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged)
    # ANNOTATION: IoT sensors network for fire safety and environmental monitoring
    # WiFi-only access via dedicated HomeIoT SSID (no wired connections)
    # Completely isolated from internet for safety-critical operation
    # Home Assistant VM bridges to this network for device control

# VLAN 60: Monitoring Network
config bridge-vlan
    option device 'br-lan'
    option vlan '60'
    option local '1'                        # Router participates
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged)
    # ANNOTATION: Monitoring network for future network analysis VMs
    # VM-only access via Proxmox trunk connection
    # Designed for Zabbix, Grafana, ELK stack, and network scanning tools
    # Controlled internet access for monitoring tool updates

# VLAN 70: DMZ Network
config bridge-vlan
    option device 'br-lan'
    option vlan '70'
    option local '1'                        # Router participates  
    list ports 'lan1:t'                     # Trunk to Proxmox (tagged)
    # ANNOTATION: DMZ network for public-facing services
    # VM-only access ensures controlled deployment
    # Designed for VPN endpoints and public web services
    # Controlled internet access with strict firewall rules

# VLAN 99: Guest Network (WiFi-only access) - SECURITY CRITICAL
config bridge-vlan
    option device 'br-lan'
    option vlan '99'
    option local '1'                        # Router participates
    # ANNOTATION: SECURITY FIX - No physical ports assigned
    # WiFi-only guest access prevents Layer 2 attacks on internal VLANs
    # Complete broadcast domain isolation from all internal networks
    # Prevents ARP poisoning, MAC flooding, and VLAN hopping attacks

# ============================================================================
# LOGICAL NETWORK INTERFACES
# These create the networks referenced by firewall zones
# ============================================================================

# Main LAN Network - VLAN 1 (192.168.1.0/24)
# Primary network for everyday devices: phones, laptops, tablets, smart TVs
config interface 'lan'
    option proto 'static'
    option device 'br-lan.1'
    option ipaddr '192.168.1.1'
    option netmask '255.255.255.0'
    option ip6assign '60'                   # IPv6 subnet delegation
    # ANNOTATION: Main user network with full internet access
    # Gateway .1 provides DHCP, DNS, and routing services
    # IPv6 support enabled for future compatibility

# Management Network - VLAN 10 (192.168.10.0/24)
# Administrative devices, Proxmox host, and network management
config interface 'management'
    option proto 'static'
    option device 'br-lan.10'
    option ipaddr '192.168.10.1'
    option netmask '255.255.255.0'
    # ANNOTATION: Management network with full administrative access
    # FIX #17: Proxmox host is at 192.168.10.10 (static, below DHCP pool).
    # The DHCP pool starts at .100 — admin devices get .100-.149 dynamically.
    # Previous annotation said "Proxmox host at .100" which was wrong; .100 is
    # the first dynamic DHCP address, not a reserved static.
    # Static assignments: Proxmox 192.168.10.10, router gateway 192.168.10.1
    # Complete access to all other network segments for administration

# Automation Network - VLAN 20 (192.168.20.0/24)  
# Home Assistant VM, Frigate VM, and automation services
config interface 'automation'
    option proto 'static'
    option device 'br-lan.20'
    option ipaddr '192.168.20.1'
    option netmask '255.255.255.0'
    # ANNOTATION: Automation services network with controlled internet access
    # Home Assistant at .101; other services .102-.109 as needed
    # HA is the only VM here — Frigate is on VLAN 30 (cctv), not VLAN 20

# CCTV Network - VLAN 30 (192.168.30.0/24)
# Security cameras and video processing (completely isolated from internet)
config interface 'cctv'
    option proto 'static'
    option device 'br-lan.30'
    option ipaddr '192.168.30.1'
    option netmask '255.255.255.0'
    # ANNOTATION: CCTV network with no internet access for security
    # Cameras get static IPs .21-.29, Frigate VM accesses via bridge
    # Local DNS only prevents external communication

# Printers Network - VLAN 35 (192.168.35.0/24)
# 3D printers — Bambu Lab P1S, future printers (limited internet for OTA/cloud)
config interface 'printers'
    option proto 'static'
    option device 'br-lan.35'
    option ipaddr '192.168.35.1'
    option netmask '255.255.255.0'
    # ANNOTATION: Dedicated printer network isolated from main LAN
    # P1S at .200, Athena 2 at .201, future printers .202+
    # Limited internet (port 443 only) for Bambu Cloud sync and OTA updates
    # Bambuddy (VLAN 30) reaches printers via cross-VLAN firewall rule

# Storage Network - VLAN 40 (192.168.40.0/24)
# NAS, backup services, and data storage (isolated from internet)
config interface 'storage'
    option proto 'static'
    option device 'br-lan.40'
    option ipaddr '192.168.40.1'
    option netmask '255.255.255.0'
    # ANNOTATION: Storage network isolated from internet for data security
    # NAS at .50, backup services .51-.59
    # Accessible by Frigate for footage storage, HA for configuration backup

# IoT Sensors Network - VLAN 50 (192.168.50.0/24)
# Fire safety sensors, environmental monitors, smart plugs (no internet - critical)
config interface 'iot_sensors'
    option proto 'static'
    option device 'br-lan.50'
    option ipaddr '192.168.50.1'
    option netmask '255.255.255.0'
    # ANNOTATION: IoT network completely isolated from internet for safety
    # Device IP allocation (static DHCP, all on 192.168.50.0/24):
    #   Fans: .21-.22 | Sensors: .31-.34 | Airflow: .41-.43
    #   Butterfly valves: .51-.56 | 360° valves: .61-.62 | Smart plugs: .71-.78
    #   Reserved: .79-.89 | Dynamic DHCP: .100-.190
    # Only Home Assistant can communicate with these devices

# Monitoring Network - VLAN 60 (192.168.60.0/24)
# Future network monitoring and analysis VMs
config interface 'monitoring'
    option proto 'static'
    option device 'br-lan.60'
    option ipaddr '192.168.60.1'
    option netmask '255.255.255.0'
    # ANNOTATION: Monitoring network for network analysis tools
    # Planned: Zabbix .10, Grafana .11, ELK Stack .12, Network Scanner .13
    # Controlled internet access for tool updates and alert notifications
    # Can monitor all other networks via firewall-controlled access

# DMZ Network - VLAN 70 (192.168.70.0/24)
# Public services with controlled internet access
config interface 'dmz'
    option proto 'static'
    option device 'br-lan.70'
    option ipaddr '192.168.70.1'
    option netmask '255.255.255.0'
    # ANNOTATION: DMZ for public-facing services
    # VPN endpoint at .10, web services .11-.19
    # Controlled internet access via specific firewall rules
    # Isolated from internal networks except management access

# Guest Network - VLAN 99 (192.168.99.0/24) - SECURITY FIXED
# Visitor internet access with proper Layer 2 isolation
config interface 'guest'
    option proto 'static'
    option device 'br-lan.99'
    option ipaddr '192.168.99.1'
    option netmask '255.255.255.0'
    # ANNOTATION: Guest network now uses dedicated VLAN 99
    # Complete Layer 2 isolation from all internal networks
    # No physical ports carry VLAN 99 traffic - WiFi-only access
    # Prevents guest devices from seeing internal broadcast/multicast traffic
    # Stops potential Layer 2 attacks against internal infrastructure

# ============================================================================
# WIREGUARD VPN INTERFACE
# ============================================================================

# WireGuard Interface
# B6/B7 fix: Only one WireGuard UCI interface is needed. A separate 'vpn' static
# interface pointing at wg0 (which existed here previously) is invalid in OpenWrt —
# a WireGuard device cannot be used as the 'device' option for a static interface.
# The firewall vpn_clients zone now references 'wg0' directly.
# The VPN subnet (10.0.0.0/24) is declared via the 'addresses' list below.
config interface 'wg0'
    option proto 'wireguard'
    option private_key 'YOUR_PRIVATE_KEY_HERE'
    option listen_port '51820'
    option addresses '10.0.0.1/24'

# ============================================================================
# WIREGUARD PEER CONFIGURATIONS
# ============================================================================

# Mobile Device 1
config wireguard_wg0
    option public_key 'CLIENT1_PUBLIC_KEY_HERE'
    option allowed_ips '10.0.0.2/32'
    option persistent_keepalive '25'

# Mobile Device 2
config wireguard_wg0
    option public_key 'CLIENT2_PUBLIC_KEY_HERE'
    option allowed_ips '10.0.0.3/32'
    option persistent_keepalive '25'

# Laptop/Desktop
config wireguard_wg0
    option public_key 'CLIENT3_PUBLIC_KEY_HERE'
    option allowed_ips '10.0.0.4/32'
    option persistent_keepalive '25'

# ============================================================================
# NETWORK VALIDATION NOTES
# ============================================================================

# Physical Connection Verification:
# 1. lan1 → Proxmox server (single cable, trunk carrying VLANs 10,20,30,35,40,50,60,70)
# 2. lan2 → Admin laptop/management devices (VLAN 10 untagged)
# 3. lan3 → Camera POE switch (VLAN 30 untagged)
# 4. lan4 → Raspberry Pi NAS (VLAN 40 untagged)
# 5. lan5 → Recovery laptop during setup, then TP-Link TL-WA801N AP (both use VLAN 1 untagged)

# IP Address Assignments (Static):
# - Router Gateway IPs: .1 on each network
# - Proxmox Host: 192.168.10.10 (management network) -- FIX #17: was .100, corrected to .10
# - Home Assistant VM: 192.168.20.101 (automation network)
# - Frigate VM: 192.168.30.20 (CCTV network)
# - NAS: 192.168.40.50 (storage network)
# - DHCP Ranges: Defined in /etc/config/dhcp

# Critical Safety Notes:
# - VLAN 50 (IoT sensors) must remain isolated from internet
# - VLAN 30 (CCTV) must remain isolated from internet  
# - Trunk port to Proxmox is critical for VM networking
# - All networks depend on proper firewall zone configuration
# - VPN: single wg0 WireGuard interface only — no separate 'vpn' static interface
#   (F-08/B6/B7: old two-interface pattern removed; vpn_clients firewall zone references wg0 directly)