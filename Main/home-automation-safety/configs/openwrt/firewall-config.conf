# ============================================================================
# SAFETY & SECURITY RULES
# ============================================================================

echo "Configuring safety and security rules..."

# REMOVED: 'IoT Sensor Mesh Communication' rule (was: iot_sensors → iot_sensors ACCEPT)
# Reason: ESPHome devices communicate exclusively via MQTT through Home Assistant (VLAN 20).
# They have no legitimate need for peer-to-peer L3 routing on VLAN 50. The rule created
# unnecessary lateral movement risk if any sensor device were compromised. WiFi client
# isolation (isolate '1' in wireless-config.conf) already prevents L2 direct communication,
# but a firewall rule would have bypassed that at L3. Removed 2025-09-25.

# ── BAMBUDDY (P1S PRINTER INTEGRATION) ──────────────────────────────────────
# Bambuddy Docker container (192.168.30.20) needs to reach:
#   1. P1S printer (192.168.1.200) for MQTT and file transfer
#   2. Mosquitto broker (192.168.20.101:1883) to publish print events to HA
#   3. HA REST API (192.168.20.101:8123) for smart plug control
# These rules must appear BEFORE the 'Block CCTV to Automation' rule below.

uci add firewall rule
uci set firewall.@rule[-1].name='Bambuddy to P1S'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].src_ip='192.168.30.20'
uci set firewall.@rule[-1].dest='lan'
uci set firewall.@rule[-1].dest_ip='192.168.1.200'
# FIX #34: Port 990 (implicit FTPS) removed. Bambu Lab printers use explicit
# FTPS on port 21 (FTPS via AUTH TLS command on the standard FTP control port),
# not implicit FTPS on 990. Port 990 is unnecessary and was likely copied from
# a generic FTPS reference. Only 8883 (printer MQTT/TLS) and 21 (FTPS) are
# required for Bambuddy to communicate with the P1S.
uci set firewall.@rule[-1].dest_port='8883,21'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Bambuddy MQTT to HA'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].src_ip='192.168.30.20'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_ip='192.168.20.101'
# DEPLOYMENT NOTE — TWO-STAGE MQTT SETUP (matches VentSys MQTT pattern):
# Stage 1 (before TLS): change dest_port to '1883' for initial testing
#   uci add firewall rule
#   uci set firewall.@rule[-1].name='TEMP Bambuddy MQTT plain'
#   uci set firewall.@rule[-1].src='cctv'
#   uci set firewall.@rule[-1].src_ip='192.168.30.20'
#   uci set firewall.@rule[-1].dest='automation'
#   uci set firewall.@rule[-1].dest_ip='192.168.20.101'
#   uci set firewall.@rule[-1].dest_port='1883'
#   uci set firewall.@rule[-1].proto='tcp'
#   uci set firewall.@rule[-1].target='ACCEPT'
#   uci commit firewall && /etc/init.d/firewall restart
# Stage 2 (after TLS migration): remove the TEMP rule; this 8883 rule stays.
# Also update docker-compose.yml Bambuddy MQTT_PORT from 1883 to 8883 at that time
# — see ventsys_tls_implementation_guide.md for the full migration checklist.
uci set firewall.@rule[-1].dest_port='8883'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Bambuddy to HA API'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].src_ip='192.168.30.20'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_ip='192.168.20.101'
uci set firewall.@rule[-1].dest_port='8123'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Block all other cross-zone communication by default
uci add firewall rule
uci set firewall.@rule[-1].name='Block CCTV to Automation'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block Storage to Automation'
uci set firewall.@rule[-1].src='storage'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block IoT to Automation'
uci set firewall.@rule[-1].src='iot_sensors'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].target='REJECT'

echo "Safety and security rules configured"

