echo "Configuring logging and intrusion detection..."

# Log Guest internal access attempts
uci add firewall rule
uci set firewall.@rule[-1].name='Log Guest Internal Access Attempts'
uci set firewall.@rule[-1].src='guest'
uci set firewall.@rule[-1].dest='!wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

echo "Logging rules configured"

# ============================================================================
# EMERGENCY PROTOCOLS (DISABLED BY DEFAULT)
# ============================================================================

echo "Configuring emergency protocols..."


# EMERGENCY SMART PLUG ACCESS
# This rule is NOT added to the running config by default.
# OpenWrt firewall rules have no 'enabled/disabled' toggle - 'enabled=0' is silently ignored.
# To activate emergency access, run the following MANUALLY on the router when needed:
#
# F-E fix: was dest_ip='192.168.50.71' (FDM printer plug only) with ports 80,443 only.
# Expanded to cover all 8 smart plugs (.71-.78) via /29 subnet, plus port 9999
# (Tapo local control API - allows plug control without cloud, lower latency).
# Plug allocation: .71 FDM printer | .72 SLA printer | .73 UV-1   | .74 UV-2
#                  .75 wash/cure   | .76 ultrasonic  | .77 AMS-HT | .78 eSUN dryer
#
#   uci add firewall rule
#   uci set firewall.@rule[-1].name='Emergency Smart Plug Access'
#   uci set firewall.@rule[-1].src='management'
#   uci set firewall.@rule[-1].dest='iot_sensors'
#   uci set firewall.@rule[-1].dest_ip='192.168.50.71/255.255.255.248'
#   uci set firewall.@rule[-1].dest_port='80,443,9999'
#   uci set firewall.@rule[-1].proto='tcp'
#   uci set firewall.@rule[-1].target='ACCEPT'
#   uci commit firewall && /etc/init.d/firewall restart
#
# To remove after emergency:
#   Find the rule index (uci show firewall | grep Emergency) then:
#   uci delete firewall.@rule[N] && uci commit firewall && /etc/init.d/firewall restart
echo "Emergency protocols configured (disabled by default)"

# ============================================================================
# ADDITIONAL SECURITY HARDENING
# ============================================================================

echo "Configuring additional security hardening..."

# SSH ACCESS MODEL (F-07 fix):
# SSH to the router is accessible ONLY from the management zone (VLAN 10) and
# VPN clients. Both zones have input='ACCEPT' as their zone default policy
# (see zone definitions above) so no explicit rule is required — traffic to
# the router from those zones is already permitted.
# SSH from WAN is intentionally blocked by the WAN zone's input='REJECT' default.
# To access the router remotely, connect via WireGuard VPN first, then SSH to
# the router gateway (192.168.10.1 or 192.168.1.1 depending on source zone).
#
# REMOVED: 'SSH Rate Limit' rule that previously exposed SSH port 22 to WAN.
# Even rate-limited WAN SSH is an unnecessary attack surface when VPN is available.
# Rate limiting does not protect against credential stuffing, exploit attempts on
# OpenSSH vulnerabilities, or zero-day attacks — removing WAN exposure is safer.

# Block common attack ports
uci add firewall rule
uci set firewall.@rule[-1].name='Block Telnet'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].dest_port='23'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block FTP'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].dest_port='21'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block SMB'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].dest_port='445,139'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='REJECT'

# Allow ping for network diagnostics (with rate limiting)
uci add firewall rule
uci set firewall.@rule[-1].name='Allow Ping'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].proto='icmp'
uci set firewall.@rule[-1].icmp_type='echo-request'
uci set firewall.@rule[-1].target='ACCEPT'
uci set firewall.@rule[-1].extra='-m limit --limit 10/sec'

echo "Security hardening configured"

# ============================================================================
# DHCP AND DNS TRAFFIC RULES
# ============================================================================

echo "Configuring DHCP and DNS traffic rules..."

# DHCP AND DNS ACCESS MODEL (F-06 fix):
# All internal zones (lan, management, automation, cctv, storage, iot_sensors,
# monitoring, dmz, guest) have input='ACCEPT' as their zone default policy, which
# already allows DHCP (ports 67/68) and DNS (port 53) queries to reach the router.
# No explicit rules are needed for these services on internal networks.
#
# REMOVED: 'Allow DHCP Requests' and 'Allow Local DNS' rules that used src='*'.
# In OpenWrt, src='*' includes the WAN zone, which caused these rules to OVERRIDE
# the WAN zone's input='REJECT' default — inadvertently opening:
#   - Port 53 to the internet (DNS amplification attack surface)
#   - Ports 67/68 to WAN (unnecessary; DHCP is link-local broadcast anyway)
# Internal DHCP and DNS continue to work via zone default input='ACCEPT' policies.
# The dedicated 'Block IoT External DNS' rule above separately ensures IoT devices
# cannot reach external DNS resolvers even if routing is misconfigured.

echo "DHCP and DNS traffic rules configured"

# ============================================================================
# APPLY CONFIGURATION
# ============================================================================

echo "Applying firewall configuration..."

# Commit all firewall changes
uci commit firewall

# Validate configuration before restart
if ! uci show firewall > /dev/null 2>&1; then
    echo "ERROR: Invalid UCI configuration detected. Restoring backup..."
    # Restore backup if available
    if [ -f "/etc/config/firewall.backup.*" ]; then
        cp /etc/config/firewall.backup.* /etc/config/firewall
        echo "Configuration restored from backup"
    fi
    exit 1
fi

# Restart firewall service
echo "Restarting firewall service..."
/etc/init.d/firewall restart

# Verify firewall is running
if /etc/init.d/firewall status > /dev/null 2>&1; then
    echo "✅ Firewall configuration applied successfully!"
else
    echo "❌ ERROR: Firewall failed to start properly"
    exit 1
fi

