#!/bin/bash

# ============================================================================
# Home Automation Project - OpenWrt Firewall Configuration
# 9-VLAN Security Architecture Implementation
# Version: 2.0
# Date: 2025-09-25
# Repository: https://github.com/Nysplaidame/home-automation-project
# Hardware: GL.iNet GL-MT6000 with OpenWrt
# ============================================================================

set -e  # Exit on any error
set -u  # Exit on undefined variables

echo "Starting Home Automation Firewall Configuration..."
echo "Implementing 9-VLAN + guest + DMZ security architecture"

# ============================================================================
# BACKUP EXISTING CONFIGURATION
# ============================================================================

# Create backup of existing firewall config
echo "Creating backup of existing configuration..."
cp /etc/config/firewall "/etc/config/firewall.backup.$(date +%Y%m%d_%H%M%S)" || echo "Warning: Could not create backup"

# ============================================================================
# CLEAR EXISTING CONFIGURATION
# ============================================================================

echo "Clearing existing firewall configuration..."
> /etc/config/firewall

# ============================================================================
# BASIC FIREWALL DEFAULTS
# ============================================================================

echo "Setting up basic firewall defaults..."
cat >> /etc/config/firewall << 'EOF'

config defaults
    option syn_flood    1
    option input        REJECT
    option output       ACCEPT
    option forward      REJECT

EOF

# ============================================================================
# ZONE DEFINITIONS
# ============================================================================

echo "Creating firewall zones..."

# Zone: WAN (Internet)
uci add firewall zone
uci set firewall.@zone[-1].name='wan'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci set firewall.@zone[-1].masq='1'
uci set firewall.@zone[-1].mtu_fix='1'
uci add_list firewall.@zone[-1].network='wan'
uci add_list firewall.@zone[-1].network='wan6'

# Zone: LAN (VLAN 1) - Main users: phones, laptops, tablets, smart TVs
uci add firewall zone
uci set firewall.@zone[-1].name='lan'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='ACCEPT'
uci add_list firewall.@zone[-1].network='lan'

# Zone: MANAGEMENT (VLAN 10) - Admin devices and Proxmox host
uci add firewall zone
uci set firewall.@zone[-1].name='management'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='ACCEPT'
uci add_list firewall.@zone[-1].network='management'

# Zone: AUTOMATION (VLAN 20) - Home Assistant and services
uci add firewall zone
uci set firewall.@zone[-1].name='automation'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='automation'

# Zone: CCTV (VLAN 30) - Cameras and Frigate VM (No Internet Access)
uci add firewall zone
uci set firewall.@zone[-1].name='cctv'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='cctv'

# Zone: STORAGE (VLAN 40) - NAS and backup services (No Internet Access)
uci add firewall zone
uci set firewall.@zone[-1].name='storage'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='storage'

# Zone: IOT_SENSORS (VLAN 50) - Fire safety sensors (No Internet - CRITICAL SAFETY)
uci add firewall zone
uci set firewall.@zone[-1].name='iot_sensors'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='iot_sensors'

# Zone: MONITORING (VLAN 60) - Future monitoring VMs and tools
uci add firewall zone
uci set firewall.@zone[-1].name='monitoring'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='monitoring'

# Zone: DMZ (VLAN 70) - Public services with controlled internet access
uci add firewall zone
uci set firewall.@zone[-1].name='dmz'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='dmz'

# Zone: GUEST - Visitors with internet-only access (isolated)
uci add firewall zone
uci set firewall.@zone[-1].name='guest'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='guest'

# Zone: VPN_CLIENTS - For remote access
# B7 fix: previously referenced network='vpn' (a duplicate static interface that
# no longer exists — see vlan-config.conf). The wg0 WireGuard UCI interface is the
# correct reference. Without this fix, all VPN firewall rules were silently dead.
uci add firewall zone
uci set firewall.@zone[-1].name='vpn_clients'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='REJECT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='wg0'

echo "Firewall zones created successfully"

# ============================================================================
# INTERNET ACCESS RULES
# ============================================================================

echo "Configuring internet access rules..."

# LAN (Main Users) to WAN - Full Internet Access
uci add firewall rule
uci set firewall.@rule[-1].name='LAN to Internet'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='ACCEPT'

# Management to WAN - Full Internet Access
uci add firewall rule
uci set firewall.@rule[-1].name='Management to Internet'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant to WAN - Limited Internet Access
uci add firewall rule
uci set firewall.@rule[-1].name='Home Assistant Internet Access'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='ACCEPT'

# Frigate to WAN - For updates only
uci add firewall rule
uci set firewall.@rule[-1].name='Frigate Internet Access'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].src_ip='192.168.30.20'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='80,443'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Block all other automation devices from internet
uci add firewall rule
uci set firewall.@rule[-1].name='Block Other Automation Internet'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'

# Monitoring to WAN - For updates and alerts
uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring Internet Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='80,443,25,587'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# DMZ Services to WAN - Controlled Internet Access
uci add firewall rule
uci set firewall.@rule[-1].name='DMZ Internet Access'
uci set firewall.@rule[-1].src='dmz'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='80,443,53'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

# Guest to WAN - Internet Only Access
uci add firewall rule
uci set firewall.@rule[-1].name='Guest Internet Access'
uci set firewall.@rule[-1].src='guest'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='ACCEPT'

# Allow WireGuard traffic from WAN
uci add firewall rule
uci set firewall.@rule[-1].name='Allow WireGuard WAN'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].dest_port='51820'
uci set firewall.@rule[-1].proto='udp'
uci set firewall.@rule[-1].target='ACCEPT'

# Allow WireGuard interface to accept connections
uci add firewall rule
uci set firewall.@rule[-1].name='Allow WireGuard Interface'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].dest='vpn_clients'
uci set firewall.@rule[-1].target='ACCEPT'

# Explicit blocks for isolated networks — log '1' enables logging per-rule (no duplicate rules needed)
uci add firewall rule
uci set firewall.@rule[-1].name='Block CCTV Internet'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

uci add firewall rule
uci set firewall.@rule[-1].name='Block Storage Internet'
uci set firewall.@rule[-1].src='storage'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

uci add firewall rule
uci set firewall.@rule[-1].name='Block IoT Internet'
uci set firewall.@rule[-1].src='iot_sensors'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

echo "Internet access rules configured"

# ============================================================================
# DNS SECURITY RULES
# ============================================================================

echo "Configuring DNS security rules..."

# Block IoT sensors from external DNS
uci add firewall rule
uci set firewall.@rule[-1].name='Block IoT External DNS'
uci set firewall.@rule[-1].src='iot_sensors'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53,853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'
# ANNOTATION: IoT devices must only use local DNS (.1 gateway) to prevent
# DNS tunneling attacks and ensure they cannot resolve external addresses

# Block CCTV from external DNS
uci add firewall rule
uci set firewall.@rule[-1].name='Block CCTV External DNS'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53,853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

# Block Storage from external DNS
uci add firewall rule
uci set firewall.@rule[-1].name='Block Storage External DNS'
uci set firewall.@rule[-1].src='storage'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53,853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

echo "DNS security rules configured"

# ============================================================================
# INTER-VLAN COMMUNICATION RULES
# ============================================================================

echo "Configuring inter-VLAN communication rules..."

# Home Assistant UI access from LAN (VLAN 1)
# VLAN 1 devices (laptops, phones, Raspberry Pi displays at 192.168.1.201–.202)
# need to reach the HA dashboard at 192.168.20.101:8123. The automation zone
# has forward=REJECT by default; without this rule all LAN→HA traffic is
# silently dropped. Access restriction is handled via HA user permissions.
uci add firewall rule
uci set firewall.@rule[-1].name='LAN to Home Assistant UI'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_ip='192.168.20.101'
uci set firewall.@rule[-1].dest_port='8123'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant access to CCTV network (Frigate + Bambuddy on 192.168.30.20 only)
# F-A fix: was all-ports/all-IPs. Scoped to Frigate VM IP and required ports only:
#   8971 - Frigate 0.14+ UI/API  |  5000 - Frigate <0.14 UI/API (kept for compat)
#   8554 - RTSP restream          |  8555 - WebRTC
#   8000 - Bambuddy UI + REST API
uci add firewall rule
uci set firewall.@rule[-1].name='HA to CCTV Access'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='cctv'
uci set firewall.@rule[-1].dest_ip='192.168.30.20'
uci set firewall.@rule[-1].dest_port='8971,5000,8554,8555,8000'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant access to Storage network (NAS at 192.168.40.50 only)
# F-A fix: was all-ports/all-IPs. Scoped to NAS IP and required ports only:
#   22   - SSH (HA backup via scp/rsync)
#   445  - SMB (optional HA media/config share)
#   2049 - NFS (recordings mount for Frigate HA access)
uci add firewall rule
uci set firewall.@rule[-1].name='HA to Storage Access'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='storage'
uci set firewall.@rule[-1].dest_ip='192.168.40.50'
uci set firewall.@rule[-1].dest_port='22,445,2049'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant access to IoT Sensors network
# F-A fix: broad all-ports rule REMOVED. The 'ESPHome API HA to IoT' rule
# below (ports 6053,3232) is now the active and only HA->IoT rule.
# The old all-ports rule made the specific port rule dead code (matched first)
# and over-exposed every port on every IoT device to HA.

# NOTE: Frigate VM is on VLAN 30 (192.168.30.20), not VLAN 20.
# Frigate accesses cameras directly within VLAN 30 (same zone, no firewall rule needed).
# HA accesses Frigate via the 'HA to CCTV Access' rule above.

# Frigate access to NAS for footage storage
uci add firewall rule
uci set firewall.@rule[-1].name='Frigate to NAS Access'
uci set firewall.@rule[-1].src='cctv'
uci set firewall.@rule[-1].src_ip='192.168.30.20'
uci set firewall.@rule[-1].dest='storage'
uci set firewall.@rule[-1].dest_ip='192.168.40.50'
uci set firewall.@rule[-1].dest_port='22,445,2049'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# MQTT IoT to Home Assistant
# DEPLOYMENT NOTE — TWO-STAGE MQTT SETUP:
# Stage 1 (initial setup, before TLS): Mosquitto runs on port 1883 (unencrypted).
#   Add a temporary rule for port 1883 while testing ESPHome device connectivity:
#
#   uci add firewall rule
#   uci set firewall.@rule[-1].name='TEMP VentSys MQTT plain IoT to HA'
#   uci set firewall.@rule[-1].src='iot_sensors'
#   uci set firewall.@rule[-1].dest='automation'
#   uci set firewall.@rule[-1].dest_ip='192.168.20.101'
#   uci set firewall.@rule[-1].proto='tcp'
#   uci set firewall.@rule[-1].dest_port='1883'
#   uci set firewall.@rule[-1].target='ACCEPT'
#   uci commit firewall && /etc/init.d/firewall restart
#
# Stage 2 (after TLS migration per ventsys_tls_implementation_guide.md):
#   Remove the temporary 1883 rule:
#   Find the rule index: uci show firewall | grep -n "TEMP VentSys"
#   uci delete firewall.@rule[N] && uci commit firewall && /etc/init.d/firewall restart
#
# The permanent rule below (port 8883) stays in place throughout.
uci add firewall rule
uci set firewall.@rule[-1].name='VentSys MQTT IoT to HA'
uci set firewall.@rule[-1].src='iot_sensors'
uci set firewall.@rule[-1].dest='automation' 
uci set firewall.@rule[-1].dest_ip='192.168.20.101'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].dest_port='8883'
uci set firewall.@rule[-1].target='ACCEPT'

# ESPHome API + OTA: HA -> IoT devices (ports 6053 native API, 3232 OTA)
# F-A fix: this is now the ONLY HA->IoT rule (the former broad all-ports
# 'HA to IoT Sensors Access' rule has been removed above).
uci add firewall rule
uci set firewall.@rule[-1].name='ESPHome API HA to IoT'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='iot_sensors'
uci set firewall.@rule[-1].proto='tcp'
# FIX #6: Previously only port 6053 (native API) was opened. ESPHome OTA updates
# require HA to open a separate TCP connection to the device on port 3232. Without
# this port, every OTA firmware push from the ESPHome integration silently hangs
# until timeout — no error is shown. Both ports are required for full ESPHome function:
#   6053 — native API (sensor streaming, bidirectional command delivery, continuous)
#   3232 — OTA update channel (HA initiates connection to push firmware to device)
uci set firewall.@rule[-1].dest_port='6053,3232'
uci set firewall.@rule[-1].target='ACCEPT'

# NTP access for IoT devices
# IMPORTANT: Required for TLS certificate validation on ESPHome devices.
# Without accurate time, SSL handshakes fail when the device clock drifts
# outside the certificate validity window. Even pre-TLS this matters for
# correct timestamps in sensor logs and HA history.
# The router acts as the local NTP server (configured in ventsys_tls_implementation_guide.md
# Phase 1.3). IoT devices use 192.168.50.1 (router gateway on VLAN 50).
# dest='local' (not dest='wan') because the router answers NTP itself —
# the query never leaves the router.
uci add firewall rule
uci set firewall.@rule[-1].name='IoT to Router NTP'
uci set firewall.@rule[-1].src='iot_sensors'
uci set firewall.@rule[-1].dest_port='123'
uci set firewall.@rule[-1].proto='udp'
uci set firewall.@rule[-1].target='ACCEPT'

# Management access to all networks (for administration)
uci add firewall rule
uci set firewall.@rule[-1].name='Management Full Access - LAN'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='lan'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Management Full Access - Automation'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Management Full Access - CCTV'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='cctv'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Management Full Access - Storage'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='storage'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Management Full Access - IoT'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='iot_sensors'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Management Full Access - Monitoring'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='monitoring'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Management Full Access - DMZ'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='dmz'
uci set firewall.@rule[-1].target='ACCEPT'

# Monitoring access to all networks for data collection
uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring to LAN Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='lan'
uci set firewall.@rule[-1].dest_port='22,161,80,443'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring to Automation Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_port='22,161,8123'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring to CCTV Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='cctv'
uci set firewall.@rule[-1].dest_port='22,161'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring to Storage Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='storage'
uci set firewall.@rule[-1].dest_port='22,161'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring to IoT Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='iot_sensors'
uci set firewall.@rule[-1].dest_port='22,161'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

# Monitoring to Management network (Proxmox host at 192.168.10.10)
# F-B fix: missing rule added. Monitoring VMs (Zabbix .10, Grafana .11 etc.) need
# to reach the Proxmox hypervisor on VLAN 10 for SNMP polling, Prometheus scraping,
# and SSH access. Without this rule, monitoring traffic was silently dropped by the
# management zone's forward=ACCEPT default (which doesn't help for cross-zone traffic)
# and the monitoring zone's forward=REJECT default.
uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring to Management Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='management'
uci set firewall.@rule[-1].dest_port='22,161,9091'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

# VPN clients access to LAN (user-level access)
uci add firewall rule
uci set firewall.@rule[-1].name='VPN to LAN Access'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest='lan'
uci set firewall.@rule[-1].target='ACCEPT'

# VPN clients access to Home Assistant (limited)
uci add firewall rule
uci set firewall.@rule[-1].name='VPN to Home Assistant'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_ip='192.168.20.101'
uci set firewall.@rule[-1].dest_port='8123'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# VPN clients access to DMZ services
uci add firewall rule
uci set firewall.@rule[-1].name='VPN to DMZ Access'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest='dmz'
uci set firewall.@rule[-1].target='ACCEPT'

# Block VPN access to sensitive networks
uci add firewall rule
uci set firewall.@rule[-1].name='Block VPN to Management'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest='management'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block VPN to CCTV'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest='cctv'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block VPN to Storage'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest='storage'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block VPN to IoT'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest='iot_sensors'
uci set firewall.@rule[-1].target='REJECT'

echo "Inter-VLAN communication rules configured"

# ============================================================================
# GUEST & DMZ ISOLATION RULES
# ============================================================================

echo "Configuring guest and DMZ isolation rules..."

# Block Guest access to all internal networks
uci add firewall rule
uci set firewall.@rule[-1].name='Block Guest to LAN'
uci set firewall.@rule[-1].src='guest'
uci set firewall.@rule[-1].dest='lan'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
