# Frigate VM — Docker Compose
# Host: frigate-nvr (192.168.30.20, VLAN 30)
# Deploy to: /opt/frigate/docker-compose.yml
#
# Services:
#   frigate   — NVR, cameras, object detection
#   bambuddy  — Bambu Lab P1S print management + HA integration
#
# Both containers use network_mode: host so they share the VM's eth0 (VLAN 30).
# Bambuddy reaches the P1S at 192.168.35.200 via firewall rule (cctv -> printers).
# Bambuddy reaches Mosquitto at 192.168.20.101 via firewall rule (cctv -> automation).

# FIX #27: `version:` key is deprecated in Docker Compose v2+ (ignored with a
# warning on every `docker compose` invocation). Removed per current best practice.
# See: https://docs.docker.com/compose/compose-file/04-version-and-name/
services:

  # ──────────────────────────────────────────────────────────────────────────
  # FRIGATE NVR
  # Web UI: http://192.168.30.20:8971 (Frigate 0.14+)  # N-4 fix: was :5000 (pre-0.14)
  # ──────────────────────────────────────────────────────────────────────────
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    network_mode: host
    shm_size: "256mb"
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}   # N-3 fix: was bare KEY= which overrides .env with empty string
      # FIX #14: Added separate MQTT password variable. Previously config.yml
      # reused {FRIGATE_RTSP_PASSWORD} as the Mosquitto password -- wrong credential.
      # Set FRIGATE_MQTT_PASSWORD in /opt/frigate/.env (same file as RTSP password).
      # Value must match the mqtt_password in HA secrets.yaml and mosquitto ACL.
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}   # N-3 fix: was bare KEY= which overrides .env with empty string
    volumes:
      - /opt/frigate/config:/config
      - /opt/frigate/storage:/media/frigate
      # FIX #3: /db volume mount was missing. config.yml sets database.path: /db/frigate.db
      # so without this mount Docker resolves /db inside the ephemeral container layer —
      # all detection history, snapshots and event records are destroyed on every
      # `docker compose down`. The host directory /opt/frigate/db is created in Phase 3.2
      # of frigate_vm_setup_guide.md. This mount was present in the guide's inline compose
      # but was dropped when Bambuddy was added to the vault file.
      - /opt/frigate/db:/db
      # FIX #5: Both local storage and NAS recording mounts were uncommented simultaneously.
      # The NAS mount (/mnt/nas/frigate) does not exist until the Pi NAS is set up (Phase 4).
      # Docker either silently creates an empty directory or hard-fails depending on version.
      # NAS line is now commented out — uncomment when Phase 4 NAS setup is complete.
      # See frigate_vm_setup_guide.md Phase 4 for the exact steps to enable this.
      # - /mnt/nas/frigate:/media/frigate/recordings   # uncomment after Phase 4 NAS setup
      - /etc/localtime:/etc/localtime:ro
      # H-6 fix: cert volume so Frigate can validate MQTT TLS using local CA.
      # Source path must contain ca-cert.pem from ventsys_tls_implementation_guide.md.
      # Create this dir on the Frigate VM and copy ca-cert.pem before first start.
      - /opt/frigate/certs:/config/certs:ro
    devices:
      # iGPU for VA-API hardware acceleration (enable after iGPU passthrough setup)
      # - /dev/dri/renderD128:/dev/dri/renderD128
    tmpfs:
      - /tmp/cache

  # ──────────────────────────────────────────────────────────────────────────
  # BAMBUDDY — Bambu Lab print management and HA integration
  # Web UI: http://192.168.30.20:8000
  # Docs:   https://github.com/maziggy/bambuddy
  # ──────────────────────────────────────────────────────────────────────────
  bambuddy:
    container_name: bambuddy
    image: ghcr.io/maziggy/bambuddy:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/London
      - PORT=8000
      # Bambuddy reads printer connection details from environment at startup.
      # Set these in /opt/frigate/.env alongside FRIGATE_RTSP_PASSWORD etc.
      # Alternatively, add the printer manually via the Bambuddy web UI after first start.
      - BAMBU_PRINTER_IP=${BAMBU_PRINTER_IP}       # 192.168.35.200
      - BAMBU_ACCESS_CODE=${BAMBU_ACCESS_CODE}      # from printer Developer Mode screen
      - BAMBU_SERIAL=${BAMBU_SERIAL}               # e.g. 01P09C411500579
      # MQTT publishing — Bambuddy pushes print events to Mosquitto on HA
      - MQTT_HOST=192.168.20.101
      # TWO-STAGE MQTT PORT: Set to 1883 initially (pre-TLS), then update to 8883
      # after completing ventsys_tls_implementation_guide.md Phase 4.
      # The firewall rule 'Bambuddy MQTT to HA' in firewall-config.conf uses 8883
      # permanently; a temporary 1883 rule is added during Stage 1 testing.
      - MQTT_PORT=8883
      - MQTT_USER=mqtt
      - MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
      # Optional: pre-configure HA connection via env (alternative to UI setup in Phase 6.2)
      # - HA_URL=http://192.168.20.101:8123
      # - HA_TOKEN=${HA_LONG_LIVED_TOKEN}
    volumes:
      # FIX #4: Previous volume mounts were wrong in two ways:
      #   1. /app/bambuddy.db — Docker mounts a host *directory* to this path; the container
      #      expects a file. SQLite cannot open a directory and crashes on startup.
      #   2. /app/archive — this path does not exist in Bambuddy. Archives live at
      #      /app/data/archive/ inside the container. The old mount silently created an
      #      empty directory and Bambuddy wrote all archives to the ephemeral container layer.
      # Correct layout per upstream docker-compose.yml (github.com/maziggy/bambuddy):
      #   - All persistent data (database, archives, thumbnails) lives under /app/data
      #   - Logs live under /app/logs
      # Host directories: /opt/frigate/bambuddy/{data,logs} — update mkdir in NOTES below.
      - /opt/frigate/bambuddy/data:/app/data
      - /opt/frigate/bambuddy/logs:/app/logs

# ──────────────────────────────────────────────────────────────────────────
# NOTES
# ──────────────────────────────────────────────────────────────────────────
#
# BEFORE FIRST START:
#   mkdir -p /opt/frigate/db
#   mkdir -p /opt/frigate/bambuddy/{data,logs}   # FIX #4: was {db,archive,logs} — see volume notes above
#   Set the following in /opt/frigate/.env:
#     FRIGATE_RTSP_PASSWORD=<camera password>
#     FRIGATE_MQTT_PASSWORD=<mosquitto mqtt user password>
#     BAMBU_PRINTER_IP=192.168.35.200
#     BAMBU_ACCESS_CODE=<from printer Developer Mode screen>
#     BAMBU_SERIAL=<serial number, e.g. 01P09C411500579>
#     HA_LONG_LIVED_TOKEN=<optional — alternatively configure via Bambuddy web UI Phase 6.2>
#
# STARTING:
#   docker compose up -d                  # start both
#   docker compose up -d bambuddy         # start Bambuddy only
#   docker compose logs bambuddy -f       # follow Bambuddy logs
#   docker compose logs frigate -f        # follow Frigate logs
#
# UPDATING:
#   docker compose pull && docker compose up -d
#
# VOLUMES:
#   /opt/frigate/bambuddy/data/   All persistent data: SQLite DB, archives, thumbnails
#   /opt/frigate/bambuddy/logs/   Application logs
#   (FIX #4 note: old paths /bambuddy/db/ and /bambuddy/archive/ were wrong — see volume comments above)
#
# PORT CONFLICTS:
#   Frigate: 8971 (UI/API, 0.14+), 5000 (API legacy <0.14), 8554 (RTSP), 8555 (WebRTC)  # A9-8
#   Bambuddy: 8000 (UI + API)
#   No overlap — both use host networking safely.
#
# NAS RECORDING MOUNT:
#   /mnt/nas/frigate is an NFS mount from the Pi NAS (192.168.40.50).
#   Comment out the NAS volume line until the NAS is set up.
#   The fstab entry is in pi_nas_setup_guide.md.
