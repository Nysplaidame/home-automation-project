<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ESP32 D1 Mini Valve Servo Feedback Wiring</title>
  <style>
    body {
      margin: 0;
      background: #f6f7fb;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    svg {
      display: block;
      width: 1500px;
      height: 920px;
      background: linear-gradient(180deg, #ffffff 0%, #f4f7fb 100%);
    }
  </style>
</head>
<body>
<svg viewBox="0 0 1500 920" role="img" aria-label="Clean wiring diagram for ESP32 D1 Mini servo valve with analog feedback and single addressable LED">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1b273d" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 34px; font-weight: 750; fill: #172033; }
      .subtitle, .note, .legend-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; fill: #607089; }
      .component { fill: #ffffff; stroke: #cbd6e6; stroke-width: 2; filter: url(#shadow); }
      .component-title { font-family: "Segoe UI", Arial, sans-serif; font-size: 23px; font-weight: 750; fill: #172033; }
      .pin, .terminal, .part { fill: #fbfcff; stroke-width: 2.5; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 16px; font-weight: 750; }
      .wire { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .tap { stroke: #ffffff; stroke-width: 4; }
      .red { stroke: #d7262e; }
      .black { stroke: #222a35; }
      .orange { stroke: #f28c28; }
      .purple { stroke: #7c4dff; }
      .green { stroke: #14935c; }
      .blue { stroke: #2563eb; }
      .red-text { fill: #d7262e; }
      .black-text { fill: #222a35; }
      .orange-text { fill: #f28c28; }
      .purple-text { fill: #7c4dff; }
      .green-text { fill: #14935c; }
      .blue-text { fill: #2563eb; }
    </style>
  </defs>

  <rect width="1500" height="920" fill="#f6f7fb"/>

  <text x="42" y="58" class="title">ESP32 D1 Mini Valve Servo Feedback Wiring</text>
  <text x="43" y="92" class="subtitle">Small colored dots mean wires are joined at that point. LED is shown as a separate load on the same 5V/GND rails.</text>

  <!-- Main horizontal wires -->
  <path class="wire red" d="M350 220 H1120"/>
  <path class="wire black" d="M350 310 H1120"/>
  <path class="wire orange" d="M350 410 H1120"/>
  <path class="wire purple" d="M350 520 H610"/>
  <path class="wire purple" d="M910 520 H1120"/>
  <path class="wire green" d="M350 625 H1040 V807 H1120"/>

  <!-- LED 5V/GND taps -->
  <path class="wire red" d="M1015 220 V697 H1120"/>
  <path class="wire black" d="M980 310 V752 H1120"/>

  <!-- Bulk capacitor placed only between 5V and GND rails -->
  <path class="wire red" d="M635 220 V235"/>
  <path class="wire black" d="M815 285 V310"/>

  <!-- Feedback protection: ADC-side node to GND -->
  <path class="wire purple" d="M610 520 H690"/>
  <path class="wire purple" d="M840 520 H910"/>
  <path class="wire purple" d="M610 520 V650"/>
  <path class="wire purple" d="M610 600 H780 V650"/>
  <path class="wire black" d="M610 730 V780 H900 V310"/>
  <path class="wire black" d="M780 730 V780 H900"/>

  <!-- Connection dots -->
  <circle cx="1015" cy="220" r="9" class="tap" fill="#d7262e"/>
  <circle cx="980" cy="310" r="9" class="tap" fill="#222a35"/>
  <circle cx="635" cy="220" r="9" class="tap" fill="#d7262e"/>
  <circle cx="815" cy="310" r="9" class="tap" fill="#222a35"/>
  <circle cx="610" cy="520" r="9" class="tap" fill="#7c4dff"/>
  <circle cx="610" cy="600" r="7" class="tap" fill="#7c4dff"/>
  <circle cx="610" cy="780" r="9" class="tap" fill="#222a35"/>
  <circle cx="780" cy="780" r="9" class="tap" fill="#222a35"/>
  <circle cx="900" cy="310" r="9" class="tap" fill="#222a35"/>
  <circle cx="900" cy="780" r="9" class="tap" fill="#222a35"/>

  <!-- ESP board -->
  <rect x="70" y="145" width="280" height="535" rx="8" class="component"/>
  <text x="92" y="190" class="component-title">ESP32 D1 Mini</text>

  <rect x="92" y="203" width="210" height="44" rx="6" class="pin red"/>
  <text x="106" y="231" class="label red-text">VCC / 5V</text>

  <rect x="92" y="293" width="210" height="44" rx="6" class="pin black"/>
  <text x="106" y="321" class="label black-text">GND</text>

  <rect x="92" y="393" width="210" height="44" rx="6" class="pin orange"/>
  <text x="106" y="421" class="label orange-text">IO16 / GPIO16 - PWM</text>

  <rect x="92" y="503" width="210" height="44" rx="6" class="pin purple"/>
  <text x="106" y="531" class="label purple-text">SVP / GPIO36 - ADC</text>

  <rect x="92" y="608" width="210" height="44" rx="6" class="pin green"/>
  <text x="106" y="636" class="label green-text">GPIO21 - LED data</text>

  <text x="92" y="665" class="note">Board powered by USB hub.</text>

  <!-- Servo -->
  <rect x="1120" y="145" width="320" height="435" rx="8" class="component"/>
  <text x="1142" y="190" class="component-title">Analog Feedback Servo</text>

  <rect x="1142" y="203" width="240" height="44" rx="6" class="terminal red"/>
  <text x="1156" y="231" class="label red-text">Red wire - 5V</text>

  <rect x="1142" y="293" width="240" height="44" rx="6" class="terminal black"/>
  <text x="1156" y="321" class="label black-text">Brown/black - GND</text>

  <rect x="1142" y="393" width="240" height="44" rx="6" class="terminal orange"/>
  <text x="1156" y="421" class="label orange-text">Orange/yellow - PWM</text>

  <rect x="1142" y="503" width="240" height="44" rx="6" class="terminal purple"/>
  <text x="1156" y="531" class="label purple-text">Feedback wire</text>

  <text x="1142" y="560" class="note">Servo uses 5V, not 3.3V.</text>

  <!-- LED -->
  <rect x="1120" y="620" width="320" height="190" rx="8" class="component"/>
  <text x="1142" y="665" class="component-title">Single Addressable LED</text>

  <rect x="1142" y="678" width="220" height="38" rx="6" class="terminal red"/>
  <text x="1156" y="703" class="label red-text">5V</text>

  <rect x="1142" y="733" width="220" height="38" rx="6" class="terminal black"/>
  <text x="1156" y="758" class="label black-text">GND</text>

  <rect x="1142" y="788" width="220" height="38" rx="6" class="terminal green"/>
  <text x="1156" y="813" class="label green-text">Data</text>

  <!-- Individual components -->
  <rect x="560" y="235" width="330" height="50" rx="8" class="part blue"/>
  <text x="725" y="258" text-anchor="middle" class="label blue-text">470uF-1000uF capacitor</text>
  <text x="725" y="280" text-anchor="middle" class="note">between 5V and GND</text>

  <rect x="690" y="490" width="150" height="60" rx="8" class="part purple"/>
  <text x="765" y="526" text-anchor="middle" class="label purple-text">10k resistor</text>

  <rect x="535" y="650" width="150" height="80" rx="8" class="part black"/>
  <text x="610" y="684" text-anchor="middle" class="label black-text">20k resistor</text>
  <text x="610" y="712" text-anchor="middle" class="note">to GND</text>

  <rect x="705" y="650" width="150" height="80" rx="8" class="part blue"/>
  <text x="780" y="684" text-anchor="middle" class="label blue-text">100nF capacitor</text>
  <text x="780" y="712" text-anchor="middle" class="note">to GND</text>

  <text x="535" y="842" class="note">Feedback path: servo feedback wire -> 10k resistor -> ADC pin.</text>
  <text x="535" y="867" class="note">The 20k resistor and 100nF capacitor connect from the ADC side of the 10k resistor to GND.</text>

  <!-- Legend -->
  <line x1="70" y1="895" x2="110" y2="895" stroke="#d7262e" stroke-width="6" stroke-linecap="round"/>
  <text x="123" y="900" class="legend-text">5V</text>

  <line x1="185" y1="895" x2="225" y2="895" stroke="#222a35" stroke-width="6" stroke-linecap="round"/>
  <text x="238" y="900" class="legend-text">GND</text>

  <line x1="310" y1="895" x2="350" y2="895" stroke="#f28c28" stroke-width="6" stroke-linecap="round"/>
  <text x="363" y="900" class="legend-text">PWM</text>

  <line x1="455" y1="895" x2="495" y2="895" stroke="#7c4dff" stroke-width="6" stroke-linecap="round"/>
  <text x="508" y="900" class="legend-text">feedback / ADC</text>

  <line x1="665" y1="895" x2="705" y2="895" stroke="#14935c" stroke-width="6" stroke-linecap="round"/>
  <text x="718" y="900" class="legend-text">LED data</text>
</svg>
</body>
</html>
