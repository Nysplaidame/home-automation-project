# secrets.example.yaml
# M-7 fix: example secrets file showing all required keys across the vault.
# Copy this to the appropriate location and fill in real values.
# NEVER commit secrets.yaml with real values to version control.
#
# See docs/secrets_reference.md for full explanation of each secret,
# which Bitwarden entry to use, and where each key is consumed.
#
# TWO LOCATIONS need a secrets.yaml before flashing ESPHome devices:
#   1. configs/esphome/secrets.yaml       (for configs/esphome/ YAMLs)
#   2. ventsys/ventsys_bundle_updated/secrets.yaml  (for bundle YAMLs)
# Both files have identical content.
#
# A THIRD secrets file lives on the HA VM only:
#   /config/secrets.yaml  — see Section 5 in docs/secrets_reference.md
#   DO NOT copy that file to the vault.

# ── WiFi ──────────────────────────────────────────────────────────────────────
wifi_ssid: "HomeIoT"                    # Bitwarden: wifi-homeiot (SSID name, not secret)
wifi_pass: "YOUR_HOMEIOT_WIFI_PASSWORD" # Bitwarden: wifi-homeiot

# ── MQTT ──────────────────────────────────────────────────────────────────────
mqtt_user: "mqtt"                       # Fixed value - do not change
mqtt_pass: "YOUR_MQTT_PASSWORD"         # Bitwarden: mqtt-credentials

# ── MQTT TLS CA Certificate ───────────────────────────────────────────────────
# Paste the full contents of ca-cert.pem (generated per docs/procedures/ssl_tls_guide.md)
# This is the PUBLIC certificate - safe to store in Bitwarden (entry: tls-ca-cert)
# For pre-TLS (Stage 1) flashing: leave this as a placeholder - the _pretls.yaml
# configs do not reference mqtt_ca_cert so this value is ignored.
mqtt_ca_cert: |
  -----BEGIN CERTIFICATE-----
  PASTE_CA_CERT_CONTENTS_HERE
  -----END CERTIFICATE-----

# ── ESPHome API encryption ────────────────────────────────────────────────────
# Generate a unique key per device, or use one shared key for the VentSys fleet.
# Generate with: openssl rand -base64 32
# Bitwarden: esphome-api-key
api_key: "YOUR_BASE64_API_KEY"

# ── ESPHome OTA ───────────────────────────────────────────────────────────────
# Bitwarden: esphome-ota-password
ota_password: "YOUR_OTA_PASSWORD"

