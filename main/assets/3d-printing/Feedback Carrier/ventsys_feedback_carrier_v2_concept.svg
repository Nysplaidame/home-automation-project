<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="VentSys feedback carrier V2 visual concept">
  <defs>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-size: 30px; font-weight: 750; fill: #172033; }
      .text { font-family: "Segoe UI", Arial, sans-serif; font-size: 17px; fill: #607089; }
      .label { font-family: "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 750; fill: #172033; }
      .tiny { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #172033; }
      .dim { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; fill: #607089; }
      .base { fill: #f8fafc; stroke: #172033; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
      .channel { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .pocket { fill: #ffffff; stroke: #7c4dff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
      .pocket-gnd { fill: #ffffff; stroke: #222a35; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
      .pocket-cap { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
      .node { fill: #7c4dff; stroke: #ffffff; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .gndnode { fill: #222a35; stroke: #ffffff; stroke-width: 1; vector-effect: non-scaling-stroke; }
      .outline { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#f6f7fb"/>
  <text x="40" y="58" class="title">VentSys Feedback Carrier V2 Concept</text>
  <text x="40" y="92" class="text">Visual only - STL not edited. No rim, recessed channels to edges, recessed component pockets.</text>

  <!-- Scale: 1mm = 40px. Board origin is 180,150. Footprint 11mm x 12.4mm. -->
  <g transform="translate(180 150) scale(40)">
    <!-- Base -->
    <rect x="0" y="0" width="11" height="12.4" rx="0.65" class="base"/>

    <!-- Recessed component body pockets. Resistor pockets are inline with channels. -->
    <rect x="3.45" y="0.95" width="6.3" height="2.15" rx="0.35" class="pocket"/>
    <text x="6.6" y="2.27" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="0.4" font-weight="700" fill="#172033">10k</text>

    <rect x="1.15" y="5.0" width="2.5" height="4.75" rx="0.35" class="pocket-gnd"/>
    <text x="2.4" y="7.55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="0.4" font-weight="700" fill="#172033" transform="rotate(-90 2.4 7.55)">20k</text>

    <rect x="5.25" y="4.3" width="4.8" height="5.9" rx="0.35" class="pocket-cap"/>
    <text x="7.65" y="7.48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="0.36" font-weight="700" fill="#172033">100nF</text>

    <!-- Recessed wire channels, all open to edges where external wires enter/exit. -->
    <!-- 10k channel runs straight through the 10k pocket from ADC to FB. -->
    <rect x="0" y="1.8" width="11" height="0.85" class="channel"/>

    <!-- 20k channel runs vertically through the 20k pocket and intercepts left of the 10k pocket. -->
    <rect x="2.05" y="1.8" width="0.7" height="9.98" class="channel"/>

    <!-- Capacitor pocket is offset; its vertical channel is on the left side of the pocket. -->
    <rect x="4.9" y="3.7" width="0.7" height="8.08" class="channel"/>

    <!-- Right-angle cap-to-node branch intersects above the 20k pocket, not above the pocket body. -->
    <rect x="2.05" y="3.7" width="3.2" height="0.7" class="channel"/>

    <!-- Ground channel opens to both left and right edges. -->
    <rect x="0" y="10.83" width="11" height="0.95" class="channel"/>

    <!-- Connection nodes. -->
    <circle cx="2.4" cy="2.22" r="0.14" class="node"/>
    <circle cx="2.4" cy="3.7" r="0.14" class="node"/>
    <circle cx="2.4" cy="11.3" r="0.14" class="gndnode"/>
    <circle cx="5.25" cy="11.3" r="0.14" class="gndnode"/>

    <!-- Top-layer labels so channels do not obscure the component names. -->
    <text x="6.6" y="1.12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="0.34" font-weight="700" fill="#172033">10k</text>
    <text x="1.65" y="7.55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="0.34" font-weight="700" fill="#172033" transform="rotate(-90 1.65 7.55)">20k</text>
    <text x="7.65" y="7.48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="0.32" font-weight="700" fill="#172033">100nF</text>

    <!-- Edge labels, intentionally tiny. -->
    <text x="0.25" y="1.5" font-family="Segoe UI, Arial, sans-serif" font-size="0.32" font-weight="700" fill="#172033">ADC</text>
    <text x="9.9" y="1.5" font-family="Segoe UI, Arial, sans-serif" font-size="0.32" font-weight="700" fill="#172033">FB</text>
    <text x="5.25" y="10.68" font-family="Segoe UI, Arial, sans-serif" font-size="0.32" font-weight="700" fill="#172033">GND</text>
  </g>

  <!-- Dimension lines -->
  <line x1="180" y1="720" x2="620" y2="720" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="708" x2="180" y2="732" stroke="#94a3b8" stroke-width="2"/>
  <line x1="620" y1="708" x2="620" y2="732" stroke="#94a3b8" stroke-width="2"/>
  <text x="400" y="746" text-anchor="middle" class="dim">11mm concept width</text>

  <line x1="690" y1="150" x2="690" y2="646" stroke="#94a3b8" stroke-width="2"/>
  <line x1="678" y1="150" x2="702" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="678" y1="646" x2="702" y2="646" stroke="#94a3b8" stroke-width="2"/>
  <text x="620" y="135" class="dim">12.4mm concept height</text>

  <g transform="translate(760 165)">
    <text x="0" y="0" class="label">Design changes shown</text>
    <text x="0" y="34" class="text">- No outer raised rim</text>
    <text x="0" y="62" class="text">- Channels open to edges</text>
    <text x="0" y="90" class="text">- Pockets are recessed, not raised</text>
    <text x="0" y="118" class="text">- Resistors sit inline with channels</text>
    <text x="0" y="146" class="text">- Capacitor body is offset right</text>
    <text x="0" y="174" class="text">- Smaller lettering</text>
    <text x="0" y="202" class="text">- STL should omit lettering</text>

    <text x="0" y="258" class="label">Photo-derived clearances</text>
    <text x="0" y="292" class="text">Resistor: approx 7 x 2.5mm</text>
    <text x="0" y="320" class="text">100nF: approx 6 x 4.5mm</text>
    <text x="0" y="348" class="text">Electrolytic kept separate</text>
  </g>

  <g transform="translate(760 560)">
    <rect x="0" y="0" width="34" height="16" class="channel"/>
    <text x="46" y="14" class="text">recessed wire channel</text>
    <rect x="0" y="40" width="34" height="16" class="pocket"/>
    <text x="46" y="54" class="text">recessed component pocket</text>
  </g>
</svg>
