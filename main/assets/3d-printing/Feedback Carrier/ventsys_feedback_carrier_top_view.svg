<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Top view preview of 20mm square VentSys feedback carrier">
  <rect width="800" height="800" fill="#f6f7fb"/>
  <text x="40" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">VentSys Feedback Carrier - Top View</text>
  <text x="40" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#607089">20mm x 20mm printable tray. Blue lines are wire channels; pale blocks are glue pads.</text>

  <g transform="translate(110 150) scale(25)">
    <rect x="0" y="0" width="20" height="20" rx="1.5" fill="#ffffff" stroke="#172033" stroke-width="0.08"/>
    <rect x="0.8" y="0.8" width="18.4" height="18.4" rx="0.8" fill="none" stroke="#94a3b8" stroke-width="0.08"/>

    <!-- Wire channels -->
    <rect x="14.1" y="11.2" width="4.2" height="1.25" fill="#dbeafe"/>
    <rect x="1.7" y="11.2" width="4.2" height="1.25" fill="#dbeafe"/>
    <rect x="5.7" y="7.4" width="1.25" height="4.8" fill="#dbeafe"/>
    <rect x="5.7" y="7.4" width="8.0" height="1.25" fill="#dbeafe"/>
    <rect x="3.0" y="2.2" width="14.0" height="1.25" fill="#dbeafe"/>
    <rect x="6.0" y="2.2" width="1.25" height="3.2" fill="#dbeafe"/>
    <rect x="13.4" y="2.2" width="1.25" height="3.2" fill="#dbeafe"/>

    <!-- Glue pads -->
    <rect x="6.3" y="10.5" width="7.4" height="2.6" rx="0.45" fill="#eef2ff" stroke="#7c4dff" stroke-width="0.08"/>
    <rect x="3.55" y="4.6" width="5.5" height="2.4" rx="0.45" fill="#f8fafc" stroke="#222a35" stroke-width="0.08"/>
    <rect x="10.95" y="4.6" width="5.5" height="2.4" rx="0.45" fill="#eff6ff" stroke="#2563eb" stroke-width="0.08"/>

    <!-- Tie slots -->
    <rect x="1.65" y="15.4" width="1.1" height="4.0" fill="#e2e8f0"/>
    <rect x="17.25" y="15.4" width="1.1" height="4.0" fill="#e2e8f0"/>
    <rect x="1.65" y="0.6" width="1.1" height="4.0" fill="#e2e8f0"/>
    <rect x="17.25" y="0.6" width="1.1" height="4.0" fill="#e2e8f0"/>

    <text x="1.6" y="15.2" font-family="Segoe UI, Arial, sans-serif" font-size="1.5" font-weight="700" fill="#172033">ADC</text>
    <text x="14.6" y="15.2" font-family="Segoe UI, Arial, sans-serif" font-size="1.5" font-weight="700" fill="#172033">FB</text>
    <text x="8.2" y="2.0" font-family="Segoe UI, Arial, sans-serif" font-size="1.4" font-weight="700" fill="#172033">GND</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#172033">
    <rect x="150" y="700" width="36" height="16" fill="#dbeafe"/><text x="200" y="714">wire channels</text>
    <rect x="360" y="700" width="36" height="16" fill="#eef2ff" stroke="#7c4dff"/><text x="410" y="714">10k glue pad</text>
    <rect x="560" y="700" width="36" height="16" fill="#f8fafc" stroke="#222a35"/><text x="610" y="714">20k / 100nF pads</text>
  </g>
</svg>
