# ---------------------------------------------------------------------------
# Fire-risk publisher (Option B from the F-28 note in ventsys_ha_package.yaml).
# FIRE_RISK when ANY array of the enclosure has: latched alarm, smoke, CO or high temperature.
# Unavailable/unknown entities count as "no fire" so a dead board cannot cut printer power;
# board faults are handled by the incident automations instead. Published retained.
# ---------------------------------------------------------------------------
automation:
  - id: ventsys_fdm_risk_publish
    alias: VentSys FDM risk state publisher
    mode: queued
    max: 5
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.fdm_array_1_alarm_latched
          - binary_sensor.fdm_array_1_co
          - binary_sensor.fdm_array_1_high_temperature
          - binary_sensor.fdm_array_2_alarm_latched
          - binary_sensor.fdm_array_2_co
          - binary_sensor.fdm_array_2_high_temperature
          - sensor.fdm_smoke
          - binary_sensor.fdm_array_2_smoke
      - platform: homeassistant
        event: start
    action:
      - action: mqtt.publish
        data:
          topic: "ventsys/fdm/risk/state"
          retain: true
          payload: >-
            {% set hot = [
              is_state('binary_sensor.fdm_array_1_alarm_latched', 'on'),
              is_state('binary_sensor.fdm_array_1_co', 'on'),
              is_state('binary_sensor.fdm_array_1_high_temperature', 'on'),
              is_state('binary_sensor.fdm_array_2_alarm_latched', 'on'),
              is_state('binary_sensor.fdm_array_2_co', 'on'),
              is_state('binary_sensor.fdm_array_2_high_temperature', 'on'),
              is_state('sensor.fdm_smoke', 'detected'),
              is_state('binary_sensor.fdm_array_2_smoke', 'on'),
            ] %}
            {{ 'FIRE_RISK' if true in hot else 'NORMAL' }}

  - id: ventsys_sla_risk_publish
    alias: VentSys SLA risk state publisher
    mode: queued
    max: 5
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.sla_array_1_alarm_latched
          - binary_sensor.sla_array_1_co
          - binary_sensor.sla_array_1_high_temperature
          - binary_sensor.sla_array_2_alarm_latched
          - binary_sensor.sla_array_2_co
          - binary_sensor.sla_array_2_high_temperature
          - sensor.sla_smoke
          - binary_sensor.sla_array_2_smoke
      - platform: homeassistant
        event: start
    action:
      - action: mqtt.publish
        data:
          topic: "ventsys/sla/risk/state"
          retain: true
          payload: >-
            {% set hot = [
              is_state('binary_sensor.sla_array_1_alarm_latched', 'on'),
              is_state('binary_sensor.sla_array_1_co', 'on'),
              is_state('binary_sensor.sla_array_1_high_temperature', 'on'),
              is_state('binary_sensor.sla_array_2_alarm_latched', 'on'),
              is_state('binary_sensor.sla_array_2_co', 'on'),
              is_state('binary_sensor.sla_array_2_high_temperature', 'on'),
              is_state('sensor.sla_smoke', 'detected'),
              is_state('binary_sensor.sla_array_2_smoke', 'on'),
            ] %}
            {{ 'FIRE_RISK' if true in hot else 'NORMAL' }}

