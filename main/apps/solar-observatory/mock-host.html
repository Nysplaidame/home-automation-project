<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Observatory | Simulated HA Host</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#080e15;color:#e8d7ba;font:13px "Segoe UI",sans-serif}
  header{padding:12px 16px;background:#2b2116;border-bottom:1px solid #a08a61}
  h1{font:20px Georgia,serif;margin:0 0 8px}p{margin:8px 0}
  nav{display:flex;flex-wrap:wrap;gap:6px}button{min-height:36px;padding:5px 12px;background:#181e25;border:1px solid #8b785c;color:#f0e3cf;cursor:pointer}
  button:focus-visible{outline:2px solid #e4ceb0}observatory-readonly-card{display:block;height:calc(100dvh - 145px);min-height:480px}
  #mock-status{font-size:11px;color:#c6b69e}
</style></head>
<body>
<header><h1>Simulated Home Assistant host</h1><p>No live HA connection. These buttons change mock data only.</p>
<nav aria-label="Simulation controls"><button id="connect">Connect mock</button><button id="alert">Trigger failsafe</button><button id="clear">Clear failsafe</button><button id="disconnect">Disconnect mock</button><button id="silence">Pause delivery</button><button id="reload">Reload display</button></nav>
<p id="mock-status" role="status">Mock starts disconnected.</p></header>
<observatory-readonly-card id="card"></observatory-readonly-card>
<script type="module" src="/src/mock-host.ts"></script>
</body></html>
