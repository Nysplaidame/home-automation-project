services:
  mermaid-viewer:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mermaid-viewer
    restart: unless-stopped
    ports:
      - "8092:80"
    networks:
      - mermaid-viewer

networks:
  mermaid-viewer:
    name: mermaid-viewer
    ipam:
      config:
        - subnet: 10.240.13.0/24
