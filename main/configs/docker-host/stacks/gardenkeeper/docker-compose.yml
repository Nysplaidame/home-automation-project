name: gardenkeeper

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: gardenkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gardenkeeper}
      POSTGRES_USER: ${POSTGRES_USER:-gardenkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gardenkeeper

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: gardenkeeper-redis
    restart: unless-stopped
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gardenkeeper

  api:
    build:
      context: ./source
      dockerfile: apps/api/Dockerfile
    container_name: gardenkeeper-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - gardenkeeper
      - alerting
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./source
      dockerfile: apps/worker/Dockerfile
    container_name: gardenkeeper-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - gardenkeeper

  web:
    build:
      context: ./source
      dockerfile: apps/web/Dockerfile
    container_name: gardenkeeper-web
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - api
    networks:
      - gardenkeeper

networks:
  gardenkeeper:
    name: gardenkeeper
    ipam:
      config:
        - subnet: 10.240.21.0/24
  alerting:
    external: true
    name: local-alerting
