services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "192.168.20.102:3001,homepage.home.local:3001,100.94.122.18:3001,docker-host:3001,docker-host.tail7012a0.ts.net:3001"
    volumes:
      - ./config:/app/config
      - ./assets:/app/public/images:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
