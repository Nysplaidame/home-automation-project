worker_processes auto;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server_tokens off;

  # Preview responses are framed only by the trusted HTTPS Homepage origins.
  # Individual application CSPs below retain their app-specific directives.
  add_header Content-Security-Policy "frame-ancestors https://192.168.20.102 https://homepage.home.local https://100.94.122.18 https://docker-host https://docker-host.home.local https://docker-host.tail7012a0.ts.net http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;

  server {
    listen 443 ssl;
    include /etc/nginx/tls-common.conf;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://127.0.0.1:3001;
    }
  }

  # Fixed upstreams only: this is deliberately not a user-selectable proxy.
  server {
    listen 8180 ssl;
    include /etc/nginx/tls-common.conf;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; frame-ancestors https://192.168.20.102 https://homepage.home.local https://100.94.122.18 https://docker-host https://docker-host.home.local https://docker-host.tail7012a0.ts.net http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001; img-src 'self' blob: data: http: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.20.102:8091;
    }
  }

  server {
    listen 8181 ssl;
    include /etc/nginx/tls-common.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-src 'self' http: https:; frame-ancestors https://192.168.20.102 https://homepage.home.local https://100.94.122.18 https://docker-host https://docker-host.home.local https://docker-host.tail7012a0.ts.net http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.20.102:8000;
    }
  }

  server {
    listen 8182 ssl;
    include /etc/nginx/tls-common.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-src https://farside.link/lingva; manifest-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors https://192.168.20.102 https://homepage.home.local https://100.94.122.18 https://docker-host https://docker-host.home.local https://docker-host.tail7012a0.ts.net http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
