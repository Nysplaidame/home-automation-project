    include /etc/nginx/tls-common.conf;
    add_header Content-Security-Policy "frame-ancestors https://192.168.20.102 https://homepage.home.local https://100.94.122.18 https://docker-host https://docker-host.home.local https://docker-host.tail7012a0.ts.net" always;
    location / {
      # HA rejects reverse-proxy forwarding headers until trusted_proxies is
      # configured. Preserve only the upstream Host and WebSocket handshake.
      proxy_http_version 1.1;
      proxy_set_header Host 192.168.20.101:8123;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Content-Security-Policy;
      proxy_buffering off;
      proxy_ssl_trusted_certificate /etc/nginx/tls/ca.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_server_name on;
      proxy_ssl_name homeassistant.home.local;
      proxy_pass https://192.168.20.101:8123;
    }
  }

  # HTTPS wrappers for otherwise-HTTP services. Keeping these fixed-target
  # prevents mixed-content failures without creating an open proxy.
  server { listen 8189 ssl; include /etc/nginx/tls-common.conf; location / { include /etc/nginx/proxy-common.conf; proxy_pass http://192.168.20.102:2283; } }
  server { listen 8190 ssl; include /etc/nginx/tls-common.conf; location / { include /etc/nginx/proxy-common.conf; proxy_pass http://192.168.20.102:5984; } }
  server { listen 8191 ssl; include /etc/nginx/tls-common.conf; location / { include /etc/nginx/proxy-common.conf; proxy_pass http://192.168.20.102:8080; } }
  server { listen 8192 ssl; include /etc/nginx/tls-common.conf; location / { include /etc/nginx/proxy-common.conf; proxy_pass http://192.168.20.102:8081; } }
