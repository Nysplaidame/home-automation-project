worker_processes auto;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server_tokens off;

  # Fixed upstreams only: this is deliberately not a user-selectable proxy.
  server {
    listen 8180;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001; img-src 'self' blob: data: http: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.20.102:8091;
    }
  }

  server {
    listen 8181;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-src 'self' http: https:; frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.20.102:8000;
    }
  }

  server {
    listen 8182;
    add_header Content-Security-Policy "default-src 'none'; frame-src https://farside.link/lingva; manifest-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.20.102:8088;
    }
  }

  server {
    listen 8183;
    add_header Content-Security-Policy "frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_ssl_verify off;
      proxy_pass https://192.168.10.10:8006;
    }
  }

  server {
    listen 8184;
    add_header Content-Security-Policy "frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.10.1;
    }
  }

  server {
    listen 8185;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; base-uri 'self'; object-src 'self'; frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.10.12;
    }
  }

  server {
    listen 8186;
    add_header Content-Security-Policy "frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.60.10:3001;
    }
  }

  server {
    listen 8187;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors http://192.168.20.102:3001 http://homepage.home.local:3001 http://100.94.122.18:3001 http://docker-host:3001 http://docker-host.tail7012a0.ts.net:3001" always;
    location / {
      include /etc/nginx/proxy-common.conf;
      proxy_pass http://192.168.40.50;
    }
  }
}
