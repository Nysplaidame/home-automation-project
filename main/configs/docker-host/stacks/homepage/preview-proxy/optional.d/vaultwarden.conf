# Activate as optional.d/vaultwarden.conf only after vault.crt, vault.key, and
# the loopback-only Vaultwarden listener have passed the Tier 3 gate.
server {
  listen 192.168.20.102:443 ssl;
  server_name vault.home.local;
  ssl_certificate /etc/nginx/tls/vault.crt;
  ssl_certificate_key /etc/nginx/tls/vault.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:vaultwarden_tls:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://127.0.0.1:8222;
  }
}
