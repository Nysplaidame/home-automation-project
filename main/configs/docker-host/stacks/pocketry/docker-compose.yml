name: pocketry
services:
  app:
    image: nginxinc/nginx-unprivileged@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
    container_name: pocketry
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    networks: [pocketry]
    healthcheck:
      test: [CMD, wget, --spider, --quiet, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  pocketry:
    name: pocketry
    ipam:
      config:
        - subnet: 10.240.33.0/24
