name: vaultwarden

services:
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:1.36.0
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOMAIN: https://vault.home.local
      SIGNUPS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"
      LOG_LEVEL: warn
      TZ: Europe/London
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8222:80"
    security_opt:
      - no-new-privileges:true

networks:
  default:
    ipam:
      config:
        - subnet: 10.240.30.0/24
