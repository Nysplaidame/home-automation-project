name: download-gateway

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    container_name: download-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "8084"
      OWNED_ONLY: "yes"
      UPDATER_PERIOD: "480h"
      TZ: Europe/London
    ports:
      - "8084:8084"
    volumes:
      - ./gluetun:/gluetun
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PUID: "${MEDIA_UID}"
      PGID: "${MEDIA_GID}"
      TZ: Europe/London
      WEBUI_PORT: "8084"
      TORRENTING_PORT: "6881"
    volumes:
      - ./qbittorrent-config:/config
      - /mnt/omv/media/incoming/qbittorrent:/downloads
    security_opt:
      - no-new-privileges:true

networks:
  default:
    ipam:
      config:
        - subnet: 10.240.20.0/24
