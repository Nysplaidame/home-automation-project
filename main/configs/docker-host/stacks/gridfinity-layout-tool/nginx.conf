server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The static export contains real /designer and /baseplate directories.
    # Without this, Nginx redirects a request without the trailing slash to
    # its internal :8080 listener. The public service is mapped to :8093, so
    # a browser is sent to AdGuard Home on :8080 instead.
    absolute_redirect off;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
