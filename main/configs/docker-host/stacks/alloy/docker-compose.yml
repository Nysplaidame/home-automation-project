services:
  alloy:
    image: grafana/alloy@sha256:bcf27f18c4402869af112fb39e35e1db3804a404686f4caa20bdf77814219223
    container_name: docker-host-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=127.0.0.1:12345 /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./data:/var/lib/alloy
      - ./certs:/etc/alloy/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /opt/stacks/bambuddy/logs:/var/log/bambuddy:ro
