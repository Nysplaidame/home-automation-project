# Deploy to: /opt/stacks/ha-media-proxy/  (VM 103 docker-host, 192.168.20.102)
# Host networking so UFW scopes port 8124 (Docker-published ports would bypass UFW).
services:
  ha-media-proxy:
    image: nginx:1.27-alpine
    container_name: ha-media-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
