# Plain-HTTP media endpoint for ESPHome voice satellites (Voice PE).
# ESP32 firmware cannot resolve *.local via unicast DNS and does not trust the private
# Home Local CA, so HA's internal_url points here and this proxies to HA over HTTPS.
# Only the playback paths are exposed; everything else is 404.
worker_processes 1;
events { worker_connections 64; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    upstream ha { server 192.168.20.101:8123; }

    server {
        listen 8124;
        server_name ha-media.home.arpa;

        # TTS replies (tts_proxy) and ESPHome-transcoded announcements (ffmpeg_proxy).
        location ~ ^/api/(tts_proxy|esphome/ffmpeg_proxy)/ {
            proxy_pass https://ha;
            proxy_ssl_server_name on;
            proxy_ssl_name homeassistant.home.local;
            proxy_ssl_verify off;          # LAN hop to HA's private-CA cert
            proxy_http_version 1.1;
            proxy_set_header Host homeassistant.home.local:8123;
            proxy_buffering off;           # stream audio as it is produced
            proxy_read_timeout 120s;
        }

        location / { return 404; }
    }
}
