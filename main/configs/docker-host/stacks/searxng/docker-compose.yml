services:
  searxng:
    image: searxng/searxng@sha256:ffad724acd87b8dd312328d18da88ddd42e5c4b1d23231594662620053c13cae  # 2026.11.5-3e95f6cd2 (live pin; update + re-probe engines)
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8087:8080"
    environment:
      SEARXNG_BASE_URL: "http://searxng.home.local:8087/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in the protected .env}"
    volumes:
      - ./searxng:/etc/searxng
    networks:
      - searxng

networks:
  searxng:
    name: searxng
    ipam:
      config:
        - subnet: 10.240.8.0/24
