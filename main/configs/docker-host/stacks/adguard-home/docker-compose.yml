services:
  adguard-home:
    image: adguard/adguardhome@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
    container_name: adguard-home
    restart: unless-stopped
    ports:
      - "192.168.20.102:53:53/tcp"
      - "192.168.20.102:53:53/udp"
      - "${DOCKER_HOST_TAILSCALE_IP:?set DOCKER_HOST_TAILSCALE_IP}:53:53/tcp"
      - "${DOCKER_HOST_TAILSCALE_IP:?set DOCKER_HOST_TAILSCALE_IP}:53:53/udp"
      - "8080:80/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf

networks:
  default:
    name: adguard-home
    ipam:
      config:
        - subnet: 10.240.2.0/24
