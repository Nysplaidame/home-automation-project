[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  hostname = "docker-host"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://192.168.60.10:8086"]
  token = "$INFLUXDB_TOKEN"
  organization = "homelab"
  bucket = "dockerhost"

[[inputs.cpu]]
  percpu = true
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]

[[inputs.system]]

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"

# Bambuddy exposes Prometheus-format metrics only on its application API.
# Telegraf is host-networked so this stays on VM103 loopback; it is written
# into the existing dockerhost InfluxDB bucket rather than adding a second
# Prometheus server or a cross-VLAN scrape path.
[[inputs.prometheus]]
  urls = ["http://127.0.0.1:8000/api/v1/metrics"]
  metric_version = 2
