name: bambuddy

services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy@sha256:954d93d7aaf98436cd8a31f67246d12453aa401830c34b8b645effc009caa897
    container_name: bambuddy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/London
      PORT: "8000"
      MQTT_HOST: "${MQTT_HOST:?set MQTT_HOST in .env}"
      MQTT_PORT: "${MQTT_PORT:-8883}"
      MQTT_USER: "${MQTT_USER:?set MQTT_USER in .env}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    networks:
      - default

networks:
  default:
    name: bambuddy
    ipam:
      config:
        - subnet: 10.240.23.0/24
