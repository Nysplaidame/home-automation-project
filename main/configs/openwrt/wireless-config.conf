
# File equivalent: /etc/config/wireless
# GL.iNet GL-MT6000 WiFi Configuration - Multi-SSID VLAN Setup
# Version: 2.1
# Date: 2026-04-10
# Hardware: GL.iNet GL-MT6000 with OpenWrt
#
# Changes from v2.0:
#   - HomePrinters SSID added on radio0 (2.4GHz, VLAN 35) for Bambu P1S
#     compatibility. The same SSID also exists on radio1 for 5GHz-capable
#     printer clients until a wired path is available.

# ============================================================================
# RADIO CONFIGURATION
# ============================================================================

# 2.4GHz Radio Configuration
config wifi-device 'radio0'
    option type 'mac80211'
    option phy 'phy0'
    option band '2g'
    # NOTE: In OpenWrt's mac80211 architecture ALL SSIDs on this radio share a
    # SINGLE channel. Per-interface channel settings are silently ignored.
    # Channel 6 chosen as the 2.4GHz channel:
    #   - HomeIoT (VentSys fire safety) requires a fixed, stable channel
    #   - Channel 6 is a standard non-overlapping 2.4GHz channel (1/6/11)
    option channel '6'
    option htmode 'HE40'
    option country 'GB'
    option txpower '20'
    option mu_beamformer '1'
    option legacy_rates '1'
    option beacon_int '100'
    option rts '2346'
    option frag '2346'

# 5GHz Radio Configuration
config wifi-device 'radio1'
    option type 'mac80211'
    option phy 'phy1'
    option band '5g'
    option channel 'auto'
    option htmode 'HE80'
    option country 'GB'
    option txpower '23'
    option mu_beamformer '1'
    option beacon_int '100'
    option rts '2346'
    option frag '2346'

# ============================================================================
# MAIN USER NETWORK - VLAN 1 (2.4GHz + 5GHz)
# ============================================================================

config wifi-iface 'main_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeMain'
    option network 'lan'
    option encryption 'sae-mixed'
    option key 'YOUR_MAIN_WIFI_PASSWORD_HERE'
    option ieee80211w '1'
    option wpa_disable_eapol_key_retries '1'
    option bss_transition '1'
    option wnm_sleep_mode '1'
    option htmode 'HE40'
    option txpower '20'

config wifi-iface 'main_5g'
    option device 'radio1'
    option mode 'ap'
    option ssid 'HomeMain'
    option network 'lan'
    option encryption 'sae-mixed'
    option key 'YOUR_MAIN_WIFI_PASSWORD_HERE'
    option ieee80211w '1'
    option wpa_disable_eapol_key_retries '1'
    option bss_transition '1'
    option wnm_sleep_mode '1'
    option channel 'auto'
    option htmode 'HE80'
    option txpower '23'

# ============================================================================
# ADMIN NETWORK - VLAN 10 (5GHz preferred, 2.4GHz backup)
# ============================================================================

config wifi-iface 'admin_5g'
    option device 'radio1'
    option mode 'ap'
    option ssid 'HomeAdmin'
    option network 'management'
    option encryption 'sae'
    option key 'YOUR_ADMIN_WIFI_PASSWORD_HERE'
    option ieee80211w '2'
    option wpa_disable_eapol_key_retries '1'
    option hidden '0'
    option maxassoc '8'
    option channel 'auto'
    option htmode 'HE80'

config wifi-iface 'admin_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeAdmin-2G'
    option network 'management'
    option encryption 'sae'
    option key 'YOUR_ADMIN_WIFI_PASSWORD_HERE'
    option ieee80211w '2'
    option wpa_disable_eapol_key_retries '1'
    option hidden '1'
    option maxassoc '4'
    option htmode 'HE20'
    option txpower '18'

# ============================================================================
# PRINTERS NETWORK - VLAN 35 (dual-band)
# Covers Bambu P1S (WiFi-only) and optionally Concepts3D Athena 2.
# Bambu P1S requires 2.4GHz WiFi, so HomePrinters must exist on radio0.
# A radio1 copy is retained for 5GHz-capable printer clients.
# Client isolation enabled — printers have no reason to communicate with each other.
# WPA2 for compatibility (P1S may not support WPA3).
# ============================================================================

config wifi-iface 'printers_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomePrinters'
    option network 'printers'
    option encryption 'psk2'
    option key 'YOUR_PRINTERS_WIFI_PASSWORD_HERE'
    option ieee80211w '0'
    option isolate '1'
    option maxassoc '10'
    option htmode 'HT20'
    option txpower '18'
    # Required for Bambu P1S, which is 2.4GHz-only.
    # WPA2 (psk2) and PMF disabled for broad printer firmware compatibility.
    # Client isolation prevents any compromised printer reaching other printers at L2.
    # Firewall rules enforce all cross-VLAN policy at L3 regardless.
    # Password stored in Bitwarden as 'wifi-homeprinters'.

config wifi-iface 'printers_5g'
    option device 'radio1'
    option mode 'ap'
    option ssid 'HomePrinters'
    option network 'printers'
    option encryption 'psk2'
    option key 'YOUR_PRINTERS_WIFI_PASSWORD_HERE'
    option ieee80211w '0'
    option isolate '1'
    option maxassoc '10'
    option channel 'auto'
    option htmode 'HE80'
    option txpower '20'
    # Optional 5GHz printer access; P1S will not use this radio.
    # PMF disabled (ieee80211w '0') — P1S firmware may not support it reliably.
    # Client isolation prevents any compromised printer reaching other printers at L2.
    # Firewall rules enforce all cross-VLAN policy at L3 regardless.
    # Password stored in Bitwarden as 'wifi-homeprinters'.

# ============================================================================
# IOT SENSORS NETWORK - VLAN 50 (2.4GHz only)
# ============================================================================

config wifi-iface 'HomeIoT_2G'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeIoT'
    option network 'HomeIoT'
    option encryption 'psk2'
    option key 'YOUR_IOT_WIFI_PASSWORD_HERE'
    option ieee80211w '0'
    option maxassoc '50'
    option dtim_period '3'
    option isolate '1'
    option channel '6'
    option htmode 'HT20'
    option txpower '15'
    # Fixed channel 6 (safety-critical — must not drift).
    # HT20 for maximum IoT device compatibility.
    # Client isolation prevents lateral movement between sensor devices.

# ============================================================================
# GUEST NETWORK - Isolated (2.4GHz only)
# ============================================================================

config wifi-iface 'guest_2g'
    option device 'radio0'
    option mode 'ap'
    option ssid 'HomeGuest'
    option network 'guest'
    option encryption 'psk2'
    option key 'YOUR_GUEST_WIFI_PASSWORD_HERE'
    option ieee80211w '0'
    option isolate '1'
    option maxassoc '10'
    option htmode 'HT20'
    option txpower '18'

# ============================================================================
# DMZ NETWORK (DISABLED — placeholder for future use)
# ============================================================================

config wifi-iface 'dmz_5g'
    option device 'radio1'
    option mode 'ap'
    option ssid 'HomeDMZ'
    option network 'dmz'
    option encryption 'sae'
    option key 'YOUR_DMZ_WIFI_PASSWORD_HERE'
    option ieee80211w '2'
    option maxassoc '5'
    option channel 'auto'
    option htmode 'HE80'
    option disabled '1'

# ============================================================================
# CHANNEL & RADIO SUMMARY
# ============================================================================

# 2.4GHz (radio0) — ALL SSIDs share channel 6:
#   HomeMain    (main_2g)   → VLAN 1  (lan)
#   HomeAdmin-2G (admin_2g) → VLAN 10 (management) — hidden
#   HomePrinters (printers_2g) → VLAN 35 (printers, required for P1S)
#   HomeIoT     (HomeIoT_2G) → VLAN 50 (HomeIoT)
#   HomeGuest   (guest_2g)  → VLAN 99 (guest)
#
# 5GHz (radio1) — auto channel, active SSIDs:
#   HomeMain      (main_5g)     → VLAN 1  (lan)
#   HomeAdmin     (admin_5g)    → VLAN 10 (management)
#   HomePrinters  (printers_5g) → VLAN 35 (printers, optional 5GHz clients)
#   (HomeDMZ disabled)
#
# SSID → VLAN mapping (complete):
#   HomeMain      → VLAN 1  (lan)
#   HomeAdmin     → VLAN 10 (management)  [5GHz, visible]
#   HomeAdmin-2G  → VLAN 10 (management)  [2.4GHz, hidden]
#   HomePrinters  → VLAN 35 (printers)
#   HomeIoT       → VLAN 50 (HomeIoT)
#   HomeGuest     → VLAN 99 (guest)

# ============================================================================
# DEPLOYMENT CHECKLIST
# ============================================================================

# Before applying:
# 1. Set all passwords (store in Bitwarden — see docs/secrets_reference.md)
#    wifi-homemain, wifi-homeadmin, wifi-homeprinters (new), wifi-homeiot, wifi-homeguest
# 2. Confirm P1S joins HomePrinters on 2.4GHz (Bambu P1S is 2.4GHz-only)
# 3. Confirm printers VLAN 35 is live in vlan-config.conf before adding printer

# Post-deployment:
# 1. Connect P1S to HomePrinters — confirm it gets 192.168.35.200
# 2. Verify Bambu Studio (VLAN 1 laptop) can reach 192.168.35.200:8883
# 3. Confirm P1S cannot reach 192.168.20.x or 192.168.1.x directly
# 4. Verify internet access blocked except port 443 (test with curl on a non-443 port)
