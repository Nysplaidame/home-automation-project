#!/bin/bash

# ============================================================================
# Home Automation Project - OpenWrt Firewall Configuration
# 10-VLAN Security Architecture Implementation
# Version: 3.0
# Date: 2026-04-10
# Repository: https://github.com/Nysplaidame/home-automation-project
# Hardware: GL.iNet GL-MT6000 with OpenWrt
#
# Changes from v2.0:
#   - VLAN 30 zone renamed cctv → nvr (Bambuddy removed from VM 101)
#   - VLAN 35 printers zone added (Bambu P1S + Concepts3D Athena 2)
#   - Bambuddy→HA stays inside VLAN 20 trust boundary (not routed by OpenWrt)
#   - VM 103 is the central Docker host at 192.168.20.102 on VLAN 20
#   - P1S moved from 192.168.1.200 (VLAN 1) to 192.168.35.200 (VLAN 35)
#   See docs/decisions/02-printer-vlan-architecture.md for full rationale.
# ============================================================================

set -e
set -u

echo "Starting Home Automation Firewall Configuration v3.0..."
echo "Implementing 10-VLAN security architecture"

# ============================================================================
# BACKUP EXISTING CONFIGURATION
# ============================================================================

echo "Creating backup of existing configuration..."
BACKUP_FILE="/tmp/firewall.backup.$(date +%Y%m%d_%H%M%S)"
cp /etc/config/firewall "$BACKUP_FILE" || echo "Warning: Could not create backup"

# ============================================================================
# CLEAR EXISTING CONFIGURATION
# ============================================================================

echo "Clearing existing firewall configuration..."
> /etc/config/firewall

# ============================================================================
# BASIC FIREWALL DEFAULTS
# ============================================================================

echo "Setting up basic firewall defaults..."
cat >> /etc/config/firewall << 'EOF'

config defaults
    option syn_flood    1
    option input        REJECT
    option output       ACCEPT
    option forward      REJECT

EOF

# ============================================================================
# ZONE DEFINITIONS
# ============================================================================

echo "Creating firewall zones..."

# Zone: WAN (Internet)
uci add firewall zone
uci set firewall.@zone[-1].name='wan'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci set firewall.@zone[-1].masq='1'
uci set firewall.@zone[-1].mtu_fix='1'
uci add_list firewall.@zone[-1].network='wan'
uci add_list firewall.@zone[-1].network='wan6'

# Zone: LAN (VLAN 1) - Main users
uci add firewall zone
uci set firewall.@zone[-1].name='lan'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='ACCEPT'
uci add_list firewall.@zone[-1].network='lan'

# Zone: MANAGEMENT (VLAN 10)
uci add firewall zone
uci set firewall.@zone[-1].name='management'
uci set firewall.@zone[-1].input='ACCEPT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='ACCEPT'
uci add_list firewall.@zone[-1].network='management'

# Zone: AUTOMATION (VLAN 20) - Home Assistant + Docker host
uci add firewall zone
uci set firewall.@zone[-1].name='automation'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='automation'

# Zone: NVR (VLAN 30) - Frigate NVR VM + IP cameras (renamed from cctv)
uci add firewall zone
uci set firewall.@zone[-1].name='nvr'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='nvr'

# Zone: PRINTERS (VLAN 35) - Bambu P1S + Concepts3D Athena 2
uci add firewall zone
uci set firewall.@zone[-1].name='printers'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='printers'

# Zone: STORAGE (VLAN 40)
uci add firewall zone
uci set firewall.@zone[-1].name='storage'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='storage'

# Zone: IOT_SENSORS (VLAN 50) - Fire safety sensors (CRITICAL)
uci add firewall zone
uci set firewall.@zone[-1].name='iot_sensors'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='iot_sensors'

# Zone: MONITORING (VLAN 60)
uci add firewall zone
uci set firewall.@zone[-1].name='monitoring'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='monitoring'

# Zone: DMZ (VLAN 70)
uci add firewall zone
uci set firewall.@zone[-1].name='dmz'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='dmz'

# Zone: GUEST (VLAN 99)
uci add firewall zone
uci set firewall.@zone[-1].name='guest'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='guest'

# Zone: VPN_CLIENTS
# B7 fix: references wg0 directly (not a duplicate static 'vpn' interface)
uci add firewall zone
uci set firewall.@zone[-1].name='vpn_clients'
uci set firewall.@zone[-1].input='REJECT'
uci set firewall.@zone[-1].output='ACCEPT'
uci set firewall.@zone[-1].forward='REJECT'
uci add_list firewall.@zone[-1].network='wg0'

echo "Firewall zones created successfully"

# ============================================================================
# ROUTER INPUT RULES — DHCP AND DNS FOR RESTRICTED ZONES
# ============================================================================
# Zones with input=REJECT cannot reach the router for DHCP or DNS by default.
# These explicit rules allow only the required services and nothing else.
# Without them, devices on restricted VLANs cannot get IP addresses or
# resolve hostnames — the whole network breaks.
#
# A6-2 fix: companion to the input=REJECT policy change on isolated zones.
# Only DHCP (67/68 UDP) and DNS (53 UDP/TCP) are opened. SSH and LuCI remain
# inaccessible from restricted VLANs — management access is VLAN 10 and VPN only.
# ============================================================================

echo "Configuring router input rules for restricted zones..."

# Helper function — adds DHCP + DNS input rules for a zone
# DHCP: client (68) → server (67) for lease requests; router is the DHCP server
# DNS:  port 53 UDP+TCP for dnsmasq on the router

for ZONE in automation nvr printers storage iot_sensors monitoring dmz guest; do

  uci add firewall rule
  uci set firewall.@rule[-1].name="Allow DHCP input ${ZONE}"
  uci set firewall.@rule[-1].src="${ZONE}"
  uci set firewall.@rule[-1].dest_port='67'
  uci set firewall.@rule[-1].proto='udp'
  uci set firewall.@rule[-1].target='ACCEPT'

  uci add firewall rule
  uci set firewall.@rule[-1].name="Allow DNS input ${ZONE}"
  uci set firewall.@rule[-1].src="${ZONE}"
  uci set firewall.@rule[-1].dest_port='53'
  uci set firewall.@rule[-1].proto='tcp udp'
  uci set firewall.@rule[-1].target='ACCEPT'

done

# VPN clients also need DNS from the router (queries go to router gateway)
uci add firewall rule
uci set firewall.@rule[-1].name='Allow DNS input vpn_clients'
uci set firewall.@rule[-1].src='vpn_clients'
uci set firewall.@rule[-1].dest_port='53'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

echo "Router input rules configured"

# ============================================================================
# INTERNET ACCESS RULES
# ============================================================================

echo "Configuring internet access rules..."

# AdGuard Home on docker-host is the approved upstream DNS forwarder.
# This rule must appear before the broader automation DNS bypass block.
uci add firewall rule
uci set firewall.@rule[-1].name='Docker Host AdGuard Upstream DNS'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.102'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

# DNS bypass guards must precede broad internet allow rules.
uci add firewall rule
uci set firewall.@rule[-1].name='Block LAN External DNS'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block Automation External DNS'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block DMZ External DNS'
uci set firewall.@rule[-1].src='dmz'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

uci add firewall rule
uci set firewall.@rule[-1].name='Block Guest External DNS'
uci set firewall.@rule[-1].src='guest'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

# LAN to WAN - Full Internet Access
uci add firewall rule
uci set firewall.@rule[-1].name='LAN to Internet'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='ACCEPT'

# Management to WAN - Full Internet Access
uci add firewall rule
uci set firewall.@rule[-1].name='Management to Internet'
uci set firewall.@rule[-1].src='management'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].proto='all'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant to WAN - Limited Internet Access
uci add firewall rule
uci set firewall.@rule[-1].name='Home Assistant Internet Access'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='ACCEPT'

# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !! SECURITY WARNING — FRIGATE WAN ACCESS                                 !!
# !! This rule gives the Frigate VM (NVR network) outbound HTTPS access.  !!
# !! It exists solely for Docker image pulls (`docker compose pull`).      !!
# !! A compromised Frigate container could exfiltrate camera footage via    !!
# !! HTTPS while this rule is active.                                      !!
# !!                                                                       !!
# !! RECOMMENDATION: After initial deployment and image pull, REMOVE this  !!
# !! rule. Re-add it temporarily only when updating Frigate:               !!
# !!   uci add firewall rule                                               !!
# !!   uci set firewall.@rule[-1].name='TEMP Frigate Update Access'        !!
# !!   uci set firewall.@rule[-1].src='nvr'                              !!
# !!   uci set firewall.@rule[-1].src_ip='192.168.30.20'                   !!
# !!   uci set firewall.@rule[-1].dest='wan'                               !!
# !!   uci set firewall.@rule[-1].dest_port='80 443'                       !!
# !!   uci set firewall.@rule[-1].proto='tcp'                              !!
# !!   uci set firewall.@rule[-1].target='ACCEPT'                          !!
# !!   uci commit firewall && /etc/init.d/firewall restart                  !!
# !!   # ... run docker compose pull ... then remove the rule               !!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# Frigate to WAN - For updates only
uci add firewall rule
uci set firewall.@rule[-1].name='TEMP Frigate Internet Access'
uci set firewall.@rule[-1].src='nvr'
uci set firewall.@rule[-1].src_ip='192.168.30.20'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='80 443'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Docker host to WAN - Temporary bootstrap/update access only
# Required for Debian package installation and Docker image pulls during VM 103 setup.
# Remove after bootstrap; re-add temporarily only for Docker host package/image updates.
uci add firewall rule
uci set firewall.@rule[-1].name='TEMP Docker Host Update Access'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.102'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='80 443'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Docker host to WAN - permanent narrow egress for Tailscale remote access.
# General package updates and Docker image pulls still use temporary maintenance rules.
uci add firewall rule
uci set firewall.@rule[-1].name='Docker Host Tailscale Egress'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.102'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='443 3478 41641'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

# Block all other automation devices from internet
uci add firewall rule
uci set firewall.@rule[-1].name='Block Other Automation Internet'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'

# Printers OTA Internet Access - port 443 only
# Covers both Bambu P1S (HTTPS firmware) and Concepts3D Athena 2 (NanoDLP Linux OS updates).
# Intentionally no src_ip filter — applies to all printer VLAN devices.
# If a printer is compromised it can only reach port 443; all other outbound is blocked below.
uci add firewall rule
uci set firewall.@rule[-1].name='Printers OTA Internet'
uci set firewall.@rule[-1].src='printers'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='443'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Block all other printer internet access — logged
uci add firewall rule
uci set firewall.@rule[-1].name='Block Printers Internet'
uci set firewall.@rule[-1].src='printers'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

# Monitoring to WAN - For updates and alerts
uci add firewall rule
uci set firewall.@rule[-1].name='Monitoring Internet Access'
uci set firewall.@rule[-1].src='monitoring'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='80 443 25 587'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# DMZ Services to WAN
uci add firewall rule
uci set firewall.@rule[-1].name='DMZ Internet Access'
uci set firewall.@rule[-1].src='dmz'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='80 443'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='ACCEPT'

# Guest to WAN - Internet Only Access
uci add firewall rule
uci set firewall.@rule[-1].name='Guest Internet Access'
uci set firewall.@rule[-1].src='guest'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='ACCEPT'

# Allow WireGuard traffic from WAN
uci add firewall rule
uci set firewall.@rule[-1].name='Allow WireGuard WAN'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].dest_port='51820'
uci set firewall.@rule[-1].proto='udp'
uci set firewall.@rule[-1].target='ACCEPT'

uci add firewall rule
uci set firewall.@rule[-1].name='Allow WireGuard Interface'
uci set firewall.@rule[-1].src='wan'
uci set firewall.@rule[-1].dest='vpn_clients'
uci set firewall.@rule[-1].target='ACCEPT'

# Explicit blocks for isolated networks
uci add firewall rule
uci set firewall.@rule[-1].name='Block NVR Internet'
uci set firewall.@rule[-1].src='nvr'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

uci add firewall rule
uci set firewall.@rule[-1].name='Block Storage Internet'
uci set firewall.@rule[-1].src='storage'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

uci add firewall rule
uci set firewall.@rule[-1].name='Block IoT Internet'
uci set firewall.@rule[-1].src='iot_sensors'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].target='REJECT'
uci set firewall.@rule[-1].log='1'
uci set firewall.@rule[-1].log_limit='10/minute'

echo "Internet access rules configured"

# ============================================================================
# DNS SECURITY RULES
# ============================================================================

echo "Configuring DNS security rules..."

# Block IoT sensors from external DNS
uci add firewall rule
uci set firewall.@rule[-1].name='Block IoT External DNS'
uci set firewall.@rule[-1].src='iot_sensors'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

# Block NVR from external DNS
uci add firewall rule
uci set firewall.@rule[-1].name='Block NVR External DNS'
uci set firewall.@rule[-1].src='nvr'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

# Block Storage from external DNS
uci add firewall rule
uci set firewall.@rule[-1].name='Block Storage External DNS'
uci set firewall.@rule[-1].src='storage'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

# Block Printers from external DNS
# Printers use local DNS only. OTA updates resolve via HTTPS so only 443 outbound is needed.
uci add firewall rule
uci set firewall.@rule[-1].name='Block Printers External DNS'
uci set firewall.@rule[-1].src='printers'
uci set firewall.@rule[-1].dest='wan'
uci set firewall.@rule[-1].dest_port='53 853'
uci set firewall.@rule[-1].proto='tcp udp'
uci set firewall.@rule[-1].target='REJECT'

echo "DNS security rules configured"

# ============================================================================
# INTER-VLAN COMMUNICATION RULES
# ============================================================================

echo "Configuring inter-VLAN communication rules..."

# ── LAN OUTBOUND ─────────────────────────────────────────────────────────────

# LAN to Home Assistant UI
uci add firewall rule
uci set firewall.@rule[-1].name='LAN to Home Assistant UI'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_ip='192.168.20.101'
uci set firewall.@rule[-1].dest_port='8123'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# LAN to Bambuddy UI
# Allows user laptops to reach the Bambuddy workload on docker-host.
uci add firewall rule
uci set firewall.@rule[-1].name='LAN to Bambuddy UI'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_ip='192.168.20.102'
uci set firewall.@rule[-1].dest_port='8000'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# LAN to Tier 1 docker-host app UIs
# Ports:
#   2283 - Immich
#   3001 - Homepage
#   8080 - AdGuard Home admin UI after setup
#   8081 - Dozzle
uci add firewall rule
uci set firewall.@rule[-1].name='LAN to Docker Host App UIs'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='automation'
uci set firewall.@rule[-1].dest_ip='192.168.20.102'
uci set firewall.@rule[-1].dest_port='2283 3001 8080 8081'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# LAN to Printers
# Allows slicer software on user laptops to reach printers directly.
#   8883 — Bambu P1S local MQTT broker (Bambu Studio connection)
#   21    — Bambu P1S FTPS file transfer (Bambu Studio)
#   80    — NanoDLP web UI / REST API (Athena 2, default port)
#   8080  — NanoDLP web UI / REST API (Athena 2, alternate port)
#
# PLACEHOLDER — Odyssey / Dragonfruit:
#   The Open Resin Alliance Odyssey engine uses port 12357 by default.
#   Dragonfruit slicer integration requirements are not yet confirmed.
#   Add port 12357 to dest_port once confirmed via ORA Discord.
#   See docs/decisions/02-printer-vlan-architecture.md for context.
uci add firewall rule
uci set firewall.@rule[-1].name='LAN to Printers'
uci set firewall.@rule[-1].src='lan'
uci set firewall.@rule[-1].dest='printers'
uci set firewall.@rule[-1].dest_port='8883 21 80 8080'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# ── HOME ASSISTANT OUTBOUND ───────────────────────────────────────────────────

# Home Assistant access to NVR (Frigate VM only)
#   8971 — Frigate 0.14+ UI/API  |  5000 — Frigate <0.14 (kept for compat)
#   8554 — RTSP restream          |  8555 — WebRTC
# NOTE: Bambuddy (port 8000) removed — Bambuddy is now on VLAN 20, not VLAN 30.
uci add firewall rule
uci set firewall.@rule[-1].name='HA to NVR Access'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='nvr'
uci set firewall.@rule[-1].dest_ip='192.168.30.20'
uci set firewall.@rule[-1].dest_port='8971 5000 8554 8555'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant access to Storage (NAS)
uci add firewall rule
uci set firewall.@rule[-1].name='HA to Storage Access'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='storage'
uci set firewall.@rule[-1].dest_ip='192.168.40.50'
uci set firewall.@rule[-1].dest_port='22 445 2049'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant metrics export to InfluxDB on the monitoring VM
uci add firewall rule
uci set firewall.@rule[-1].name='HA to InfluxDB'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='monitoring'
uci set firewall.@rule[-1].dest_ip='192.168.60.10'
uci set firewall.@rule[-1].dest_port='8086'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# Home Assistant external health checks for monitoring stack visibility
uci add firewall rule
uci set firewall.@rule[-1].name='HA to Monitoring Health'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='monitoring'
uci set firewall.@rule[-1].dest_ip='192.168.60.10'
uci set firewall.@rule[-1].dest_port='3000 3001'
uci set firewall.@rule[-1].proto='tcp'
uci set firewall.@rule[-1].target='ACCEPT'

# ESPHome API + OTA: HA → IoT devices
#   6053 — ESPHome native API
#   3232 — ESPHome OTA update channel
uci add firewall rule
uci set firewall.@rule[-1].name='ESPHome API HA to IoT'
uci set firewall.@rule[-1].src='automation'
uci set firewall.@rule[-1].src_ip='192.168.20.101'
uci set firewall.@rule[-1].dest='iot_sensors'
uci set firewall.@rule[-1].proto='tcp'
