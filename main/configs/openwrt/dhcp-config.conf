## IP Address Allocation Plan

### Static Reservations (.1-.99)
- **Router gateways:** .1 on each network
- **Critical infrastructure:** .10-.99 range
- **Proxmox host:** 192.168.10.10
- **Home Assistant VM:** 192.168.20.101
- **Docker host VM:** 192.168.20.102
- **LLM host VM:** 192.168.20.104
- **Bambuddy app alias:** bambuddy.home.local → 192.168.20.102
- **Frigate NVR CT:** 192.168.30.20
- **Bambu P1S:** 192.168.35.200
- **Concepts3D Athena 2:** 192.168.35.201
- **NAS:** 192.168.40.50

### DHCP Dynamic Ranges (.100+)
- **User devices:** 192.168.1.100-199 (100 addresses)
- **Admin devices:** 192.168.10.100-149 (50 addresses)
- **Automation services:** 192.168.20.110-149 (40 addresses)
- **NVR devices:** 192.168.30.100-149 (50 addresses)
- **Printers:** 192.168.35.100-149 (50 addresses)
- **Storage devices:** 192.168.40.100-139 (40 addresses)
- **IoT sensors:** 192.168.50.100-190 (91 addresses)
- **Guest devices:** 192.168.99.100-150 (51 addresses)

## Security Features

### DNS Configuration
- **Local domain:** `home.local`
- **Filtering DNS:** AdGuard Home on docker-host (`192.168.20.102#53`)
- **Public fallback DNS:** Quad9 (9.9.9.9), then Cloudflare (1.1.1.1 / 1.0.0.1)
- **Isolated networks:** Local DNS only (NVR, Printers, Storage, IoT)
- **DNS rebinding protection:** Enabled

### Lease Time Strategy
- **Critical infrastructure:** 24h (stability)
- **User devices:** 12h (balance)
- **IoT devices:** 6h (flexibility for troubleshooting)
- **Guest devices:** 2h (security)

## Notes
- **Isolated networks** (NVR, Printers, Storage, IoT) use local DNS only
- **Guest network** uses guest router DNS; router handles upstream filtering/fallback
- **Static reservations** prevent IP conflicts for critical infrastructure
