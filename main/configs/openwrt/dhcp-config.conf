# OpenWrt DHCP Configuration - Multi-VLAN DHCP Servers

**File:** `/etc/config/dhcp`
**Hardware:** GL.iNet GL-MT6000 with OpenWrt
**Version:** 2.0
**Date:** 2026-04-10

Current shape:
  - VLAN 30 is the NVR network for CT 111 Frigate and cameras.
  - VLAN 35 is the printer network for Bambu P1S and Concepts3D Athena 2.
  - Docker host VM 103 is reserved at 192.168.20.102.
  - llm-host CT 114 DNS aliases point at 192.168.20.104.
  - Router-local DNS uses the home.local domain.

## DHCP Server Architecture

| Network | VLAN | IP Range | DHCP Range | Purpose |
|---------|------|----------|------------|---------|
| **lan** | 1 | 192.168.1.0/24 | .100-.199 | Main users |
| **management** | 10 | 192.168.10.0/24 | .100-.149 | Admin devices |
| **automation** | 20 | 192.168.20.0/24 | .110-.149 | HA + Docker host |
| **nvr** | 30 | 192.168.30.0/24 | .100-.149 | Frigate NVR + cameras |
| **printers** | 35 | 192.168.35.0/24 | .100-.149 | Printers |
| **storage** | 40 | 192.168.40.0/24 | .100-.139 | NAS/storage |
| **iot_sensors** | 50 | 192.168.50.0/24 | .100-.190 | IoT devices |
| **monitoring** | 60 | 192.168.60.0/24 | .100-.149 | Monitoring VMs |
| **dmz** | 70 | 192.168.70.0/24 | .100-.149 | DMZ services |
| **guest** | 99 | 192.168.99.0/24 | .100-.150 | Visitors |

## Configuration File

```bash
# File equivalent: /etc/config/dhcp
# GL.iNet GL-MT6000 DHCP Configuration - Multi-VLAN Setup

# ============================================================================
# GLOBAL DHCP SETTINGS
# ============================================================================

config dnsmasq
    option domainneeded '1'
    option boguspriv '1'
    option filterwin2k '0'
    option localise_queries '1'
    option rebind_protection '1'
    option rebind_localhost '1'
    option local '/home.local/'
    option domain 'home.local'
    option expandhosts '1'
    option nonegcache '0'
    option cachesize '1000'
    option authoritative '1'
    option readethers '1'
    option leasefile '/tmp/dhcp.leases'
    option noresolv '1'
    option strictorder '1'
    # Upstream DNS preference: AdGuard Home on docker-host first, then public fallback.
    list server '192.168.20.102#53'
    list server '9.9.9.9'
    list server '1.1.1.1'
    list server '1.0.0.1'
    # PXE/TFTP (disabled — enable if PXE boot needed)
    option enable_tftp '0'

# ============================================================================
# MAIN USER NETWORK - VLAN 1 (192.168.1.0/24)
# Primary network for phones, laptops, tablets, smart TVs
# ============================================================================

config dhcp 'lan'
    option interface 'lan'
    option start '100'
    option limit '100'
    option leasetime '12h'
    option dhcpv4 'server'
    option dhcpv6 'server'
    option ra 'server'
    option ra_slaac '1'
    list ra_flags 'managed-config'
    list ra_flags 'other-config'
    # DNS: router only; dnsmasq prefers AdGuard then public fallback.
    list dhcp_option '6,192.168.1.1'

# ============================================================================
# MANAGEMENT NETWORK - VLAN 10 (192.168.10.0/24)
# Administrative devices and Proxmox host
# ============================================================================

config dhcp 'management'
    option interface 'management'
    option start '100'
    option limit '50'
    option leasetime '24h'
    option dhcpv4 'server'
    # Longer lease time for admin devices
    # Static reservations: .11-.99 range reserved, Proxmox (.10)
    list dhcp_option '6,192.168.10.1'

# ============================================================================
# AUTOMATION NETWORK - VLAN 20 (192.168.20.0/24)
# Home Assistant VM and Docker host
# ============================================================================

config dhcp 'automation'
    option interface 'automation'
    option start '110'
    option limit '40'
    option leasetime '24h'
    option dhcpv4 'server'
    # Static reservations: HA (.101), Docker host (.102), other services (.103-.109)
    list dhcp_option '6,192.168.20.1'

# ============================================================================
# NVR NETWORK - VLAN 30 (192.168.30.0/24)
# Frigate NVR CT and IP cameras (no internet access)
# ============================================================================

config dhcp 'nvr'
    option interface 'nvr'
    option start '100'
    option limit '50'
    option leasetime '24h'
    option dhcpv4 'server'
    # Local DNS only (no internet)
    list dhcp_option '6,192.168.30.1'
    # Static reservations: Cameras (.21-.29), Frigate (.20)

# ============================================================================
# PRINTERS NETWORK - VLAN 35 (192.168.35.0/24)
# Bambu P1S and Concepts3D Athena 2 (no internet except OTA on port 443)
# ============================================================================

config dhcp 'printers'
    option interface 'printers'
    option start '100'
    option limit '50'
    option leasetime '24h'
    option dhcpv4 'server'
    # Local DNS only — printers use HTTPS for OTA but do not need DNS to WAN
    # (OTA hostnames resolve via local dnsmasq forwarding to 1.1.1.1 only for
    # the specific HTTPS connection permitted by the firewall OTA rule)
    list dhcp_option '6,192.168.35.1'
    # Static reservations: Bambu P1S (.200), Concepts3D Athena 2 (.201)

# ============================================================================
# STORAGE NETWORK - VLAN 40 (192.168.40.0/24)
# NAS and backup services (no internet access)
# ============================================================================

config dhcp 'storage'
    option interface 'storage'
    option start '100'
    option limit '40'
    option leasetime '24h'
    option dhcpv4 'server'
    # Local DNS only
    list dhcp_option '6,192.168.40.1'
    # Static reservations: NAS (.50), backup services (.51-.59)

# ============================================================================
# IOT SENSORS NETWORK - VLAN 50 (192.168.50.0/24)
# Fire safety sensors and smart devices (no internet - CRITICAL)
# ============================================================================

config dhcp 'iot_sensors'
    option interface 'iot_sensors'
    option start '100'
    option limit '91'
    option leasetime '6h'
    option dhcpv4 'server'
    # Shorter lease time for IoT devices
    # Local DNS only (security critical)
    list dhcp_option '6,192.168.50.1'
    # NTP DHCP option (42) intentionally absent:
    # All ESPHome boards use `time: platform: homeassistant` which syncs time
    # over the native API — no NTP server query is ever made. SNTP is not used.
    # The firewall has a router-input NTP rule (port 123) as a safety net, but
    # it will never be hit by any device in this firmware configuration.
    # A6-6 resolution: no dhcp_option 42 needed; homeassistant time sync covers all boards.
    # Static reservations by device type:
    # Fans:             .21 (main), .22 (booth)
    # Sensor arrays:    .31-.32 (FDM), .33-.34 (SLA)
    # Air sensors:      .35 (garage), .36 (FDM pipe), .37 (SLA pipe)
    # Airflow sensors:  .41 (FDM), .42 (SLA), .43 (booth)
    # Butterfly valves: .51 (main-1), .52 (main-2), .53 (FDM branch), .54 (SLA branch),
    #                   .55 (FDM printer), .56 (SLA printer)
    # 360° valves:      .61 (FDM), .62 (SLA)
    # Smart plugs:      .71 (FDM printer), .72 (SLA printer), .73 (UV-1), .74 (UV-2),
    #                   .75 (wash/cure), .76 (ventsys-plug-ultrasonic), .77 (AMS-HT), .78 (eSUN dryer)
    # Reserved:         .79-.89 (future devices)

# ============================================================================
# MONITORING NETWORK - VLAN 60 (192.168.60.0/24)
# Monitoring VMs and tools with limited internet access
# ============================================================================

config dhcp 'monitoring'
    option interface 'monitoring'
    option start '100'
    option limit '50'
    option leasetime '24h'
    option dhcpv4 'server'
    # Limited internet access for updates and alerts; DNS through router.
    list dhcp_option '6,192.168.60.1'

# ============================================================================
# DMZ NETWORK - VLAN 70 (192.168.70.0/24)
# Public services with controlled internet access
# ============================================================================

config dhcp 'dmz'
    option interface 'dmz'
    option start '100'
    option limit '50'
    option leasetime '12h'
    option dhcpv4 'server'
    list dhcp_option '6,192.168.70.1'

# ============================================================================
# GUEST NETWORK - Isolated (192.168.99.0/24)
# Visitor access with internet only, no local network access
# ============================================================================

config dhcp 'guest'
    option interface 'guest'
    option start '100'
    option limit '51'
    option leasetime '2h'
    option dhcpv4 'server'
    list dhcp_option '6,192.168.99.1'

# ============================================================================
# STATIC DHCP RESERVATIONS
# Critical infrastructure devices with fixed IPs
# ============================================================================

# Proxmox Host (Management Network)
config host
    option name 'proxmox-host'
    option dns '1'
