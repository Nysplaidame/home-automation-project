# One-use unloaded Valve 2 supply check. Boots with PWM detached.
# The only motion command holds 1500 us for three seconds, then detaches.
substitutions:
  device_name: ventsys-main-valve-2
  friendly_name: "VentSys Main Duct Valve 2 Calibration"
  device_ip: "192.168.50.52"
  servo_gpio: GPIO16
  feedback_gpio: GPIO35

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - servo.detach: calibration_servo

esp32:
  board: esp32dev
  framework:
    type: arduino
    version: recommended

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  use_address: ${device_ip}
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0
    dns1: 192.168.50.1
  ap:
    ssid: "VentSys Valve 2 Calibration"
    password: !secret ota_password

captive_portal:

output:
  - platform: ledc
    id: calibration_pwm
    pin: ${servo_gpio}
    frequency: 50Hz

servo:
  - id: calibration_servo
    output: calibration_pwm
    auto_detach_time: 4000ms
    min_level: 2.5%
    idle_level: 7.5%
    max_level: 12.5%

globals:
  - id: diagnostic_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: command_sequence
    type: int
    restore_value: no
    initial_value: '0'
  - id: sample_sum
    type: float
    restore_value: no
    initial_value: '0.0f'
  - id: sample_min
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: sample_max
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: sample_count
    type: int
    restore_value: no
    initial_value: '0'

sensor:
  - platform: adc
    pin: ${feedback_gpio}
    name: "Raw Feedback Voltage"
    id: raw_feedback_v
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    attenuation: auto
    update_interval: 20ms
    entity_category: diagnostic

  - platform: template
    name: "Last Feedback Mean"
    id: last_feedback_mean
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "Last Feedback Range"
    id: last_feedback_range
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "Last Release Shift"
    id: last_release_shift
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "Command Sequence"
    id: sequence_sensor
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

button:
  - platform: template
    name: "Hold 1500 Once"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !id(diagnostic_done) && !id(hold_script).is_running();'
            then:
              - script.execute: hold_script
            else:
              - lambda: 'ESP_LOGW("calibration", "Diagnostic already run or active; command rejected");'

  - platform: template
    name: "Stop Release"
    on_press:
      then:
        - script.stop: hold_script
        - servo.detach: calibration_servo
        - lambda: 'id(diagnostic_done) = true;'

script:
  - id: hold_script
    mode: single
    then:
      - lambda: |-
          id(diagnostic_done) = true;
          id(command_sequence)++;
          id(sequence_sensor).publish_state(id(command_sequence));
          id(sample_sum) = 0.0f;
          id(sample_min) = NAN;
          id(sample_max) = NAN;
          id(sample_count) = 0;
          ESP_LOGI("calibration", "One-use 1500 us hold; feedback before %.3f V", id(raw_feedback_v).state);
      - servo.write:
          id: calibration_servo
          level: 0.0
      - delay: 2800ms
      - repeat:
          count: 10
          then:
            - component.update: raw_feedback_v
            - delay: 20ms
            - lambda: |-
                const float v = id(raw_feedback_v).state;
                if (!isnan(v)) {
                  id(sample_sum) += v;
                  if (isnan(id(sample_min)) || v < id(sample_min)) id(sample_min) = v;
                  if (isnan(id(sample_max)) || v > id(sample_max)) id(sample_max) = v;
                  id(sample_count)++;
                }
      - servo.detach: calibration_servo
      - delay: 300ms
      - lambda: |-
          if (id(sample_count) == 10) {
            const float mean = id(sample_sum) / 10.0f;
            id(last_feedback_mean).publish_state(mean);
            id(last_feedback_range).publish_state(id(sample_max) - id(sample_min));
            id(last_release_shift).publish_state(id(raw_feedback_v).state - mean);
            ESP_LOGI("calibration", "1500 us mean %.3f V; release shift %.3f V; PWM detached",
                     mean, id(raw_feedback_v).state - mean);
          } else {
            ESP_LOGW("calibration", "Incomplete feedback sample set; PWM detached");
          }
