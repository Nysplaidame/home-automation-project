# VentSys Smart Plug — Avatar AWP02L2
# Device: plug-uv-1  IP: 192.168.50.73  VLAN 50
# Hardware: ESP8266 (esp01_1m board), NO energy monitoring hardware
# Controls: UV curing station 1
#
# FLASH METHOD: Serial only (tuya-convert no longer works on current firmware)
# Pinout: relay GPIO15, button GPIO13 (inverted/pullup), LED GPIO2 (inverted)
# See esphome_adoption_guide.md — Avatar plugs require USB-serial adapter,
# 3.3V only, GPIO0 pulled to GND during power-on to enter flash mode.
#
# ESP8266 cannot use ESPHome's MQTT CA validation. This plug therefore uses
# the encrypted native ESPHome API only; HA initiates control over port 6053.
# SECRETS: wifi_ssid, wifi_pass, api_key, ota_password

substitutions:
  device_name: ventsys-plug-uv-1
  friendly_name: "VentSys UV Station 1 Plug"
  device_ip: "192.168.50.73"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  min_auth_mode: WPA2
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0
  ap:
    ssid: "VentSys UV1 FB"
    password: !secret ota_password

captive_portal:

output:
  - platform: gpio
    id: led
    pin:
      number: GPIO2
      inverted: true

switch:
  - platform: gpio
    name: "Relay"
    id: relay
    pin: GPIO15
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - output.turn_on: led
    on_turn_off:
      - output.turn_off: led

binary_sensor:
  - platform: gpio
    name: "Button"
    id: button
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "Status"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: diagnostic
  - platform: uptime
    name: Uptime

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"
