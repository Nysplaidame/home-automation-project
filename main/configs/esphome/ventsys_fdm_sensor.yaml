# Installed FDM sensor (owner identity correction November4), MAC cc:ba:97:f0:d0:c0 at 192.168.50.32.
# Hardware source recovered from HA esphome/archive/printairpipe-controller.yaml
# and archive/ventsys-sla-sensor.yaml (June 16 build): ESP32-C6, SDA GPIO4,
# SCL GPIO5, BME680 0x77, analog gas ADC GPIO3, plain status LED GPIO2.
# Owner identified the fitted GPIO3 component as CO on 2026-11-08. This legacy
# firmware still names it smoke and applies an uncalibrated raw threshold;
# verify the exact module and revise the channel before relying on its alarm.
# Preserve this installed-board layout during maintenance. The shared modern
# carrier package is for different/new hardware, not a pin-compatible upgrade.
# .32 conflicts with planned FDM array 2; resolve that allocation before adoption.
# 2026-10-10: board management + uptime + BME validity diagnostic only.
# ESPHome — PrintAirPipe Enclosure Sensor Controller
# Device: ESP32 (one per enclosure)
# Network: VLAN 50 (IoT Sensors) — 192.168.50.0/24
# SSID: HomeIoT
#
# This config covers the SENSOR board for a single enclosure.
# Fan control: ventsys_fan_controller.yaml (IP: 192.168.50.21)
# Valve control: ventsys_valve_controller.yaml (IP: 192.168.50.56)
#
# One instance of this config per enclosure:
#   FDM enclosure sensor board: IP 192.168.50.31 — name: ventsys-fdm-sensor
#   SLA enclosure sensor board: IP 192.168.50.32 — name: ventsys-sla-sensor
#
# HARDWARE PINS — update after physical wiring:
#   Enclosure temperature: BME680 temperature reading
#   BME680 (temp/humidity/pressure/IAQ gas): SDA=GPIO4, SCL=GPIO5 (I2C)
#     ESP32-C6 Zero note: GPIO6-GPIO10 are not physically accessible on this board.
#   MQ-2 / MQ-135 smoke+VOC or MEMS analog output: GPIO3 (ADC1 — 3.3V max)
#   Pressure differential sensor: not wired on first C6 sensor board
#   Status LED: GPIO2 (built-in on most dev boards)
#
# See: esphome_adoption_guide.md for first-flash and adoption workflow

substitutions:
  device_name: ventsys-fdm-sensor
  friendly_name: "FDM Enclosure Sensor"
  device_ip: "192.168.50.32"
  mqtt_topic_prefix: "ventsys/fdm"
  # N-2 fix: temp_threshold substitution allows per-board override without modifying shared firmware.
  # FDM board: 55.0 (default). SLA board: override to 40.0 in ventsys_sla_sensor.yaml.
  # Resin enclosures need lower threshold -- SLA resin fumes are flammable at lower temps.
  temp_threshold: "40.0" # Existing conservative threshold retained pending commissioning.

globals:
  - id: installed_bme_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid       # HomeIoT
  password: !secret wifi_pass
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0

mqtt:
  broker: 192.168.20.101
  port: 8883                    # A9-7 fix: comment was backwards. Stage 1 (pre-TLS): change to 1883 for initial bring-up. Stage 2: revert to 8883. Ships as 8883 (post-TLS default).
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  certificate_authority: !secret mqtt_ca_cert
  on_connect:
    - mqtt.publish:
        topic: "ventsys/fdm/array_1/fault"
        payload: !lambda 'return std::string(id(installed_sensor_fault).state ? "fault" : "ok");'
        retain: true

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:  # Retain encrypted OTA from the current maintenance build.

logger:
  level: WARN

# ── TIME SYNC ────────────────────────────────────────────────────────────────
# Required for MQTT TLS certificate validation.
# ESP32 boots at 1970-01-01 (no hardware RTC). Without time sync, the TLS
# handshake fails because certificates appear issued in the future.
# Syncs from HA via the native API — no NTP server or internet access required.
# A6-1 fix: pattern established by ventsys_fdm_airflow.yaml, now applied here.
time:
  - platform: homeassistant
    id: homeassistant_time

# ── STATUS LED ───────────────────────────────────────────────────────────────
status_led:
  pin:
    number: GPIO2
    inverted: false

# ── I2C BUS (BME680) ─────────────────────────────────────────────────────────
i2c:
  sda: GPIO4
  scl: GPIO5
  scan: false

# ── SENSORS ──────────────────────────────────────────────────────────────────
sensor:
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  # Humidity + barometric pressure + IAQ gas resistance (BME680 — I2C)
  # BME680 provides temperature, humidity, pressure, and gas resistance.
  #
  # IAQ source: gas_resistance published to ${mqtt_topic_prefix}/iaq (ohms).
  # Higher resistance = cleaner air. HA can invert/scale for display.
  # Note: Bosch's proprietary BSEC2 library gives a 0-500 IAQ score but
  # requires the ESPHome bsec2 component and a licence agreement. Raw gas
  # resistance is used here to avoid that dependency — it carries the same
  # information and can be processed in HA or Node-RED if needed.
  #
  # MQ sensor role: fast combustion/smoke alarm ONLY (binary, not IAQ).
  # The two sensors are complementary — BME680 for air quality trend,
  # MQ for rapid threshold detection.
  - platform: bme680
    address: 0x77   # SDO tied HIGH; use 0x76 if SDO is tied to GND
    update_interval: 30s

    temperature:
      name: "${friendly_name} Temperature"
      id: enclosure_temperature
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
      on_value:
        then:
          - lambda: 'id(installed_bme_last_ms) = millis();'
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/temperature"
              payload: !lambda 'return to_string(x);'

    humidity:
      name: "${friendly_name} Humidity"
      id: enclosure_humidity
      unit_of_measurement: "%"
      accuracy_decimals: 1
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/humidity"
              payload: !lambda 'return to_string(x);'

    pressure:
      name: "${friendly_name} Pressure"
      id: enclosure_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/baro_pressure"
              payload: !lambda 'return to_string(x);'
      # Absolute barometric pressure — used by ventsys_ha_optional.yaml to
      # compute differential vs. garage ambient (ventsys/garage/baro_pressure).
      # Separate from the ADC airflow proxy below (blocked valve detection).

    gas_resistance:
      name: "${friendly_name} IAQ Gas Resistance"
      id: gas_resistance
      unit_of_measurement: "Ω"
      accuracy_decimals: 0
      filters:
        - filter_out: nan
        - sliding_window_moving_average:
            window_size: 3
            send_every: 1
      on_value:
        then:
          - mqtt.publish:
              topic: "${mqtt_topic_prefix}/iaq"
              payload: !lambda 'return to_string((int)x);'
      # Requires ~5 min warm-up after boot before readings stabilise.
      # BME680 gas resistance drifts — allow 30 min for stable baseline.

  # MQ smoke/combustion sensor or MEMS analog sensor on ESP32-C6 ADC1.
  # Role: fast binary smoke alarm ONLY. IAQ is handled by BME680 gas_resistance above.
  # MQ sensors need 24-48h burn-in time before alarm thresholds are meaningful.
  - platform: adc
    pin: GPIO3
    name: "${friendly_name} Smoke VOC Raw"
    id: smoke_voc_raw
    unit_of_measurement: "raw"
    accuracy_decimals: 0
    update_interval: 5s
    attenuation: auto
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
    # No MQTT publish here — raw ADC value feeds the binary_sensor below only.

# ── BINARY SENSORS ───────────────────────────────────────────────────────────
binary_sensor:
  # Publish validity for the current FDM array-1 fault topic as well as the
  # retained legacy sensor topics. Missing BME data must not imply safety.
  - platform: template
    name: "sensor_fault"
    id: installed_sensor_fault
    device_class: problem
    lambda: 'return id(installed_bme_last_ms) == 0 || (millis() - id(installed_bme_last_ms)) > 90000UL;'
    on_state:
      - mqtt.publish:
          topic: "ventsys/fdm/array_1/fault"
          payload: !lambda 'return std::string(x ? "fault" : "ok");'
          retain: true

  # Smoke alarm — fires when ADC exceeds threshold
  # Default threshold 2000 (~2.4V on 3.3V ADC) — calibrate in clean air first
  - platform: template
    name: "${friendly_name} Smoke Detected"
    id: smoke_alarm
    lambda: 'return id(smoke_voc_raw).state > 2000;'
    device_class: smoke
    filters:
      - delayed_on: 3s       # Require 3 continuous seconds to avoid false triggers
      - delayed_off: 10s     # Keep alarm for 10s after value drops below threshold
    on_press:
      then:
        - mqtt.publish:
            topic: "${mqtt_topic_prefix}/smoke"
            payload: "detected"
    on_release:
      then:
        - mqtt.publish:
            topic: "${mqtt_topic_prefix}/smoke"
            payload: "clear"

  # High temperature alarm — > 55°C for FDM, > 40°C for SLA
  # This config uses 55°C (FDM). Change to 40 in the SLA board substitution.
  - platform: template
    name: "${friendly_name} High Temperature"
    id: high_temp_alarm
    lambda: 'return id(enclosure_temperature).state > ${temp_threshold}f;'  # N-2 fix: use substitution so SLA board can override to 40.0
    device_class: heat
    filters:
      - delayed_on: 10s
    on_press:
      then:
        - mqtt.publish:
            topic: "${mqtt_topic_prefix}/temp_alarm"
            payload: "high"
    on_release:
      then:
        - mqtt.publish:
            topic: "${mqtt_topic_prefix}/temp_alarm"
            payload: "normal"

  # ESPHome API connectivity status (published for HA watchdog)
  - platform: status
    name: "${friendly_name} Status"
    id: device_status

# ── TEXT SENSORS ─────────────────────────────────────────────────────────────
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP"
    ssid:
      name: "${friendly_name} SSID"
    bssid:
      name: "${friendly_name} BSSID"

# ── INTERVAL: publish all readings to MQTT on boot ───────────────────────────
interval:
  - interval: 60s
    then:
      - mqtt.publish:
          topic: "${mqtt_topic_prefix}/online"
          payload: "true"

# ── SECRETS REQUIRED IN secrets.yaml ────────────────────────────────────────
# wifi_ssid: "HomeIoT"
# wifi_pass: "your-homeiot-password"
# mqtt_user: "mqtt"
# mqtt_pass: "your-mqtt-password"
# mqtt_ca_cert: |
#   -----BEGIN CERTIFICATE-----
#   ... (contents of ca.crt from local CA)
#   -----END CERTIFICATE-----
# api_key: "your-32-byte-base64-api-key"   # generate: openssl rand -base64 32
# ota_password: "your-ota-password"

packages:
  board_management: !include ventsys_board_management.yaml
