# VentSys Smart Plug — Avatar AWP02L2
# Device: plug-wash-cure  IP: 192.168.50.75  VLAN 50
# Hardware: ESP8266 (esp01_1m board), NO energy monitoring hardware
# Controls: Wash and cure station power
# See ventsys_plug_uv1.yaml for full notes and flash method.

substitutions:
  device_name: ventsys-plug-wash-cure
  friendly_name: "VentSys Wash Cure Plug"
  device_ip: "192.168.50.75"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  min_auth_mode: WPA2
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.50.1
    subnet: 255.255.255.0
  ap:
    ssid: "VentSys WashCure FB"
    password: !secret ota_password

captive_portal:

output:
  - platform: gpio
    id: led
    pin:
      number: GPIO2
      inverted: true

switch:
  - platform: gpio
    name: "Relay"
    id: relay
    pin: GPIO15
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - output.turn_on: led
    on_turn_off:
      - output.turn_off: led

binary_sensor:
  - platform: gpio
    name: "Button"
    id: button
    pin:
      number: GPIO13
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay
  - platform: status
    name: "Status"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: diagnostic
  - platform: uptime
    name: Uptime

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "SSID"
