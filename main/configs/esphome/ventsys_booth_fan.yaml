# VentSys Spray Booth Extract Fan Controller
# Device: ventsys-booth-fan  IP: 192.168.50.22  VLAN 50
# MQTT topics: ventsys/spray-fan/control, ventsys/spray-fan/percent
# Subscribes to spray-fan topics (separate from main inline fan).
# Hardware identical to main fan controller (ESP32 + PWM MOSFET driver).
# PRE-TLS: Change mqtt.port to 1883 and remove ca_certificate before first flash.
# F-23 fix: name updated to match DHCP hostname in dhcp-config.conf.
# ESPHome `name` sets the mDNS hostname (ventsys-booth-fan.local) which HA uses
# to connect via the native API. A mismatch means HA cannot discover or connect
# to the device, and the ESPHome integration silently shows it as unavailable.
esphome:
  name: ventsys-booth-fan
  friendly_name: VentSys Booth Fan
esp32:
  board: esp32dev

mqtt:
  broker: 192.168.20.101   # HA on VLAN 20 — firewall allows iot_sensors→automation:8883
  port: 8883
  username: !secret mqtt_user
  password: !secret mqtt_pass
  discovery: false
  # Local CA certificate for TLS validation (no internet dependency)
  # Copy ca-cert.pem content into secrets.yaml as mqtt_ca_cert
  certificate_authority: !secret mqtt_ca_cert
  on_message:
    - topic: ventsys/spray-fan/percent
      qos: 0
      then:
        - lambda: |-
            int pct = atoi(x.c_str());
            if (pct < 0) pct = 0; if (pct > 100) pct = 100;
            id(inline_fan_local).set_speed(pct);
            id(inline_fan_local).turn_on();
        - mqtt.publish:
            topic: ventsys/spray-fan/percent_state
            payload: !lambda 'return x;'
    - topic: ventsys/spray-fan/control
      qos: 0
      then:
        - lambda: |-
            if (x == "on") id(inline_fan_local).turn_on();
            else if (x == "off") id(inline_fan_local).turn_off();
        # Publish state back so HA fan entity state_topic receives on/off.
        # Without this ventsys/fan/state is never published and HA shows 'unknown'.
        - mqtt.publish:
            topic: ventsys/spray-fan/state
            payload: !lambda 'return x;'
            retain: true

logger:

# ── TIME SYNC ────────────────────────────────────────────────────────────────
# Required for MQTT TLS certificate validation — ESP32 boots at 1970-01-01.
# A6-1 fix: added to match pattern established by ventsys_fdm_airflow.yaml.
time:
  - platform: homeassistant
    id: homeassistant_time

api:
  encryption:
    key: !secret api_key   # Required — prevents unauthenticated native API access

ota:
  platform: esphome
  password: !secret ota_password   # Required — prevents unauthorized firmware push

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  # A4-2 fix: corrected stale comment (was copied from main fan controller).
  # Booth fan static IP is 192.168.50.22 (ventsys-booth-fan). It was never at .81.
  # The DHCP reservation in dhcp-config.conf confirms .22 as the canonical address.
  manual_ip:
    static_ip: 192.168.50.22
    gateway: 192.168.50.1
    subnet: 255.255.255.0

output:
  - platform: ledc
    id: fan_pwm
    pin: GPIO23
    frequency: 25000Hz   # No space — ESPHome frequency parser requires no whitespace

fan:
  - platform: speed
    output: fan_pwm
    name: "Inline Fan (local)"
    id: inline_fan_local
    speed_count: 100

# A6-8 fix: binary_sensor.status added to match the pattern from ventsys_fan_controller.yaml
# and ventsys_valve_controller.yaml. Required for HA watchdog automations to monitor
# this device. Entity ID generated by HA native API integration:
#   ventsys-booth-fan + "Status" -> binary_sensor.ventsys_booth_fan_status
binary_sensor:
  - platform: status
    name: "Status"

