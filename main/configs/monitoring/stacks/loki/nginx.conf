server {
  listen 3101;
  server_name _;

  location / {
    proxy_pass https://loki:3100;
    proxy_ssl_server_name on;
    proxy_ssl_name loki.monitoring.home.local;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_certificate /etc/nginx/certs/grafana.crt;
    proxy_ssl_certificate_key /etc/nginx/certs/grafana.key;
    proxy_http_version 1.1;
  }
}
