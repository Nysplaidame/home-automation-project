# Local AI LXC — Docker Compose
# Host: CT 114 / llm-host (192.168.20.104, VLAN 20)
# Deploy to: /opt/stacks/local-ai/docker-compose.yml

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_THREADS=4
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_IGPU_ENABLE=1

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3002:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://192.168.20.102:8087/search?q=<query>&format=json
      - RAG_WEB_SEARCH_RESULT_COUNT=3
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
    volumes:
      - ./open-webui:/app/backend/data

  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper
    restart: unless-stopped
    ports:
      - "10300:10300"
    command: ["--model", "base-int8", "--language", "en"]
    environment:
      # VLAN 20 has no internet egress. Keep the tokenizer cache under /data
      # and force deterministic offline startup.
      - HF_HOME=/data/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - ./whisper:/data

  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    command: ["--voice", "en_GB-alba-medium"]
    volumes:
      - ./piper:/data

  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: wyoming-openwakeword
    restart: unless-stopped
    ports:
      - "10400:10400"
    volumes:
      - ./openwakeword:/custom
