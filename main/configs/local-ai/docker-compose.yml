# Local AI LXC — Docker Compose
# Host: CT 114 / llm-host (192.168.20.104, VLAN 20)
# Deploy to: /opt/stacks/local-ai/docker-compose.yml

services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-cpp
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    # Qwen3-30B-A3B (MoE, ~3B active) since 2026-11-13: ~2.7x faster generation than the 14B on this iGPU.
    # Flags are the ones validated in HANDOFF-2026-11-11-llm-igpu-speed.md:
    # - f16 KV cache: +16% prompt speed over q8_0 (prompt processing dominates voice latency).
    # - ctx 40960 is the model's training length; one slot, so the whole window is for one conversation.
    # - --cache-ram caps llama.cpp's host-RAM prompt cache. The default (8 GiB) would OOM this 28 GiB CT
    #   with the 30B loaded; 1 GiB holds about one 6.5k-token voice prompt.
    # Rollback: model Qwen3-14B-128K-Q4_K_M.gguf, ctx 65536, KV q8_0, drop --cache-ram, then
    #   `docker compose up -d llama-cpp` (the 14B file is kept in ./models).
    command:
      - --model
      - /models/Qwen3-30B-A3B-Q4_K_M.gguf
      - --alias
      - home-assistant-llm
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "40960"
      - --threads
      - "4"
      - --parallel
      - "1"
      - --cache-type-k
      - f16
      - --cache-type-v
      - f16
      - --cache-ram
      - "1024"
      - --n-gpu-layers
      - "99"
      - --reasoning
      - "off"
      - --jinja

  llama-cpp-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    container_name: llama-cpp-embeddings
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./models:/models:ro
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    command:
      - --model
      - /models/bge-small-en-v1.5-q8_0.gguf
      - --alias
      - home-assistant-embedding
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "512"
      - --threads
      - "2"
      - --threads-http
      - "2"
      - --parallel
      - "1"
      - --batch-size
      - "128"
      - --ubatch-size
      - "128"
      - --n-gpu-layers
      - "0"
      - --embedding
      - --pooling
      - mean

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - llama-cpp
    ports:
      - "3002:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llama-cpp:8080/v1
      - OPENAI_API_KEY=sk-no-key-required
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://192.168.20.102:8087/search?q=<query>&format=json
      - RAG_WEB_SEARCH_RESULT_COUNT=3
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
    volumes:
      - ./open-webui:/app/backend/data

  wyoming-whisper:
    image: rhasspy/wyoming-whisper:latest
    container_name: wyoming-whisper
    restart: unless-stopped
    ports:
      - "10300:10300"
    # Parakeet TDT 0.6B v2 int8 via sherpa-onnx (2026-11-05): ~0.2 s/command vs ~1.1 s and fewer
    # errors than faster-whisper base-int8. Model is pre-placed in ./whisper (no egress).
    # Rollback: ["--model", "base-int8", "--language", "en", "--debug"]
    command: ["--stt-library", "sherpa", "--language", "en", "--local-files-only", "--debug"]
    environment:
      # VLAN 20 has no internet egress. Keep the tokenizer cache under /data
      # and force deterministic offline startup.
      - HF_HOME=/data/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - ./whisper:/data

  wyoming-piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    command:
      [
        "--voice",
        "en_GB-alba-medium",
        "--auto-punctuation",
        ".",
        "--debug",
      ]
    volumes:
      - ./piper:/data

  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: wyoming-openwakeword
    restart: unless-stopped
    ports:
      - "10400:10400"
    command: ["--debug", "--custom-model-dir", "/custom"]
    volumes:
      - ./openwakeword:/custom
