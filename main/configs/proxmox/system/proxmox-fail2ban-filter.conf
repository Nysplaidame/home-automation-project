# Fail2ban filter for Proxmox VE web UI / API authentication failures.
# Deploy to /etc/fail2ban/filter.d/proxmox.conf
#
# Debian trixie's fail2ban 1.1.0-8 ships NO stock `proxmox` filter, despite
# upstream having one. Without this file the [proxmox] jail fails
# `fail2ban-client -t` with "Found no accessible config files for
# 'filter.d/proxmox'".
#
# The `__prefix_line` include matters. With the systemd backend fail2ban sees
# `proxmox pvedaemon[2350343]: authentication failure; rhost=...` — the
# HOSTNAME precedes the daemon name, so a regex anchored directly on
# `^pvedaemon\[` matches nothing. common.conf's `__prefix_line` handles the
# hostname/daemon/pid prefix correctly.
#
# Scoping to `_daemon = pvedaemon` also avoids double-counting: the same
# failure is logged a second time by `IPCC.xs` via pam_unix under the same
# systemd unit, which would otherwise halve the effective maxretry.
#
# Verified 2026-07-31 against the live journal: 21 matched, 0 missed among
# real authentication-failure lines.
#
# NOT currently enabled — see proxmox-fail2ban.local for why the web-UI jail is
# deferred while the UI is reverse-proxied through docker-host.

[INCLUDES]
before = common.conf

[Definition]
_daemon = pvedaemon
failregex = ^%(__prefix_line)sauthentication failure; rhost=<HOST> user=.*$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=pvedaemon.service
