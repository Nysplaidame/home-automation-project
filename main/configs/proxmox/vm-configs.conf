# Backup schedule (Datacenter > Backup):
#   VMs: 100, 101, 102, 103
#   Add VM 104 after Phase 05A is deployed and local AI performance testing passes.
#   Schedule: 02:00 daily
#   Mode: Snapshot
#   Compression: ZSTD
#   Retention: 2 backups while backups are local/pre-NAS

# Storage pools:
#   local:      ISOs and snippets
#   local-lvm:  VM disks (thin-provisioned LVM)
