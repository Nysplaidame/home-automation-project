# Proxmox VM Configurations
# Host: 192.168.10.10 — VLAN 10 (Management)
# Hardware: MINISFORUM M1 Pro-125H (Intel Core Ultra 5 125H, 32GB RAM, 1TB NVMe)
#
# These are the expected outputs of `qm config <vmid>` after setup.
# Use as reference to verify VMs are configured correctly.
# Full deployment steps: scripts/setup/proxmox/

# ============================================================================
# VM 100 — Home Assistant OS
# Network: VLAN 20 (Automation) — 192.168.20.101
# Setup guide: scripts/setup/proxmox/ha_vm_setup_guide.md
# ============================================================================

# --- qm config 100 expected output ---
#
# boot: order=scsi0
# cores: 2
# cpu: host
# efidisk0: local-lvm:vm-100-disk-0,efitype=4m,pre-enrolled-keys=0,size=4M
# machine: pc-q35-8.1
# memory: 4096
# meta: creation-qemu=8.1.0,ctime=<timestamp>
# name: home-assistant
# net0: virtio=XX:XX:XX:XX:XX:XX,bridge=vmbr0,tag=20
# numa: 0
# onboot: 1
# ostype: l26
# scsi0: local-lvm:vm-100-disk-1,cache=writeback,discard=on,ssd=1,size=32G
# scsihw: virtio-scsi-single
# smbios1: uuid=<uuid>
# sockets: 1
# startup: order=1
# tablet: 0
# vga: serial0
# vmgenid: <uuid>

[vm-100]
name = home-assistant
vlan = 20
ip = 192.168.20.101
os = haos
machine = q35
bios = ovmf
cpu_sockets = 1
cpu_cores = 2
cpu_type = host
memory_mb = 4096
ballooning = 0
disk_storage = local-lvm
disk_size_gb = 32
disk_cache = writeback
disk_discard = on
disk_ssd = on
boot_order = scsi0
onboot = 1
startup_order = 1
network_bridge = vmbr0
network_vlan = 20
network_model = virtio
network_firewall = 0
mac_address = BC:24:11:8D:49:0B

