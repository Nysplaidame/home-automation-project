# Frigate NVR Configuration
# Host: 192.168.30.20 — VLAN 30 (NVR)
# Deployed via: /opt/frigate/config/config.yml on CT 111 (frigate-nvr)
# See: scripts/setup/proxmox/frigate_vm_setup_guide.md
#
# Migration-safe baseline:
# - MQTT is disabled until final HA broker credentials and CA material are ready.
# - Cameras are empty until camera models, credentials and RTSP paths are real.
# - OpenVINO/VA-API remain configured so CT 111 hardware acceleration is ready.

mqtt:
  enabled: false

database:
  path: /db/frigate.db

detectors:
  ov:
    type: openvino
    device: GPU

# Frigate 0.17 requires an explicit model path for OpenVINO. These files are
# bundled in the stable image.
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr

ffmpeg:
  hwaccel_args: preset-vaapi

record:
  enabled: true
  retain:
    days: 7
    mode: motion
  events:
    retain:
      default: 14
      mode: active_objects

snapshots:
  enabled: true
  retain:
    default: 14

cameras: {}
