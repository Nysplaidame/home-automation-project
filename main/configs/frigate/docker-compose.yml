# Frigate LXC — Docker Compose
# Host: CT 111 / frigate-nvr (192.168.30.20, VLAN 30 — NVR)
# Deploy to: /opt/frigate/docker-compose.yml
#
# Services:
#   frigate — NVR, cameras, object detection
#
# Bambuddy runs as a workload on docker-host, VM 103 (192.168.20.102, VLAN 20).
# See scripts/setup/proxmox/bambuddy_vm_setup_guide.md for Bambuddy deployment.
# See docs/decisions/02-printer-vlan-architecture.md for the rationale.

services:

  # ──────────────────────────────────────────────────────────────────────────
  # FRIGATE NVR
  # Web UI: https://192.168.30.20:8971 (Frigate 0.14+)
  # ──────────────────────────────────────────────────────────────────────────
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    network_mode: host
    shm_size: "256mb"
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
      - FRIGATE_GATE_RTSP_PASSWORD_URLENCODED=${FRIGATE_GATE_RTSP_PASSWORD_URLENCODED}
      - FRIGATE_PATIO_RTSP_PASSWORD_URLENCODED=${FRIGATE_PATIO_RTSP_PASSWORD_URLENCODED}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
    volumes:
      - /opt/frigate/config:/config
      - /opt/frigate/storage:/media/frigate
      - /opt/frigate/db:/db
      # NAS recording mount from OMV via Proxmox host bind mount.
      - /mnt/nas/frigate:/media/frigate/recordings
      - /etc/localtime:/etc/localtime:ro
      - /opt/frigate/certs:/config/certs:ro
      - /opt/frigate/tls:/etc/letsencrypt/live/frigate:ro
    # Shared Intel iGPU: render node for VA-API/OpenVINO and card node for
    # OpenVINO device discovery. Proxmox maps both into unprivileged CT 111.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    tmpfs:
      - /tmp/cache

# ──────────────────────────────────────────────────────────────────────────
# NOTES
# ──────────────────────────────────────────────────────────────────────────
#
# BEFORE FIRST START:
#   mkdir -p /opt/frigate/db
#   mkdir -p /opt/frigate/certs
#   mkdir -p /opt/frigate/tls
#   Set the following in /opt/frigate/.env:
#     FRIGATE_RTSP_PASSWORD=<camera password>
#     FRIGATE_GATE_RTSP_PASSWORD_URLENCODED=<URL-encoded Gate camera password>
#     FRIGATE_PATIO_RTSP_PASSWORD_URLENCODED=<URL-encoded Patio camera password>
#     FRIGATE_MQTT_PASSWORD=<mosquitto mqtt user password>
#
# STARTING:
#   docker compose up -d
#   docker compose logs frigate -f
#
# UPDATING:
#   docker compose pull && docker compose up -d
#
# VOLUMES:
#   /opt/frigate/db/          Frigate SQLite database (event history, snapshots)
#   /opt/frigate/storage/     Local Frigate media root for non-recording data
#   /opt/frigate/certs/       CA cert for MQTT TLS validation
#   /opt/frigate/tls/         Frigate HTTPS cert/key mounted at
#                             /etc/letsencrypt/live/frigate
#
# NAS RECORDING MOUNT:
#   /mnt/nas/frigate is a bind mount into unprivileged CT 111 from a
#   Proxmox-host OMV NFS mount. Do not mount NFS directly inside CT 111.
#   The OMV export must allow the CT root-mapped host UID 100000 to write.
#
# PORTS (host networking):
#   8971  — authenticated Frigate UI/API; project TLS is enabled
#   5000  — internal unauthenticated API; expose only to approved HA/monitoring sources
#   8554  — RTSP restream
#   8555  — WebRTC
