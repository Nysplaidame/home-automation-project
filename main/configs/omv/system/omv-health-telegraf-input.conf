# PREPARED INPUT ONLY: for a dedicated unprivileged OMV-local consumer.
# Do not copy into the monitoring VM's agent: these paths belong to OMV.
# Source scripts must be immutable root-owned; consumer only reads snapshot.json.
# No output, credential, bucket, TLS or service activation is configured here.
[[inputs.exec]]
  commands = ["/usr/bin/python3 -B /usr/local/libexec/home-automation/omv-health-metrics.py /var/lib/home-automation/omv-health/snapshot.json"]
  interval = "60s"
  timeout = "5s"
  ignore_error = false
  data_format = "prometheus"
  prometheus_metric_version = 2
  name_override = "omv_health"
  [inputs.exec.tags]
    source = "omvnas"
    schema = "omv-health/1.0"
