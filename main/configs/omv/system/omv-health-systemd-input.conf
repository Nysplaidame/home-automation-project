# PREPARED companion input for the OMV-local consumer, not monitoring VM.
# Requires accepted read-only host system D-Bus access. No socket mount/privilege
# changes are made by this fragment. Missing/denied observations mean unknown.
[[inputs.systemd_units]]
  pattern = "omv-health-snapshot.service"
  unittype = "service"
  scope = "system"
  collect_disabled_units = true
  details = false
  interval = "60s"
  timeout = "5s"
  name_override = "omv_health_unit"
  [inputs.systemd_units.tags]
    source = "omvnas"

[[inputs.systemd_units]]
  pattern = "omv-health-snapshot.timer"
  unittype = "timer"
  scope = "system"
  collect_disabled_units = true
  details = false
  interval = "60s"
  timeout = "5s"
  name_override = "omv_health_unit"
  [inputs.systemd_units.tags]
    source = "omvnas"
