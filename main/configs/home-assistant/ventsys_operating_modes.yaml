    - variables:
        current: '{{ states(''input_text.ventsys_operating_state'') | from_json({''fdm'':''off'',''sla'':''off'',''booth'':''off'',''revision'':0})
          }}'
    - variables:
        current_key: '{{ current.fdm | default(''invalid'') ~ ''|'' ~ current.sla | default(''invalid'') ~ ''|'' ~ current.booth
          | default(''invalid'') }}'
        request_key: '{{ zone | default(''invalid'') ~ '':'' ~ operation | default(''invalid'') }}'
    - if:
      - condition: template
        value_template: '{{ not (is_state(''input_boolean.ventsys_failsafe'',''off'') and is_state(''script.ventsys_mode_fire_safe'',''off''))
          }}'
      then:
      - stop: Failsafe active/unknown or fire response running
        error: true
    - if:
      - condition: template
        value_template: '{{ not is_state(''script.ventsys_normal_command'',''off'') or not is_state(''script.ventsys_dashboard_command'',''off'')
          or not is_state(''script.ventsys_test_valves'',''off'') or not is_state(''script.ventsys_record_intake_reference'',''off'')
          }}'
      then:
      - stop: Another command is running
        error: true
    - if:
      - condition: template
        value_template: '{{ current_key not in plans or request_key not in plans.get(current_key,{}) or revision is not integer
          or revision != current.revision | default(-1) or states(''input_text.ventsys_operating_state'') not in ['''', ''unknown'']
          and states(''input_text.ventsys_operating_state'') | from_json(none) is none or operation == ''purge'' and (strength
          | default(none) is not integer or strength not in [2,4,6,8,10]) or operation != ''purge'' and strength | default(none)
          is not none }}'
      then:
      - stop: Invalid or stale mode request; choose a valid purge strength and refresh controller state
        error: true
    - variables:
        plan: '{%- set base=plans[current_key][request_key] -%}

          {%- set f=(strength if zone in [''fdm'',''both''] else current.fdm_strength | default(6)) if base.desired.fdm ==
          ''purge'' else 0 -%}

          {%- set s=(strength if zone in [''sla'',''both''] else current.sla_strength | default(6)) if base.desired.sla ==
          ''purge'' else 0 -%}

          {%- set percent=([f,s] | max) * 10 -%}{%- set ns=namespace(phases=[]) -%}

          {%- for phase in base.phases -%}{%- set ns.phases=ns.phases + [dict({''fan_main_speed'':percent}, **phase) if percent
          > 0 and phase.get(''fan_main'') == ''on'' else phase] -%}{%- endfor -%}

          {{- {''desired'':dict(base.desired,fdm_strength=f,sla_strength=s), ''targets'':dict(base.targets, **({''fan_main_speed'':percent}
          if percent > 0 else {})), ''phases'':ns.phases} -}}'
    - variables:
        expected: '{{ plan.targets }}'
    - variables:
        blocked: "{%- set ns = namespace(reason='') -%}\n{%- for key, desired in expected.items() -%}\n  {%- set speed = key.endswith('_speed')\
          \ -%}{%- set device = controls[key[:-6] if speed else key] -%}\n  {%- set chosen = namespace(id=device.entity, adopted=false)\
          \ -%}\n  {%- for native in device.native -%}{%- if not chosen.adopted and states[native] is not none -%}{%- set\
          \ chosen.id=native -%}{%- set chosen.adopted=true -%}{%- endif -%}{%- endfor -%}\n  {%- set report = states[chosen.id]\
          \ -%}\n  {%- if report is none or report.state in ['unknown','unavailable','none',''] -%}{%- set ns.reason='Controller\
          \ unavailable: ' ~ device.name -%}\n  {%- elif device.fan | default(false) and report.state not in ['on','off']\
          \ -%}{%- set ns.reason='Invalid fan state: ' ~ device.name -%}\n  {%- elif not device.fan | default(false) and not\
          \ is_number(report.state) -%}{%- set ns.reason='Invalid position report: ' ~ device.name -%}\n  {%- elif not device.fan\
          \ | default(false) and not chosen.adopted -%}{%- set ns.reason='Native controller not adopted: ' ~ device.name -%}\n\
          \  {%- elif not device.fan | default(false) and (desired | float < report.attributes.get('min',0) | float or desired\
          \ | float > report.attributes.get('max',100) | float) -%}{%- set ns.reason='Target exceeds firmware range: ' ~ device.name\
          \ -%}\n  {%- elif speed and report.attributes.get('percentage') is none -%}{%- set ns.reason='Fan percentage unavailable:\
          \ ' ~ device.name -%}{%- endif -%}\n{%- endfor -%}{{- ns.reason -}}"
    - if:
      - condition: template
        value_template: '{{ blocked | trim != "" }}'
      then:
      - stop: '{{ blocked }}'
        error: true
    - if:
      - condition: template
        value_template: '{%- set ns=namespace(bad=false) -%}{%- for key,value in expected.items() -%}{%- if key.startswith(''fan_'')
          and value == ''on'' and key ~ ''_speed'' not in expected -%}{%- set report=states[controls[key].entity] -%}{%- if
          report is none or report.attributes.get(''percentage'',0) | float(0) <= 0 -%}{%- set ns.bad=true -%}{%- endif -%}{%-
          endif -%}{%- endfor -%}{{- ns.bad -}}'
      then:
      - stop: Set a nonzero extraction fan speed before starting this mode
        error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.ventsys_operating_state
      data:
        value: '{{ dict(plan.desired, revision=current.revision + 1) | to_json }}'
    - action: input_text.set_value
      target:
        entity_id: input_text.ventsys_operating_result
      data:
        value: Applying; controller reports pending
    - repeat:
        for_each: '{{ plan.phases }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ not (is_state(''input_boolean.ventsys_failsafe'',''off'') and is_state(''script.ventsys_mode_fire_safe'',''off''))
              }}'
          then:
          - stop: Emergency interrupted operating transition
            error: true
        - variables:
            expected: '{{ repeat.item }}'
        - variables:
            blocked: "{%- set ns = namespace(reason='') -%}\n{%- for key, desired in expected.items() -%}\n  {%- set speed\
              \ = key.endswith('_speed') -%}{%- set device = controls[key[:-6] if speed else key] -%}\n  {%- set chosen =\
              \ namespace(id=device.entity, adopted=false) -%}\n  {%- for native in device.native -%}{%- if not chosen.adopted\
              \ and states[native] is not none -%}{%- set chosen.id=native -%}{%- set chosen.adopted=true -%}{%- endif -%}{%-\
              \ endfor -%}\n  {%- set report = states[chosen.id] -%}\n  {%- if report is none or report.state in ['unknown','unavailable','none','']\
              \ -%}{%- set ns.reason='Controller unavailable: ' ~ device.name -%}\n  {%- elif device.fan | default(false)\
              \ and report.state not in ['on','off'] -%}{%- set ns.reason='Invalid fan state: ' ~ device.name -%}\n  {%- elif\
              \ not device.fan | default(false) and not is_number(report.state) -%}{%- set ns.reason='Invalid position report:\
              \ ' ~ device.name -%}\n  {%- elif not device.fan | default(false) and not chosen.adopted -%}{%- set ns.reason='Native\
              \ controller not adopted: ' ~ device.name -%}\n  {%- elif not device.fan | default(false) and (desired | float\
              \ < report.attributes.get('min',0) | float or desired | float > report.attributes.get('max',100) | float) -%}{%-\
              \ set ns.reason='Target exceeds firmware range: ' ~ device.name -%}\n  {%- elif speed and report.attributes.get('percentage')\
              \ is none -%}{%- set ns.reason='Fan percentage unavailable: ' ~ device.name -%}{%- endif -%}\n{%- endfor -%}{{-\
              \ ns.reason -}}"
        - if:
          - condition: template
            value_template: '{{ blocked | trim != "" }}'
          then:
          - stop: '{{ blocked }}'
            error: true
        - action: script.ventsys_normal_command
          data:
            operating: true
            commands: '{%- set ns=namespace(batch=[]) -%}{%- for key,value in expected.items() -%}{%- set speed=key.endswith(''_speed'')
              -%}{%- set device=controls[key[:-6] if speed else key] -%}{%- set ns.batch=ns.batch + [{''topic'':device.speedTopic
              if speed else device.topic,''payload'':value | string}] -%}{%- endfor -%}{{- ns.batch -}}'
        - wait_template: "{%- set ns = namespace(ok=true) -%}\n{%- for key, desired in expected.items() -%}\n {%- set speed=key.endswith('_speed')\
            \ -%}{%- set device=controls[key[:-6] if speed else key] -%}\n {%- set chosen=namespace(id=device.entity, adopted=false)\
            \ -%}\n {%- for native in device.native -%}{%- if not chosen.adopted and states[native] is not none -%}{%- set\
            \ chosen.id=native -%}{%- set chosen.adopted=true -%}{%- endif -%}{%- endfor -%}\n {%- set report=states[chosen.id]\
            \ -%}\n {%- if report is none or report.state in ['unknown','unavailable','none',''] -%}{%- set ns.ok=false -%}\n\
            \ {%- elif speed -%}{%- if report.attributes.get('percentage', -1) | float(-1) != desired | float -%}{%- set ns.ok=false\
            \ -%}{%- endif -%}\n {%- elif device.fan | default(false) -%}{%- if report.state != desired -%}{%- set ns.ok=false\
            \ -%}{%- endif -%}\n {%- elif report.state | float(-1) != desired | float -%}{%- set ns.ok=false -%}{%- endif\
            \ -%}\n{%- endfor -%}{{- ns.ok -}}"
          timeout: 00:00:08
          continue_on_timeout: true
        - if:
          - condition: template
            value_template: '{{ not wait.completed }}'
          then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ventsys_operating_result
            data:
              value: 'Failed: controller report timeout; requested intents retained; retry to reconcile'
          - stop: 'Operating transition stopped: controller report timeout'
            error: true
    - if:
      - condition: template
        value_template: '{{ not (is_state(''input_boolean.ventsys_failsafe'',''off'') and is_state(''script.ventsys_mode_fire_safe'',''off''))
          }}'
      then:
      - stop: Emergency interrupted operating transition
        error: true
    - action: input_text.set_value
      target:
        entity_id: input_text.ventsys_operating_result
      data:
        value: Targets confirmed by controller reports
