        value_template: '{{ not (is_state(''input_boolean.ventsys_failsafe'',''off'') and is_state(''script.ventsys_mode_fire_safe'',''off''))
          }}'
      then:
      - stop: Failsafe/fire blocks setup tests
        error: true
    - if:
