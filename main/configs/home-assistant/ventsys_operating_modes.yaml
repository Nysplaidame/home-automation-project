        value_template: '{{ not is_state(''script.ventsys_set_operating_mode'',''off'') or not is_state(''script.ventsys_normal_command'',''off'')
          or not is_state(''script.ventsys_dashboard_command'',''off'') or not is_state(''script.ventsys_record_intake_reference'',''off'')
          }}'
