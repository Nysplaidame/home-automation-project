      - stop: Stop operating intents before setup testing; stale requests are rejected
        error: true
    - if:
      - condition: template
        value_template: '{{ is_state(''fan.inline_fan'',''on'') or is_state(''fan.spray_booth_fan'',''on'') }}'
      then:
      - stop: Stop running fans before valve setup testing
        error: true
    - if:
      - condition: template
        value_template: '{%- set ns=namespace(bad=false) -%}{%- if request_key not in test_targets or included is not defined
          or included is string or included is mapping or included is not sequence -%}true{%- elif included | count < 1 or
          included | count > 8 or included | unique | list | count != included | count -%}true{%- else -%}{%- for key in included
          -%}{%- if key is not string or key not in test_targets[request_key] -%}{%- set ns.bad=true -%}{%- endif -%}{%- endfor
          -%}{{- ns.bad -}}{%- endif -%}'
