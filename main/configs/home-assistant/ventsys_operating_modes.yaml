# Generated operating-mode integration. No boot actuation.
input_text:
  ventsys_operating_state:
    name: VentSys requested operating intents
    max: 255
  ventsys_operating_result:
    name: VentSys operating result
    max: 255
script:
  ventsys_set_operating_mode:
    alias: VentSys — set independent operating mode
    mode: single
    max_exceeded: error
    fields:
      zone:
        required: true
      operation:
        required: true
      revision:
        required: true
      strength:
        description: 'Purge level: 2,4,6,8,10; maps to 20,40,60,80,100 percent pending calibration'
    sequence:
    - variables:
        controls:
          main1:
            key: main1
            name: Main duct 1
            short: MAIN-1
            zone: Main duct
            entity: number.main_duct_valve_1
            native:
            - number.ventsys_main_duct_valve_1_valve_position
            topic: ventsys/main/valve1/control
            svg: valve-main-1
            text: valve-main-1-pos
          main2:
            key: main2
            name: Main duct 2
            short: MAIN-2
            zone: Main duct
            entity: number.main_duct_valve_2
            native:
            - number.garage_ventsys_main_duct_valve_2_valve_position
            topic: ventsys/main/valve2/control
            svg: valve-main-2
            text: valve-main-2-pos
          fdm_branch:
            key: fdm_branch
            name: FDM branch
            short: E1 BRANCH
            zone: FDM enclosure
            entity: number.fdm_branch_valve
            native:
            - number.ventsys_e1_branch_valve_valve_position
            topic: ventsys/fdm/branch/control
            svg: valve-enc1-vert
            text: valve-enc1-vert-pos
          fdm_print:
            key: fdm_print
            name: FDM print valve
            short: E1 PRINT
            zone: FDM enclosure
            entity: number.fdm_valve
            native:
            - number.ventsys_fdm_print_valve_valve_position
            topic: ventsys/fdm/valve/control
            svg: valve-enc1-print
            text: enc1-print-pct
          fdm_360:
            key: fdm_360
            name: FDM 360° intake
            short: E1 INTAKE
            zone: FDM enclosure
            entity: number.fdm_360_intake
            native:
            - number.ventsys_sla_360_intake_valve_valve_position
            boardMac: a0:85:e3:ae:5b:c8
            expectedRange:
              min: 30
              max: 60
            topic: ventsys/sla/360/control
            svg: valve-360-enc1
            text: enc1-360-pct
          sla_branch:
            key: sla_branch
            name: SLA branch
            short: E2 BRANCH
            zone: SLA enclosure
            entity: number.sla_branch_valve
