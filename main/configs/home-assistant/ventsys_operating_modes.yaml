      - condition: template
        value_template: '{{ current.fdm | default(''invalid'') != ''off'' or current.sla | default(''invalid'') != ''off''
          or current.booth | default(''invalid'') != ''off'' or revision is not integer or revision != current.revision |
          default(-1) }}'
