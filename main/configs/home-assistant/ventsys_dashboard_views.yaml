# Authenticated standard/touch dashboard, diagnostics, sensor trends and activity.
views:
  - title: VentSys
    path: '0'
    type: panel
    cards:
      - type: custom:ventsys-dashboard-card
  - title: Touch screen
    path: touch
    type: panel
    cards:
      - type: custom:ventsys-dashboard-card
        layout: touch
  - title: Diagnostics
    path: diagnostics
    type: panel
    cards:
      - type: custom:ventsys-diagnostics-card

  - title: Sensor trends
    path: graphs
    type: panel
    cards:
      - type: custom:ventsys-history-card
  - title: Activity
    path: activity
    type: panel
    cards:
      - type: custom:ventsys-activity-card
