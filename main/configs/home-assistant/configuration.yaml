# Canonical live Home Assistant baseline
# Reconciled from HAOS 2026.6.3 on 2026-06-22. Add hardening settings only as
# individually validated changes; do not replace this with stale rebuild prose.

default_config:

ffmpeg:

logger:
  default: warning
  logs:
    custom_components.llamacpp_conversation: debug
    homeassistant.components.assist_pipeline: debug
    homeassistant.components.conversation: debug
    homeassistant.components.stt: debug
    homeassistant.components.tts: debug
    homeassistant.components.wyoming: debug
    homeassistant.helpers.intent: debug

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  internal_url: https://192.168.20.101:8123
  packages: !include_dir_named packages

http:
  ssl_certificate: /ssl/fullchain.pem
  ssl_key: /ssl/privkey.pem
  server_host: 0.0.0.0
  server_port: 8123

# Read-only web-search tool for local LLM conversation agents.
searxng_llm:
  url: http://192.168.20.102:8087
  result_count: 3
  timeout: 15

# Recipe-saving and reading tools for local LLM conversation agents.
mealie_llm:
  url: http://192.168.20.102:9925
  token: !secret mealie_api_token
  result_count: 5
  timeout: 45

# Local conversation agent backed by llama.cpp's OpenAI-compatible API.
# This is local-network only; "OpenAI-compatible" describes the HTTP schema,
# not a dependency on OpenAI cloud services or an OpenAI subscription.
llamacpp_conversation:
  url: http://192.168.20.104:8081/v1
  model: home-assistant-llm
  llm_hass_api:
    - assist
    - searxng_search
    - mealie_recipes
  max_history: 8
  max_tokens: 256
  temperature: 0.1
  timeout: 120
  prompt: |
    You are the local Home Assistant voice assistant for this home.
    Prefer concise, practical answers suitable for speech.
    The client will speak your response when the user is using voice. If the
    user says "verbally", treat that as a request for a normal spoken-friendly
    answer. Never say that you cannot reply verbally.
    Use Home Assistant tools only for home state, home control, or explicitly
    requested household data. Do not call tools for direct response requests
    such as "reply exactly", "say", "repeat", "read", or general chit-chat.
    Use web_search for current information and Mealie tools for saved recipes.
    Preserve recipe quantities exactly as returned by tools. Do not convert
    grams to kilograms or invent quantities from memory.
    After using a tool, answer naturally for speech. Never describe the tool
    result as JSON, and never mention fields such as response_type, data,
    success, failed, or speech unless the user explicitly asks for debugging.
    Ask a short clarification before taking ambiguous or potentially disruptive
    control actions.
    If you use bullet points, make each bullet a complete sentence ending with
    a full stop, question mark, or exclamation mark so text-to-speech pauses.

# Export Home Assistant state history to the monitoring VM's InfluxDB bucket.
influxdb:
  max_retries: 3
  default_measurement: state
  tags:
    source: HA
  tags_attributes:
    - friendly_name
  exclude:
    domains:
      - automation
      - persistent_notification
      - updater
