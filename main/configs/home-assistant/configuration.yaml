# Home Assistant Configuration
# Host: 192.168.20.101 — VLAN 20 (Automation)
# Updated: see ha_vm_setup_guide.md for deployment steps

# ============================================================================
# CORE
# ============================================================================

# Keep HAOS' default integration bundle enabled. Fresh installs include this;
# preserving it avoids disabling built-in integrations during repo-based deploys.
default_config:

homeassistant:
  name: Home
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: metric
  currency: GBP
  country: GB
  time_zone: Europe/London
  external_url: !secret external_url
  internal_url: http://192.168.20.101:8123
  packages: !include_dir_named packages
  allowlist_external_dirs:
    - /config/www
    - /media

# ============================================================================
# HTTP
# ============================================================================

http:
  use_x_forwarded_for: false
  server_host: 0.0.0.0
  server_port: 8123
  ip_ban_enabled: true
  login_attempts_threshold: 5
  # F-16 fix: ban after 5 failed logins. The banned IPs file is at
  # /config/ip_bans.yaml — delete an entry there if you lock yourself out.
  # Uncomment to skip login on VLAN 20 (see Phase 7.4 of ha_vm_setup_guide.md):
  # trusted_networks:
  #   - 192.168.20.0/24

# ============================================================================
# LOGGING
# ============================================================================

logger:
  default: warning
  logs:
    homeassistant.components.mqtt: info
    homeassistant.components.esphome: info
    homeassistant.components.frigate: info

# ============================================================================
# RECORDER
# ============================================================================

recorder:
  purge_keep_days: 30
  commit_interval: 30
  exclude:
    domains:
      - automation
      - script
    entity_globs:
      - sensor.*_signal_strength
      - sensor.*_rssi

# ============================================================================
# HISTORY & LOGBOOK
# ============================================================================
# FIX #30: The `history:` and `logbook:` top-level keys are deprecated since
# HA 2024.6. They still work but generate a deprecation warning on every HA
# startup. Exclusion/inclusion filters for history and logbook are now
# configured via the Recorder integration under `recorder:` (already above),
# or via Settings → System → Logbook / History in the UI.
# The blocks below are retained as comments for reference — the recorder:
# block above already excludes automation, script, and signal strength entities
# which covers the most common use case. Remove these commented blocks
# entirely once you confirm the recorder exclusions meet your needs.

# history:
#   exclude:
#     domains:
#       - automation
#       - script
#       - sun
#     entity_globs:
#       - sensor.*_signal_strength

# logbook:
#   exclude:
#     domains:
#       - script
#     entity_globs:
#       - sensor.*_rssi

# ============================================================================
# INTEGRATIONS (UI-managed — configured via Settings > Integrations)
# ============================================================================
# MQTT:     Mosquitto at 192.168.20.101:1883 (switch to 8883 after TLS)
# ESPHome:  auto-discovers devices on VLAN 50 after adoption
# Frigate:  http://192.168.30.20:8971  (port 8971 for Frigate 0.14+; use port 5000 for older versions)
# Mobile:   for push notifications

# ============================================================================
# FRONTEND
# ============================================================================

frontend:
  themes: !include_dir_merge_named themes

# ============================================================================
# INCLUDES
# ============================================================================

automation: !include automations.yaml
# FIX #2: `scripts.yaml` and `scenes.yaml` never existed as standalone files —
# all scripts are defined inline inside packages (ventsys_ha_scripts.yaml,
# bambuddy_p1s_package.yaml). HA throws a hard startup error on a missing
# !include target, so both lines are removed. If standalone scripts.yaml or
# scenes.yaml are added in future, re-add the corresponding !include line
# and create the file first.
#
# script: !include scripts.yaml   ← removed: file does not exist
# scene:  !include scenes.yaml    ← removed: file does not exist, no scenes defined

# ============================================================================
# SECRETS REFERENCE — /config/secrets.yaml must contain:
# ============================================================================
# home_latitude: 51.xxxx
# home_longitude: -0.xxxx
# home_elevation: 10
# external_url: https://your-vpn-or-domain
# mqtt_username: mqtt
# mqtt_password: your-mqtt-password
