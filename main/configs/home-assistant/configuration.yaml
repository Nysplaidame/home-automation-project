# Canonical live Home Assistant baseline
# Reconciled from HAOS 2026.6.3 on 2026-06-22. Add hardening settings only as
# individually validated changes; do not replace this with stale rebuild prose.

default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

homeassistant:
  packages: !include_dir_named packages

# Read-only web-search tool for local LLM conversation agents.
searxng_llm:
  url: http://192.168.20.102:8087
  result_count: 3
  timeout: 15

# Recipe-saving and reading tools for local LLM conversation agents.
mealie_llm:
  url: http://192.168.20.102:9925
  token: !secret mealie_api_token
  result_count: 5
  timeout: 45

# Export Home Assistant state history to the monitoring VM's InfluxDB bucket.
influxdb:
  max_retries: 3
  default_measurement: state
  tags:
    source: HA
  tags_attributes:
    - friendly_name
  exclude:
    domains:
      - automation
      - persistent_notification
      - updater
