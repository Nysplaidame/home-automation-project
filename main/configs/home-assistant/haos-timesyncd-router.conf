# Home Assistant OS time sync override
# Target path on HAOS: /etc/systemd/timesyncd.conf
# Purpose: make Home Assistant derive time from the local OpenWrt router NTP
# server on the Automation VLAN. ESPHome/VentSys devices then receive
# router-derived time indirectly through `time: platform: homeassistant`.
#
# Apply via a Home Assistant OS CONFIG import or by editing the HAOS host
# timesyncd.conf from the HAOS host shell. Do not place this file in /config;
# it is OS-level configuration, not Home Assistant Core YAML.

[Time]
NTP=192.168.20.1
FallbackNTP=
