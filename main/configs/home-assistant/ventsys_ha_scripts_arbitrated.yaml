  ventsys_ramp_valve:
    alias: VentSys — Set Valve Target
    mode: parallel
    max: 16
    fields:
      topic:
        description: MQTT command topic (e.g. ventsys/main/valve1/control)
        example: ventsys/main/valve1/control
        required: true
        selector:
          text: null
      entity_id:
        description: HA entity matching the topic; kept for caller compatibility
        example: number.main_duct_valve_1
        required: true
        selector:
          entity:
            domain: number
      target:
        description: Target position, 0-100 full range
        example: 100
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
      duration_ms:
        description: Compatibility field; ignored because hardware commands are direct
        example: 0
        default: 0
        selector:
          number:
            min: 0
            max: 10000
            step: 100
    sequence:
    - action: script.ventsys_normal_command
      data:
        commands:
        - topic: '{{ topic }}'
          payload: '{{ target | int | string }}'
